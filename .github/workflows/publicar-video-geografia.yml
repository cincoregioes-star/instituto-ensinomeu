name: Reconstruir e publicar videoaulas gratuitas de Geografia
on:
  push:
    branches: [main]
    paths:
      - "videos/9ano/geografia/.partes/**"
      - ".github/workflows/publicar-video-geografia.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruir arquivos MP4 originais e conferir integridade
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="videos/9ano/geografia"
          originais=("$dir/.partes/aula01-globalizacao.mp4.part"*)
          if (( ${#originais[@]} > 0 )); then
            test "${#originais[@]}" -eq 10
            cat "${originais[@]}" > "$dir/aula01-globalizacao.mp4"
            echo "775f90bfd3d9c3bdc49d094fe3bdc0eb864b07a27a965978cae4e000a7bf6751  $dir/aula01-globalizacao.mp4" | sha256sum -c -
            test "$(stat -c%s "$dir/aula01-globalizacao.mp4")" -eq 18597020
            rm -f "${originais[@]}"
          fi
          partes=("$dir/.partes/aula02-transnacionais.mp4.part"*)
          if (( ${#partes[@]} > 0 )); then
            test "${#partes[@]}" -eq 22
            cat "${partes[@]}" > "$dir/aula02-transnacionais.mp4"
            echo "ef323714f5f08fa017d240ebc8c5e12bfea04b001bb006d760ab4c4e80fde72a  $dir/aula02-transnacionais.mp4" | sha256sum -c -
            test "$(stat -c%s "$dir/aula02-transnacionais.mp4")" -eq 19349858
            rm -f "${partes[@]}"
          fi
          rmdir "$dir/.partes" 2>/dev/null || true
      - name: Publicar MP4 validado no Instituto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos/9ano/geografia
          if ! git diff --cached --quiet; then
            git commit -m "Publicar videoaula 02 de Geografia com voz Fernanda"
            git push origin HEAD:main
          fi
