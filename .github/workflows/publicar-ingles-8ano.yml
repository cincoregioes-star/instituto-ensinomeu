name: Publicar Inglês 8º ano — Aula 01
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar MP4 e conferir integridade
        shell: bash
        run: |
          set -euo pipefail
          destino="videos/8ano/ingles/aula01-skimming-scanning.mp4"
          mkdir -p "$(dirname "$destino")"
          checksum="bf3e4088f3985a97c492ac8cb850cd1f940076bdb9a08c8ca379ea979c0fa1e7"
          tamanho=57694274
          if [ -s "$destino" ]; then
            echo "$checksum  $destino" | sha256sum -c -
          else
            python -m pip install --quiet 'gdown==5.2.0'
            tmp="$(mktemp --suffix=.mp4)"
            trap 'rm -f "$tmp"' EXIT
            gdown --id "1jcldnU2Nt0qkLqkG1OXulWtGrHRpJ_Zn" --output "$tmp"
            test "$(stat -c%s "$tmp")" -eq "$tamanho"
            echo "$checksum  $tmp" | sha256sum -c -
            mv "$tmp" "$destino"
            trap - EXIT
          fi
      - name: Criar página da videoaula e vincular trilha
        shell: bash
        run: |
          set -euo pipefail
          cat > ingles-8ano.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#082c44"><meta name="description" content="Aula 01 de Inglês do 8º ano — Skimming e Scanning, Instituto EnsinoMeu.">
          <link rel="icon" type="image/png" href="assets/favicon.png"><title>Inglês 8º ano — Aula 01 | Instituto EnsinoMeu</title>
          <style>
          :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#edf6f5;color:#102d42;font:16px/1.6 system-ui,"Segoe UI",sans-serif}
          header,footer{background:#082b44;color:white}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 18px}
          .wrap{max-width:1120px;margin:auto;padding:0 18px}.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none;font-weight:900}.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:white}
          header nav a{color:#e7faf3;text-decoration:none;font-weight:750;margin-left:14px}.hero{background:linear-gradient(120deg,#063b39,#092e4c);color:white;padding:38px 0;border-bottom:5px solid #d9ae4d}
          .eyebrow{font-size:13px;font-weight:850;color:#f1cd75;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(26px,4vw,45px);line-height:1.13;margin:12px 0}main{padding-top:27px!important;padding-bottom:50px!important}
          .player{position:relative;background:#03111d;border-radius:16px;overflow:hidden;box-shadow:0 16px 35px #092c4430}.player video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}
          .player:fullscreen{display:flex;align-items:center;background:black;width:100vw;height:100vh;border-radius:0}.player:fullscreen video{height:100vh}
          .actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.btn{padding:12px 18px;border:0;border-radius:11px;background:#086a51;color:white;cursor:pointer;text-decoration:none;font-weight:850;font-size:15px}
          .btn.alt{background:#0a4971}.summary{background:white;border:1px solid #ccded9;border-radius:15px;padding:22px;margin:25px 0}h2{font-size:23px;margin-top:0}.summary li{margin:9px 0}
          footer{text-align:center;padding:23px}a:focus-visible,button:focus-visible{outline:3px solid #d8a938;outline-offset:4px}
          </style>
          <link rel="stylesheet" href="ensino-visual-forte-v744.css?v=7441"><link rel="stylesheet" href="ensino-cores-v8.css?v=8"></head>
          <body><header><div class="wrap"><a class="brand" href="./"><img src="assets/brasao.png" alt="">INSTITUTO ENSINOMEU</a><nav><a href="./">Início</a><a href="apostilas.html">Apostilas</a><a href="login.html">Área do aluno</a></nav></div></header>
          <section class="hero"><div class="wrap"><span class="eyebrow">8º ano · 1º trimestre · Aula 01 gratuita</span>
          <h1>Inglês — Estratégias de Leitura: Skimming e Scanning</h1>
          <p>Aprenda a reconhecer o assunto geral de um texto e localizar informações específicas como dia, horário e lugar.</p>
          <p>40 imagens originais · 11min01s · Full HD · Narração Fernanda (PT-BR)</p></div></section>
          <main class="wrap"><div class="player" id="player"><video id="aula" controls playsinline preload="metadata" aria-label="Inglês 8º ano, aula 01, Skimming e Scanning">
          <source src="videos/8ano/ingles/aula01-skimming-scanning.mp4" type="video/mp4">Seu navegador não suporta MP4.</video></div>
          <div class="actions"><button class="btn" id="tela" type="button">⛶ Tela cheia</button><a class="btn alt" href="videos/8ano/ingles/aula01-skimming-scanning.mp4" download="EnsinoMeu_Ingles_8ano_Aula01.mp4">↓ Baixar vídeo</a><a class="btn alt" href="./">← Voltar ao Instituto</a></div>
          <section class="summary"><h2>O que você vai aprender</h2><ul><li><strong>Skimming:</strong> leitura rápida para compreender o assunto geral.</li><li><strong>Scanning:</strong> localizar detalhes como data, horário e lugar.</li><li>Interpretar avisos escolares em inglês usando títulos, imagens e palavras-chave.</li><li>Verificar a resposta no texto sem precisar traduzir todas as palavras.</li></ul><p>Material de reforço escolar baseado na apostila T1 de Língua Inglesa, 8º ano.</p></section></main>
          <footer>Instituto EnsinoMeu © 2026 · Educação complementar digital</footer>
          <script>document.getElementById('tela').onclick=()=>{const p=document.getElementById('player'),v=document.getElementById('aula');if(p.requestFullscreen)p.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};</script>
          <script src="voltar-global.js?v=20261105" defer></script></body></html>
          HTML
          python - <<'PY'
          from pathlib import Path
          p=Path('ensino-trilha.js')
          s=p.read_text(encoding='utf-8')
          entry=" 'fii-8-lingua-inglesa':{1:'ingles-8ano.html'},"
          if entry not in s:
              anchor=" 'fii-8-historia':{1:'historia-8ano.html'},"
              if anchor not in s:
                  raise SystemExit('Mapa de trilha mudou; não alterar automaticamente')
              s=s.replace(anchor,anchor+'\n'+entry,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar página, MP4 e vínculo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- videos/8ano/ingles/aula01-skimming-scanning.mp4 ingles-8ano.html ensino-trilha.js
          if git diff --cached --quiet; then
            echo "Videoaula já publicada."
            exit 0
          fi
          git commit -m "Publicar Ingles 8o ano aula 01 em video Full HD"
          for tentativa in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflito de atualização; interrompido sem sobrescrever."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Publicação concluída."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Não foi possível enviar ao ramo main."
          exit 1
