name: Publicar videoaula de Arte — 9º ano
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-video-arte.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar-arte:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout do Instituto EnsinoMeu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Obter e conferir o vídeo completo da Professora Francisca
        shell: bash
        run: |
          set -euo pipefail
          destino="videos/9ano/arte/aula01-arte-cultura-identidade.mp4"
          checksum="8b70541ca762f4cb66fb163050833ddb4b5e03a4bff8fafbf71a4afc80166004"
          tamanho=56850095
          mkdir -p "$(dirname "$destino")"
          if [ -s "$destino" ]; then
            echo "$checksum  $destino" | sha256sum -c -
            echo "Vídeo já presente e íntegro."
            exit 0
          fi
          python -m pip install --quiet 'gdown==5.2.0'
          tmp="$(mktemp --suffix=.mp4)"
          trap 'rm -f "$tmp"' EXIT
          gdown --id "19wrwyXoJTLednvE0CrV5FJnto4AfEMa6" --output "$tmp"
          test "$(stat -c%s "$tmp")" -eq "$tamanho"
          echo "$checksum  $tmp" | sha256sum -c -
          mv "$tmp" "$destino"
          trap - EXIT
          echo "Áudio e vídeo preservados pelo checksum SHA-256"
      - name: Enviar MP4 validado para o GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- videos/9ano/arte/aula01-arte-cultura-identidade.mp4
          if git diff --cached --quiet; then
            echo "Arquivo já publicado, sem alterações."
            exit 0
          fi
          git commit -m "Publicar videoaula de Arte 9o ano com voz da Professora Francisca"
          for tentativa in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Alteração concorrente detectada; publicação interrompida sem sobrescrever dados."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "MP4 de Arte publicado."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Falha ao publicar MP4 após quatro tentativas."
          exit 1
