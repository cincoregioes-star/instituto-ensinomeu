name: Auditoria estrutural EnsinoMeu
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.xml'
      - 'tests/**'
      - '.github/workflows/auditoria-site.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos scripts
        run: |
          node --check site.js
          node --check cadastro.js
          node --check ensino-auth.js
          node --check ensino-painel.js
          node --check ensino-admin.js
      - name: Conferir HTML, navegação, cadastro e CSS
        run: node tests/auditoria-site.mjs
      - name: Auditar SEO, sitemap e indexação segura
        run: node tests/auditoria-seo.mjs
      - name: Instalar dependência do teste visual
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Testar site no navegador Chromium
        run: |
          node --check tests/auditoria-visual.mjs
          node tests/auditoria-visual.mjs
      - name: Guardar capturas de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensino-auditoria-visual
          path: artifacts/screenshots/
          if-no-files-found: ignore
