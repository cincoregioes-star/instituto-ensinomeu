<script>
'use strict';
/** Aula 01, Geografia 9º ano: Globalização: como o mundo está conectado.
 * BNCC principal EF09GE05 e complementar EF09GE02.
 * 20 questões originais, em dois blocos, com feedback imediato e gabarito comentado.
 * Todo o conteúdo é local. O áudio MP3 pode depender da conexão; há efeitos de reserva.
 */
const QUESTIONS = [
 {topic:'Conceito de globalização',level:'Compreensão',base:'Um aplicativo reúne usuários de diferentes países, enquanto uma loja vende produtos fabricados em vários continentes.',q:'Qual ideia melhor explica essas situações?',options:['A eliminação completa das fronteiras entre países.','A intensificação das conexões econômicas, culturais e informacionais.','O isolamento das economias nacionais.','O fim das desigualdades sociais e territoriais.'],correct:1,explain:'Globalização é a intensificação das conexões entre lugares por redes de comércio, tecnologia, transporte e comunicação. As fronteiras e as desigualdades continuam existindo.'},
 {topic:'Evolução das conexões',level:'Compreensão',base:'Ao longo do tempo, navios, ferrovias, aviões e a internet reduziram obstáculos à circulação.',q:'O que contribuiu para a ampliação das conexões mundiais?',options:['A substituição de todas as viagens por reuniões virtuais.','A redução da produção industrial no planeta.','Os avanços nos transportes e nas telecomunicações.','O desaparecimento de barreiras culturais e políticas.'],correct:2,explain:'Novas técnicas de transporte e comunicação aceleraram a circulação de pessoas, bens e informações. Esse processo tem uma história e não começou apenas com a internet.'},
 {topic:'Fluxos materiais',level:'Compreensão',base:'Um navio sai de um porto carregado de contêineres com roupas e equipamentos destinados a outros países.',q:'Esse deslocamento é exemplo de qual tipo de fluxo?',options:['Fluxo material de mercadorias.','Fluxo exclusivo de dados digitais.','Fluxo de ideias sem suporte físico.','Fluxo apenas financeiro.'],correct:0,explain:'Mercadorias são bens físicos; seu transporte forma fluxos materiais. Dados, mensagens e serviços digitais são exemplos de fluxos imateriais.'},
 {topic:'Fluxos imateriais',level:'Aplicação',base:'Uma estudante de Beberibe participa de uma aula ao vivo transmitida por uma universidade de outro país.',q:'O que circula principalmente nessa situação?',options:['Minérios por rodovias.','Produtos agrícolas por navios.','Contêineres por vias férreas.','Informações e conhecimentos por redes digitais.'],correct:3,explain:'A transmissão digital de uma aula envolve fluxos imateriais, como dados, imagens, voz e conhecimento, que podem atravessar distâncias rapidamente.'},

 {topic:'Síntese crítica da aula',level:'Síntese',base:'Uma reportagem celebra a velocidade das redes globais, mas mostra trabalhadores precarizados e comunidades com acesso desigual à tecnologia.',q:'Qual conclusão sintetiza melhor a aula sobre globalização?',options:['A globalização beneficia sempre todas as pessoas da mesma forma.','Os problemas sociais desapareceram com a internet.','Somente os transportes explicam todas as mudanças do mundo.','A integração mundial cria oportunidades e desafios, com efeitos desiguais.'],correct:3,explain:'É necessário analisar vantagens e problemas da integração: circulação de bens e ideias, interdependência, diversidade cultural, desigualdades e impactos ambientais.'}

const TOTAL = QUESTIONS.length;
const STORAGE_KEY = 'ensinomeu_geo9_aula01_simulado_v1';
const app=document.getElementById('app');
const audioBg=document.getElementById('audio-bg');
const audioCorrect=document.getElementById('audio-correct');
const audioWrong=document.getElementById('audio-wrong');
audioBg.volume=.06;audioCorrect.volume=.45;audioWrong.volume=.45;
let soundOn=true,ctx=null,ambientNodes=[],ambientPlaying=false;
let stage='welcome';
let current=0,reviewIndex=0,startedAt=0,elapsed=0;
let answers=Array(TOTAL).fill(null),orders=Array(TOTAL).fill(null);
let clock=null;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function randomOrder(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({current,answers,orders,elapsed,startedAt,finished:stage==='result'}));}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!x||!Array.isArray(x.answers)||x.answers.length!==TOTAL)return false;answers=x.answers.map(n=>Number.isInteger(n)&&n>=0&&n<=3?n:null);orders=(Array.isArray(x.orders)?x.orders:[]).map(o=>Array.isArray(o)&&o.length===4&&new Set(o).size===4?o:null);while(orders.length<TOTAL)orders.push(null);current=Number.isInteger(x.current)?Math.min(TOTAL-1,Math.max(0,x.current)):0;elapsed=Number.isFinite(x.elapsed)?Math.max(0,x.elapsed):0;startedAt=0;return true;}catch(e){return false;}}
function correctCount(){return answers.reduce((n,a,i)=>n+(a===QUESTIONS[i].correct?1:0),0)}
function answeredCount(){return answers.filter(a=>a!==null).length}
function formatTime(seconds){const n=Math.floor(seconds);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function startClock(){stopClock();startedAt=Date.now();clock=setInterval(()=>{if(stage!=='quiz')return;const el=document.getElementById('timer');if(el)el.textContent="⏱ "+formatTime(elapsed+Math.floor((Date.now()-startedAt)/1000));},1000)}
function stopClock(){if(clock){clearInterval(clock);clock=null;}if(startedAt){elapsed+=Math.max(0,Math.floor((Date.now()-startedAt)/1000));startedAt=0;}}
function ensureAudioContext(){if(!soundOn)return null;try{const Constructor=window.AudioContext||window.webkitAudioContext;if(!Constructor)return null;if(!ctx)ctx=new Constructor();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx;}catch(e){return null;}}
function beep(isCorrect){if(!soundOn)return;const ac=ensureAudioContext();if(!ac)return;const notes=isCorrect?[660,880,1100]:[360,240];notes.forEach((hz,i)=>{const osc=ac.createOscillator(),gain=ac.createGain(),t=ac.currentTime+i*.09;osc.type=isCorrect?'sine':'triangle';osc.frequency.setValueAtTime(hz,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+.14);osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+.15);});}
function ambientFallback(){if(!soundOn||ambientPlaying||stage!=='quiz')return;const ac=ensureAudioContext();if(!ac)return;ambientPlaying=true;[110,164.81,220].forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=hz;g.gain.value=.0045/(i+1);o.connect(g);g.connect(ac.destination);o.start();ambientNodes.push([o,g]);});}
function stopAmbient(){ambientNodes.forEach(([o])=>{try{o.stop()}catch(e){}try{o.disconnect()}catch(e){}});ambientNodes=[];ambientPlaying=false;}
function startMusic(){if(!soundOn||stage!=='quiz')return;ensureAudioContext();audioBg.play().then(()=>stopAmbient()).catch(()=>ambientFallback());}
function stopMusic(){audioBg.pause();stopAmbient()}
function playEffect(correct){if(!soundOn)return;const audio=correct?audioCorrect:audioWrong;try{audio.currentTime=0;const p=audio.play();if(p&&typeof p.catch==='function')p.catch(()=>beep(correct));}catch(e){beep(correct)}}
function toggleSound(){soundOn=!soundOn;const b=document.getElementById('soundToggle');b.textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';b.setAttribute('aria-pressed',String(soundOn));b.setAttribute('aria-label',soundOn?'Desligar sons':'Ligar sons');if(soundOn)startMusic();else {stopMusic();audioCorrect.pause();audioWrong.pause();}}
document.getElementById('soundToggle').addEventListener('click',toggleSound);
function resetData(){stopClock();stopMusic();answers=Array(TOTAL).fill(null);orders=Array(TOTAL).fill(null);current=0;elapsed=0;startedAt=0;try{localStorage.removeItem(STORAGE_KEY)}catch(e){}}
function startQuiz(fresh=false){if(fresh)resetData();stage='quiz';if(!orders[current])orders[current]=randomOrder();startClock();render();save();startMusic();}
function goHome(){if(stage==='quiz')stopClock();stage='welcome';stopMusic();save();render();}
function newTry(){if(answeredCount()&& !window.confirm('Reiniciar o simulado? As respostas desta tentativa serão apagadas.'))return;startQuiz(true)}
function startOrResume(){startQuiz(answeredCount()===TOTAL||answeredCount()===0)}
function choose(choice){if(stage!=='quiz'||answers[current]!==null)return;const q=QUESTIONS[current];if(!Number.isInteger(choice)||choice<0||choice>=4)return;answers[current]=choice;playEffect(choice===q.correct);save();render();}
function navigate(delta){if(stage!=='quiz')return;if(delta>0&&answers[current]===null)return;if(current+delta<0)return;if(current+delta>=TOTAL){if(answeredCount()<TOTAL){const next=answers.findIndex(a=>a===null);current=next;render();save();return;}showResult();return;}current+=delta;if(!orders[current])orders[current]=randomOrder();render();save()}
function showResult(){const newFinish=stage==='quiz';if(newFinish)stopClock();stage='result';stopMusic();save();if(newFinish)recordGamerAttempt();render()}
function reviewQuestion(index=0){stage='review';reviewIndex=Math.max(0,Math.min(TOTAL-1,index));render()}
function getFeedback(percent){if(percent>=90)return 'Excelente! Você relacionou com segurança as redes globais e seus efeitos no território.';if(percent>=70)return 'Muito bom! Você compreendeu os conceitos centrais. Revise os pontos destacados no gabarito.';if(percent>=50)return 'Bom começo! Releia os comentários das questões para fortalecer sua análise geográfica.';return 'Este resultado mostra o que revisar. Retome a aula e estude as explicações antes de refazer.'}
function renderWelcome(){const done=answeredCount(),pct=Math.round(done/TOTAL*100);return `<section class="stage"><div class="panel welcome"><div class="welcome-left"><div class="kicker">Avaliação digital · 1º trimestre</div><h2>GLOBALIZAÇÃO<span>:<br>como o mundo está conectado</span></h2><p>Transforme a Aula 01 em prática: interprete situações reais, identifique redes, analise cadeias produtivas e compreenda oportunidades e desigualdades da integração mundial.</p><div class="pill-row"><span class="pill">20 questões inéditas</span><span class="pill">2 blocos de 10</span><span class="pill">Gabarito comentado</span><span class="pill">Sem limite de tempo</span><span class="pill">BNCC · EF09GE05</span></div><div class="welcome-cta"><button class="primary" onclick="startOrResume()">${done===TOTAL?'↻ Refazer avaliação':done>0?'▶ Continuar · '+pct+'%':'▶ Iniciar simulado'}</button>${done>0&&done<TOTAL?'<button class="secondary danger-outline" onclick="newTry()">Reiniciar do zero</button>':''}</div></div><div class="welcome-right"><h3>Trilha de aprendizagem da aula</h3><div class="topic-card"><h4>01 · Fundamentos e conexões</h4><p>Questões 1 a 10: conceito, transportes, comunicação, fluxos materiais e imateriais, redes, cadeias produtivas e empresas transnacionais.</p></div><div class="topic-card"><h4>02 · Território e pensamento crítico</h4><p>Questões 11 a 20: interdependência, cultura, exclusão digital, Brasil e Ceará, ambiente, consumo e desigualdades globais.</p></div></div></div></section>`}
function renderQuiz(){const q=QUESTIONS[current],choice=answers[current],answered=choice!==null,correct=choice===q.correct,order=orders[current]||(orders[current]=randomOrder());const progress=answeredCount()/TOTAL*100;const block=current<10?'BLOCO 01 · REDES E FLUXOS':'BLOCO 02 · IMPACTOS E TERRITÓRIO';return `<section class="stage"><div class="quiz-top"><div class="quiz-meta"><span><strong>QUESTÃO ${String(current+1).padStart(2,'0')}</strong> / ${TOTAL}</span><span>${block}</span><span><em>✓ ${correctCount()} acertos</em></span><span id="timer">⏱ ${formatTime(elapsed+Math.floor((startedAt?Date.now()-startedAt:0)/1000))}</span></div><span class="chip">${Math.round(progress)}% respondido</span><div class="progress-rail" role="progressbar" aria-label="Progresso do simulado" aria-valuenow="${answeredCount()}" aria-valuemin="0" aria-valuemax="${TOTAL}"><div class="progress-fill" style="width:${progress}%"></div></div></div><div class="quiz-body"><section class="panel question-panel ${answered?'answered':''}" aria-label="Enunciado"><div class="eyebrow"><span>${escapeHtml(q.topic)}</span><span>${escapeHtml(q.level)}</span></div><div class="question-context"><span class="label">BASE PARA INTERPRETAÇÃO</span>${escapeHtml(q.base)}</div><div class="question-statement"><span class="label">PERGUNTA</span>${escapeHtml(q.q)}</div>${answered?`<div class="feedback ${correct?'is-correct':'is-wrong'}" role="status"><h3>${correct?'✓ Resposta correta!':'✕ Resposta incorreta'}</h3><p style="margin:0">${escapeHtml(q.explain)}</p></div>`:`<div class="hint">Selecione uma alternativa para receber a explicação imediatamente. Depois, clique em <strong>Próxima questão</strong>.</div>`}</section><section class="panel answer-panel" aria-label="Alternativas"><div class="answers-title">ESCOLHA UMA DAS QUATRO ALTERNATIVAS</div><div class="answers">${order.map((original,position)=>{const chosen=choice===original,truth=original===q.correct;const cls=answered?(truth?'correct':chosen?'wrong':'dimmed'):'';return `<button type="button" class="option ${cls}" onclick="choose(${original})" ${answered?'disabled':''} aria-label="Alternativa ${'ABCD'[position]}: ${escapeHtml(q.options[original])}"><span class="letter">${answered&&truth?'✓':answered&&chosen?'✕':'ABCD'[position]}</span><span>${escapeHtml(q.options[original])}</span></button>`}).join('')}</div><div class="answer-note">Alternativas embaralhadas · Uma resposta por questão</div></section></div><div class="quiz-footer"><div class="footer-actions"><button class="secondary danger-outline" onclick="goHome()">⌂ Menu</button><button class="secondary" onclick="navigate(-1)" ${current===0?'disabled':''}>← Anterior</button></div><div class="footer-help">${answered?'Explicação exibida · Você pode avançar':'Responda para desbloquear a próxima'}</div><button class="primary" onclick="navigate(1)" ${!answered?'disabled aria-disabled="true" style="opacity:.47;cursor:not-allowed"':''}>${current===TOTAL-1?'Ver resultado ✓':'Próxima →'}</button></div></section>`}

const GAMER_HISTORY_KEY='ensino_gamer_history_geografia-9ano-aula01';
function previousScores(){try{return JSON.parse(localStorage.getItem(GAMER_HISTORY_KEY)||'[]')||[]}catch{return []}}
function recordGamerAttempt(){
 const score=correctCount(),record={right:score,total:TOTAL,pct:Math.round(score*100/TOTAL),when:new Date().toISOString(),seconds:elapsed};
 try{localStorage.setItem(GAMER_HISTORY_KEY,JSON.stringify([record,...previousScores()].slice(0,30)))}catch{}
 (async()=>{
  const status=()=>document.getElementById('sync-status');
  try{
   const cfg=window.ENSINOMEU_CONFIG||{};
   const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.1/+esm');
   const client=lib.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
   const session=await client.auth.getSession();
   const token=session.data.session?.access_token;
   if(!token){if(status())status().textContent='Histórico salvo neste navegador; faça login no Instituto para registrar online.';return}
   const req=await fetch(cfg.supabaseUrl+'/functions/v1/ensino-indicadores/enviar',{method:'POST',
     headers:{apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},
     body:JSON.stringify({slug:'geografia-9ano-aula01',answers,seconds:elapsed,tentativa:crypto.randomUUID()})});
   const result=await req.json().catch(()=>({detail:'Erro de comunicação'}));
   if(!req.ok)throw Error(result.detail||'Erro no registro');
   if(status())status().textContent='✓ Resultado sincronizado com seu dashboard de aprendizagem.';
  }catch(err){if(status())status().textContent='Pontuação salva neste navegador, mas sem sincronização online.'}
 })();
}
function resultExtras(){
 const p=Math.round(correctCount()*100/TOTAL),h=previousScores(),last=h[0]?.pct??p,best=h.length?Math.max(...h.map(x=>x.pct)):p;
 const wrong=new Map();QUESTIONS.forEach((q,i)=>{if(answers[i]!==q.correct)wrong.set(q.topic,(wrong.get(q.topic)||0)+1)});
 const priority=[...wrong.entries()].sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(' e ')||'Nenhum ponto crítico nesta tentativa.';
 return '<div class="result-info" style="display:flex;gap:13px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:conic-gradient(#39ff14 0% '+p+'%,#ff00e6 '+p+'% 100%)"><b style="border-radius:50%;background:#151922;padding:9px;color:white">'+p+'%</b></div><div><b>Último: '+last+'% · Melhor: '+best+'%</b><p style="margin:3px 0;font-size:12px">Revisar: '+escapeHtml(priority)+'</p></div></div><p id="sync-status" style="font-size:12px;color:var(--yellow);margin:7px 0">Confira também seu <a href="../dashboard-aluno.html" style="color:var(--blue)">dashboard online</a>.</p>';
}

function renderResult(){const score=correctCount(),pct=Math.round(score/TOTAL*100),wrong=TOTAL-score;return `<section class="stage"><div class="panel result"><div class="result-left"><div class="kicker">Avaliação concluída · Aula 01</div><h2>Seu desempenho</h2><div class="score-number">${pct}% <span>· ${score}/${TOTAL}</span></div><p class="score-legend">Geografia · 9º ano · Aula 01 · 20 questões · Nota pedagógica, não oficial do ENEM.</p><div class="welcome-cta"><button class="primary" onclick="reviewQuestion(0)">📚 Gabarito comentado</button><button class="secondary" onclick="newTry()">↻ Refazer 20 questões</button><button class="secondary danger-outline" onclick="goHome()">⌂ Menu</button></div></div><div class="result-right"><div class="metric-grid"><div class="metric"><b>${score}</b><span>Acertos</span></div><div class="metric"><b>${wrong}</b><span>Erros</span></div><div class="metric"><b>${formatTime(elapsed)}</b><span>Tempo</span></div></div><div class="result-info"><strong style="color:var(--yellow)">Devolutiva pedagógica</strong><p style="margin:8px 0 0">${getFeedback(pct)}</p></div><div class="result-info"><strong style="color:var(--blue)">Objetivos de aprendizagem</strong><p style="margin:8px 0 0">Analisar redes econômicas, culturais e digitais e seus efeitos nos territórios. BNCC: EF09GE05 e EF09GE02.</p></div>${resultExtras()}</div></div></section>`}
function renderReview(){const q=QUESTIONS[reviewIndex],given=answers[reviewIndex],isRight=given===q.correct;return `<section class="stage"><div class="quiz-top"><div class="quiz-meta"><strong>GABARITO COMENTADO</strong><span>QUESTÃO ${reviewIndex+1} / ${TOTAL}</span><span style="color:${isRight?'var(--green)':'var(--red)'}">${isRight?'✓ Acertou':'✕ Errou'}</span></div><span class="chip">${Math.round(correctCount()/TOTAL*100)}% de acertos</span><div class="progress-rail"><div class="progress-fill" style="width:${(reviewIndex+1)/TOTAL*100}%"></div></div></div><div class="quiz-body"><section class="panel question-panel review-question"><div class="eyebrow">${escapeHtml(q.topic)}</div><div class="question-context"><span class="label">SITUAÇÃO</span>${escapeHtml(q.base)}</div><div class="question-statement"><span class="label">PERGUNTA</span>${escapeHtml(q.q)}</div><div class="feedback"><h3>Por que esta é a resposta?</h3>${escapeHtml(q.explain)}</div></section><section class="panel answer-panel"><div class="answers-title">CONFERÊNCIA DAS ALTERNATIVAS</div><div class="answers">${(orders[reviewIndex]||[0,1,2,3]).map((idx,p)=>`<div class="option ${idx===q.correct?'correct':idx===given?'wrong':'dimmed'}" role="group"><span class="letter">${idx===q.correct?'✓':idx===given?'✕':'ABCD'[p]}</span><span>${escapeHtml(q.options[idx])}</span></div>`).join('')}</div><div class="answer-note">Verde: correta · Vermelho: sua resposta incorreta</div></section></div><div class="quiz-footer"><div class="footer-actions"><button class="secondary danger-outline" onclick="showResult()">← Resultado</button><button class="secondary" onclick="reviewMove(-1)" ${reviewIndex===0?'disabled':''}>← Anterior</button></div><div class="footer-help">Reveja explicações para consolidar a aprendizagem</div><button class="primary" onclick="reviewMove(1)">${reviewIndex===TOTAL-1?'Concluir revisão ✓':'Próxima →'}</button></div></section>`}
function reviewMove(step){if(reviewIndex+step>=TOTAL){showResult();return;}reviewIndex=Math.max(0,reviewIndex+step);render()}
function render(){app.innerHTML=stage==='quiz'?renderQuiz():stage==='result'?renderResult():stage==='review'?renderReview():renderWelcome()}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(stage==='quiz'){if(['1','2','3','4'].includes(e.key)&&answers[current]===null){const pos=Number(e.key)-1;choose((orders[current]||[0,1,2,3])[pos])}else if(e.key==='Enter'&&answers[current]!==null){navigate(1)}else if(e.key==='ArrowLeft'&&current>0)navigate(-1)}else if(stage==='review'){if(e.key==='ArrowRight')reviewMove(1);if(e.key==='ArrowLeft')reviewMove(-1)}if(e.key.toLowerCase()==='m'&&e.target.tagName!=='INPUT')toggleSound()});
window.addEventListener('beforeunload',()=>{if(stage==='quiz')stopClock();save()});
load();render();
</script>
</body>
</html>
