<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espanhol Gratuito ENEM</title>
  <style>
    :root{
      --bg:#05070c;
      --card:#11141b;
      --card2:#171b24;
      --blue:#00f3ff;
      --pink:#ff00e6;
      --green:#39ff14;
      --red:#ff003c;
      --yellow:#ffd400;
      --text:#ffffff;
      --muted:#cfcfcf;
      --line:rgba(255,255,255,.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#000;
      color:var(--text);
      min-height:100vh;
      padding:20px 12px 40px;
      text-align:center;
      overflow-x:hidden;
    }

    header{
      max-width:1100px;
      margin:0 auto 24px;
      border:2px solid var(--blue);
      border-radius:24px;
      padding:22px 16px;
      background:linear-gradient(180deg,#0c0f16,#090b11);
      box-shadow:0 0 22px rgba(0,243,255,.22);
    }

    header h1{
      color:var(--blue);
      font-size:clamp(2rem,4vw,3rem);
      text-shadow:0 0 14px rgba(0,243,255,.7);
      font-weight:900;
    }

    header p{
      margin-top:10px;
      color:var(--pink);
      font-weight:800;
      font-size:clamp(1rem,2vw,1.3rem);
    }

    #app{
      width:100%;
      max-width:1100px;
      margin:0 auto;
    }

    .box{
      width:100%;
      max-width:100%;
      background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px 16px;
      box-shadow:0 0 20px rgba(0,0,0,.35);
      overflow:hidden;
    }

    .btn{
      display:block;
      width:100%;
      max-width:560px;
      margin:10px auto;
      padding:14px 16px;
      border:2px solid var(--blue);
      background:transparent;
      color:#fff;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:1rem;
      line-height:1.45;
      transition:.2s;
      white-space:normal;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .btn:hover:not(:disabled){
      background:var(--blue);
      color:#000;
      box-shadow:0 0 18px rgba(0,243,255,.35);
    }

    .btn-voltar{
      border-color:#666;
      color:#ddd;
    }

    .btn-voltar:hover:not(:disabled){
      background:#333;
      color:#fff;
      box-shadow:none;
    }

    .btn.correct{
      background:var(--green)!important;
      border-color:var(--green)!important;
      color:#000!important;
    }

    .btn.wrong{
      background:var(--red)!important;
      border-color:var(--red)!important;
      color:#fff!important;
    }

    .grid-areas{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      margin-top:18px;
    }

    .card-area{
      background:linear-gradient(135deg, rgba(0,243,255,.08), rgba(255,0,230,.08));
      border:1px solid rgba(0,243,255,.16);
      border-radius:16px;
      padding:16px;
      text-align:left;
      min-width:0;
    }

    .card-area h3{
      color:var(--blue);
      margin-bottom:8px;
      font-size:1.12rem;
      line-height:1.35;
      word-break:break-word;
    }

    .card-area p{
      color:#ddd;
      font-size:.95rem;
      line-height:1.45;
      margin-bottom:10px;
      word-break:break-word;
    }

    .status{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
      color:var(--pink);
      font-weight:bold;
      text-align:left;
    }

    #question-text{
      font-size:1.05rem;
      line-height:1.6;
      margin:20px 0;
      min-height:88px;
      text-align:left;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .question-label{
      display:block;
      color:var(--yellow);
      font-weight:bold;
      margin-bottom:8px;
    }

    .text-base{
      display:block;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:14px;
      margin:10px 0 14px;
      color:#f5f5f5;
      font-style:italic;
      line-height:1.65;
    }

    .options-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-bottom:16px;
      width:100%;
      max-width:100%;
    }

    .option-btn{
      width:100%;
      max-width:100%;
      margin:0;
      text-align:left;
      min-height:58px;
    }

    textarea{
      width:100%;
      min-height:140px;
      background:#0c0f14;
      border:2px solid var(--blue);
      color:#fff;
      border-radius:12px;
      padding:12px;
      font-size:1rem;
      resize:vertical;
      margin-bottom:14px;
    }

    .result-number{
      font-size:3rem;
      color:var(--blue);
      margin:12px 0;
      font-weight:900;
    }

    .result-sub{
      font-size:1.12rem;
      color:#ddd;
      margin-bottom:10px;
    }

    .mini{
      color:var(--muted);
      font-size:.96rem;
      line-height:1.5;
    }

    label{
      display:block;
      text-align:left;
      margin:10px 0 6px;
      color:var(--yellow);
      font-weight:bold;
    }

    .input-nota{
      width:100%;
      padding:12px;
      background:#101010;
      border:2px solid var(--blue);
      color:#fff;
      border-radius:10px;
      margin-bottom:12px;
    }

    .disc-box{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:16px;
      margin-bottom:16px;
      text-align:left;
    }

    .disc-box h3{
      color:var(--blue);
      margin-bottom:8px;
    }

    .disc-box p{
      margin-bottom:8px;
      line-height:1.55;
      word-break:break-word;
    }

    @media (max-width:700px){
      .grid-areas{
        grid-template-columns:1fr;
      }
      .box{
        padding:16px 12px;
      }
      #question-text{
        font-size:1rem;
      }
      .btn{
        font-size:.96rem;
        padding:13px 12px;
      }
    }


</style>
</head>

<script>
const app = document.getElementById("app");
const audioBg = document.getElementById("audio-bg");
const audioCorrect = document.getElementById("audio-correct");
const audioWrong = document.getElementById("audio-wrong");

audioBg.volume = 0.06;
audioCorrect.volume = 0.45;
audioWrong.volume = 0.45;

let audioLiberado = false;
let areaAtual = "";
let questoesAtuais = [];
let indiceQuestao = 0;
let acertosObjetivas = 0;

let notasDiscursivas = [0, 0];
let questaoRenderizadaAtual = null;

document.addEventListener("click", destravarAudio, { once: true });
document.addEventListener("touchstart", destravarAudio, { once: true });

function destravarAudio() {
  if (audioLiberado) return Promise.resolve(true);

  audioBg.muted = true;
  return audioBg.play()
    .then(() => {
      audioBg.pause();
      audioBg.currentTime = 0;
      audioBg.muted = false;
      audioLiberado = true;

      audioCorrect.play().then(() => {
        audioCorrect.pause();
        audioCorrect.currentTime = 0;
      }).catch(() => {});

      audioWrong.play().then(() => {
        audioWrong.pause();
        audioWrong.currentTime = 0;
      }).catch(() => {});

      return true;
    })
    .catch(() => false);
}

function tocarAudioFundo() {
  if (!audioLiberado) return;
  audioBg.currentTime = 0;
  audioBg.play().catch(() => {});
}

function pararAudioFundo() {
  audioBg.pause();
  audioBg.currentTime = 0;
}

function tocarAcerto() {
  audioCorrect.currentTime = 0;
  audioCorrect.play().catch(() => {});
}

function tocarErro() {
  audioWrong.currentTime = 0;
  audioWrong.play().catch(() => {});
}

const areasEspanhol = [
  { nome: "Comprensión Lectora", descricao: "Interpretação de textos em espanhol." },
  { nome: "Vocabulario en Contexto", descricao: "Sentido de palavras e expressões no contexto." },
  { nome: "Gramática Básica", descricao: "Estruturas básicas da língua espanhola." },
  { nome: "Tiempos Verbales", descricao: "Tempos verbais mais cobrados em prova." },
  { nome: "Pronombres y Artículos", descricao: "Pronomes, artigos e referências textuais." },
  { nome: "Conectores y Significado", descricao: "Conectores e relações lógicas do texto." },
  { nome: "Anuncios y Campañas", descricao: "Leitura de anúncios, cartazes e campanhas." },
  { nome: "Preposiciones y Expresiones", descricao: "Preposições e expressões frequentes." },
  { nome: "Falsos Cognatos", descricao: "Palavras parecidas com o português que confundem." },
  { nome: "Producción Escrita", descricao: "Respostas discursivas e escrita aplicada." }
];

function criarObjetiva(area, numero, textoBase, pergunta, alternativas, correta, comentario) {
  return { tipo: "objetiva", area, numero, base: textoBase, q: pergunta, o: alternativas, c: correta, coment: comentario };
}

function criarDiscursiva(area, numero, pergunta, gabarito) {
  return { tipo: "discursiva", area, numero, q: pergunta, gabarito };
}

function gerarAreaBase(nomeArea, perguntasObjetivas, discursivas) {
  const objetivas = perguntasObjetivas.map((item, i) =>
    criarObjetiva(nomeArea, i + 1, item.base, item.q, item.o, item.c, item.coment)
  );
  const disc = discursivas.map((item, i) =>
    criarDiscursiva(nomeArea, 21 + i, item.q, item.g)
  );
  return [...objetivas, ...disc];
}

function embaralharAlternativas(questao) {
  const pares = questao.o.map((texto, idx) => ({ texto, correta: idx === questao.c }));
  for (let i = pares.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pares[i], pares[j]] = [pares[j], pares[i]];
  }
  return {
    ...questao,
    opcoesRenderizadas: pares.map(p => p.texto),
    corretaRenderizada: pares.findIndex(p => p.correta)
  };
}

const bancoQuestoes = {

      { base:`"El agua es esencial para la vida y la salud."`, q:"Segundo o texto, a água é:", o:["Pouco importante","Essencial para a vida e a saúde","Apenas para atletas","Desnecessária"], c:1, coment:"Esencial para la vida y la salud." },

      { base:`"La música puede ayudar a algunos alumnos a relajarse antes de los exámenes."`, q:"Segundo o texto, a música pode ajudar alguns alunos a:", o:["Dormir na prova","Relaxar antes dos exames","Esquecer o conteúdo","Parar de estudar"], c:1, coment:"Relajarse antes de los exámenes." },

      { base:`"Internet ofrece acceso a información de todo el mundo."`, q:"De acordo com o texto, a internet oferece acesso a:", o:["Apenas notícias locais","Informações do mundo todo","Somente jogos","Somente mensagens escolares"], c:1, coment:"Información de todo el mundo." },

  "Gramática Básica": gerarAreaBase(
    "Gramática Básica",
    [
      { base:`"Ella estudia todos los días."`, q:"Qual frase está correta no presente?", o:["Ella estudia todos los días.","Ella estudiar todos los días.","Ella estudian todos los días.","Ella estudio todos los días."], c:0, coment:"Conjugação correta de estudiar na 3ª pessoa singular." },

      { base:`"El cuaderno está debajo de la silla."`, q:"A expressão 'debajo de' significa:", o:["Em cima de","Debaixo de","Ao lado de","Longe de"], c:1, coment:"Debajo de = debaixo de." },
      { base:`"Hablamos sobre el proyecto."`, q:"A preposição 'sobre' indica:", o:["Assunto / sobre","Lugar interno","Origem","Tempo"], c:0, coment:"Sobre = sobre/acerca de." },
      { base:`"La tienda está al lado del banco."`, q:"A expressão 'al lado de' significa:", o:["Na frente de","Ao lado de","Dentro de","Depois de"], c:1, coment:"Al lado de = ao lado de." },

  "Falsos Cognatos": gerarAreaBase(

    [

      { base:`"La firma está al final del documento."`, q:"A palavra 'firma' significa:", o:["Empresa","Assinatura","Fechadura","Marcação"], c:1, coment:"Firma pode significar assinatura." },
      { base:`"El suceso ocurrió anoche."`, q:"A palavra 'suceso' significa:", o:["Sucesso positivo","Acontecimento","Vitória","Premiação"], c:1, coment:"Suceso = acontecimento." },

      { base:`"La universidad ofrece un curso de idiomas."`, q:"A palavra 'curso' significa:", o:["Percurso","Curso","Corrida","Fila"], c:1, coment:"Aqui não é falso cognato; é cognato verdadeiro, usado para contraste." },
      { base:`"El colegio está cerca de mi casa."`, q:"A palavra 'colegio' significa, no contexto mais comum:", o:["Colégio / escola","Colégio eleitoral apenas","Conselho profissional","Faculdade"], c:0, coment:"Colegio = escola/colégio." },
      { base:`"El apellido de Ana es Torres."`, q:"A palavra 'apellido' significa:", o:["Apelido","Sobrenome","Nome artístico","Comentário"], c:1, coment:"Apellido = sobrenome." },
      { base:`"Voy a discutir el problema mañana."`, q:"O verbo 'discutir' pode significar:", o:["Brigar necessariamente","Debater / discutir um tema","Ignorar","Apagar"], c:1, coment:"Em muitos contextos, discutir = debater." },
      { base:`"La ropa está en el armario."`, q:"A palavra 'armario' significa:", o:["Armário","Armação","Armadilha","Arquivo"], c:0, coment:"Armario = armário." },
      { base:`"Fue un gran evento, no un gran éxito todavía."`, q:"A frase ajuda a mostrar que 'suceso' não significa necessariamente:", o:["Acontecimento","Sucesso positivo","Fato","Evento"], c:1, coment:"Suceso não é igual a sucesso." },
      { base:`"Estoy embarazada de seis meses."`, q:"A palavra 'embarazada' não significa:", o:["Grávida","Embaraçada","Gestante","Mulher esperando bebê"], c:1, coment:"É falso cognato." }
    ],
    [
      { q:"Explique, em português, o que são falsos cognatos em espanhol.", g:"São palavras parecidas com o português, mas que têm significado diferente e podem causar confusão na interpretação." },
      { q:"Escreva, em espanhol, uma frase usando corretamente 'embarazada' ou 'asistir'.", g:"Exemplo: Ella está embarazada. / Voy a asistir a la reunión." }
    ]
  ),

  "Producción Escrita": gerarAreaBase(
    "Producción Escrita",
    [
      { base:`"En mi opinión, los estudiantes deben leer más."`, q:"A expressão 'En mi opinión' é usada para:", o:["Dar ordem","Apresentar opinião","Falar de passado","Indicar lugar"], c:1, coment:"En mi opinión = na minha opinião." },
      { base:`"Un buen párrafo tiene una idea principal clara."`, q:"Segundo o texto, um bom parágrafo deve ter:", o:["Ideia principal clara","Muitas frases aleatórias","Só palavras difíceis","Nenhum verbo"], c:0, coment:"Idea principal clara." },
      { base:`"Los alumnos necesitan tecnología porque ayuda al aprendizaje."`, q:"No texto, 'porque' introduz:", o:["Contraste","Motivo","Lugar","Dúvida"], c:1, coment:"Porque = causa." },
      { base:`"Por ejemplo, las aplicaciones pueden mejorar el vocabulario."`, q:"A expressão 'por ejemplo' serve para:", o:["Dar exemplo","Negar ideia","Concluir","Marcar tempo"], c:0, coment:"Por ejemplo = por exemplo." },
      { base:`"La conclusión cierra la idea principal."`, q:"Segundo o texto, a conclusão:", o:["Abre novo tema","Fecha a ideia principal","Elimina a tese","Bagunça o texto"], c:1, coment:"A conclusão encerra a ideia central." },
      { base:`"Las frases cortas y claras pueden mejorar la escritura."`, q:"O texto sugere que frases curtas e claras podem:", o:["Piorar a escrita","Melhorar a escrita","Eliminar o sentido","Substituir conectores"], c:1, coment:"Claras y cortas = melhora da escrita." },
      { base:`"Estoy de acuerdo con la educación pública de calidad."`, q:"A expressão 'estoy de acuerdo' indica:", o:["Discordância","Concordância","Passado","Explicação de lugar"], c:1, coment:"Estoy de acuerdo = concordo." },
      { base:`"Una respuesta fuerte es clara y relevante."`, q:"Segundo o texto, uma boa resposta deve ser:", o:["Confusa","Clara e relevante","Muito longa sem foco","Sem relação com a pergunta"], c:1, coment:"Clara y relevante." },
      { base:`"Los conectores ayudan a organizar las ideas en la escritura."`, q:"Os conectores ajudam a:", o:["Apagar o sentido","Organizar as ideias","Eliminar verbos","Criar erro"], c:1, coment:"Organizam as ideias." },
      { base:`"Los estudiantes deben escribir de forma directa y clara."`, q:"A recomendação do texto é que os estudantes escrevam:", o:["De forma indireta","De forma direta e clara","Só com palavras difíceis","Sem pontuação"], c:1, coment:"Directa y clara." },
      { base:`"Las clases en línea son útiles, pero el contacto presencial también es importante."`, q:"O conector 'pero' mostra:", o:["Adição","Contraste","Resultado","Exemplo"], c:1, coment:"Pero = contraste." },
      { base:`"La frase temática presenta la idea principal del párrafo."`, q:"Segundo o texto, a frase temática serve para:", o:["Esconder a ideia principal","Apresentar a ideia principal","Trocar de assunto","Finalizar o texto"], c:1, coment:"Presenta la idea principal." },
      { base:`"La puntuación ayuda a organizar el significado."`, q:"No texto, a pontuação ajuda a:", o:["Bagunçar o texto","Organizar o significado","Eliminar vocabulário","Substituir o tema"], c:1, coment:"Organiza o significado." },
      { base:`"En una respuesta breve, cada frase debe ser relevante."`, q:"Segundo o texto, cada frase da resposta curta deve ser:", o:["Aleatória","Relevante","Muito longa","Desconectada"], c:1, coment:"Cada frase debe ser relevante." },
      { base:`"La buena escritura necesita coherencia y propósito claro."`, q:"Uma boa escrita precisa de:", o:["Só vocabulário difícil","Coerência e propósito claro","Apenas frases longas","Muita repetição"], c:1, coment:"Coherencia y propósito claro." },
      { base:`"Los ejemplos pueden apoyar las ideas."`, q:"Os exemplos ajudam a:", o:["Enfraquecer as ideias","Sustentar as ideias","Eliminar argumentos","Trocar o idioma"], c:1, coment:"Apoiam as ideias." },
      { base:`"La frase final puede resumir el párrafo."`, q:"A frase final pode:", o:["Criar assunto sem relação","Resumir o parágrafo","Retirar a ideia central","Impedir a compreensão"], c:1, coment:"Resume o parágrafo." },
      { base:`"El lenguaje educado es importante en la escritura formal."`, q:"Segundo o texto, na escrita formal é importante usar linguagem:", o:["Agressiva","Educada","Sem sentido","Só abreviada"], c:1, coment:"Lenguaje educado." },
      { base:`"La respuesta discursiva debe responder directamente a la pregunta."`, q:"A principal recomendação é que a resposta discursiva:", o:["Fuja do tema","Responda diretamente à pergunta","Use só palavras soltas","Ignore o enunciado"], c:1, coment:"Responder diretamente." },
      { base:`"La escritura mejora con la práctica."`, q:"De acordo com o texto, a escrita melhora com:", o:["Sorte","Prática","Silêncio","Só tradução"], c:1, coment:"Mejora con la práctica." }
    ],
    [
      { q:"Explique, em português, o que torna uma boa resposta curta em espanhol.", g:"Uma boa resposta curta é clara, relevante ao enunciado, compreensível gramaticalmente e bem organizada." },
      { q:"Escreva, em espanhol, de 3 a 5 linhas sobre por que aprender espanhol é importante hoje.", g:"Ideia esperada: o espanhol é importante para estudo, trabalho, comunicação, viagens e acesso a novas oportunidades." }
    ]
  )
};

function mostrarMenu() {
  pararAudioFundo();
  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue); margin-bottom:8px;">Escolha um módulo de Espanhol</h2>
      <p class="mini">Cada módulo possui <strong>20 questões objetivas</strong> e <strong>2 discursivas</strong>.</p>
      <div class="grid-areas">
        ${areasEspanhol.map(area => `
          <div class="card-area">
            <h3>${area.nome}</h3>
            <p>${area.descricao}</p>
            <button class="btn" onclick="iniciarArea('${area.nome.replace(/'/g, "\\'")}')">Entrar neste módulo</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function iniciarArea(nomeArea) {
  destravarAudio();
  areaAtual = nomeArea;
  questoesAtuais = bancoQuestoes[nomeArea] || [];
  indiceQuestao = 0;
  acertosObjetivas = 0;
  respostasDiscursivas = ["", ""];
  notasDiscursivas = [0, 0];
  questaoRenderizadaAtual = null;

  if (!questoesAtuais.length) {
    app.innerHTML = `
      <div class="box">
        <h2 style="color:var(--red);">Erro ao abrir o módulo</h2>
        <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
      </div>
    `;
    return;
  }

  setTimeout(() => {
    tocarAudioFundo();
  }, 120);

  carregarQuestao();
}

function montarEnunciado(questao) {
  return `
    <span class="question-label">Texto base em espanhol:</span>
    <span class="text-base">${questao.base}</span>
    <span class="question-label">Pergunta:</span>
    ${questao.q}
  `;
}

function carregarQuestao() {
  const questao = questoesAtuais[indiceQuestao];
  const total = questoesAtuais.length;

  let html = `
    <div class="box">
      <div class="status">
        <span>${areaAtual}</span>
        <span>Questão ${indiceQuestao + 1}/${total}</span>
      </div>
  `;

  if (questao.tipo === "objetiva") {
    questaoRenderizadaAtual = embaralharAlternativas(questao);
    html += `<div id="question-text">${montarEnunciado(questaoRenderizadaAtual)}</div>`;
    html += `<div class="options-wrap">`;
    questaoRenderizadaAtual.opcoesRenderizadas.forEach((alt, idx) => {
      html += `<button class="btn option-btn" onclick="responderObjetiva(${idx})">${alt}</button>`;
    });
    html += `</div>`;
  } else {
    const discIndex = indiceQuestao - 20;
    questaoRenderizadaAtual = null;
    html += `
      <div id="question-text">${questao.q}</div>
      <textarea id="resposta-discursiva" placeholder="Digite sua resposta aqui...">${respostasDiscursivas[discIndex] || ""}</textarea>
      <button class="btn" onclick="salvarDiscursivaEAvancar()">Salvar resposta e continuar</button>
    `;
  }

  html += `<button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button></div>`;
  app.innerHTML = html;
}

function responderObjetiva(escolhida) {
  const botoes = document.querySelectorAll(".option-btn");
  const correta = questaoRenderizadaAtual.corretaRenderizada;

  botoes.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === correta) btn.classList.add("correct");
  });

  if (escolhida !== correta) {
    botoes[escolhida].classList.add("wrong");
    tocarErro();
  } else {
    acertosObjetivas++;
    tocarAcerto();
  }

  setTimeout(() => {
    indiceQuestao++;
    if (indiceQuestao < questoesAtuais.length) {
      carregarQuestao();
    } else {
      mostrarAvaliacaoDiscursivas();
    }
  }, 900);
}

function salvarDiscursivaEAvancar() {
  const discIndex = indiceQuestao - 20;
  respostasDiscursivas[discIndex] = document.getElementById("resposta-discursiva").value.trim();
  indiceQuestao++;

  if (indiceQuestao < questoesAtuais.length) {
    carregarQuestao();
  } else {
    mostrarAvaliacaoDiscursivas();
  }
}

function mostrarAvaliacaoDiscursivas() {
  pararAudioFundo();
  const discursivas = questoesAtuais.filter(q => q.tipo === "discursiva");

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--pink); margin-bottom:10px;">Avalie suas questões discursivas</h2>
      <p class="mini" style="margin-bottom:18px;">Dê uma nota de 0 a 10 para cada resposta com base no gabarito.</p>
      ${discursivas.map((q, i) => `
        <div class="disc-box">
          <h3>Discursiva ${i + 1}</h3>
          <p><strong>Pergunta:</strong> ${q.q}</p>
          <p><strong>Sua resposta:</strong><br>${respostasDiscursivas[i] ? respostasDiscursivas[i] : "<em>Não respondida</em>"}</p>
          <p style="color:var(--pink);"><strong>Gabarito esperado:</strong><br>${q.gabarito}</p>
          <label>Nota (0 a 10)</label>
          <input class="input-nota" type="number" min="0" max="10" value="${notasDiscursivas[i]}" data-index="${i}">
        </div>
      `).join("")}
      <button class="btn" onclick="finalizarArea()">Finalizar módulo</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

function finalizarArea() {
  const inputs = document.querySelectorAll(".input-nota");
  let somaDisc = 0;

  inputs.forEach(input => {
    let valor = Number(input.value);
    if (isNaN(valor) || valor < 0) valor = 0;
    if (valor > 10) valor = 10;
    somaDisc += valor;
  });

  const notaObjetiva = acertosObjetivas * 4;
  const notaDiscursiva = somaDisc;
  const notaFinal = notaObjetiva + notaDiscursiva;

  let feedback = "";
  if (notaFinal >= 85) feedback = "Excelente desempenho. Você está muito forte nesse módulo de Espanhol.";
  else if (notaFinal >= 60) feedback = "Bom resultado. Com mais treino, sua nota pode subir bastante.";
  else feedback = "Você já identificou pontos de melhoria. Continue praticando e revisando.";

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue);">${areaAtual}</h2>
      <div class="result-number">${notaFinal}/100</div>
      <div class="result-sub">Objetivas: ${notaObjetiva}/80 • Discursivas: ${notaDiscursiva}/20</div>
      <p class="mini" style="margin-bottom:18px;">${feedback}</p>
      <button class="btn" onclick="iniciarArea('${areaAtual.replace(/'/g, "\\'")}')">Refazer este módulo</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

mostrarMenu();



</script>

</html>
