function mostrarMenu(){
 pararAudioFundo();
 app.innerHTML=`
 <div class="box">
 <h2 style="color:var(--blue);margin-bottom:8px;">Escolha um módulo de Química</h2>
 <p class="mini">Cada módulo possui <strong>20 questões objetivas</strong>, com áudio e respostas embaralhadas.</p>
 <div class="grid-areas">
 ${areasQuimica.map(area=>`
 <div class="card-area">
 <h3>${area.nome}</h3>
 <p>${area.descricao}</p>
 <button class="btn" onclick="iniciarArea('${area.nome.replace(/'/g,"\\'")}')">Entrar neste módulo</button>
 </div>`).join("")}
 </div></div>`;
}

async function iniciarArea(nomeArea){
 await destravarAudio();
 areaAtual=nomeArea;
 questoesAtuais=bancoQuestoes[nomeArea]||[];
 indiceQuestao=0;
 acertosObjetivas=0;
 questaoRenderizadaAtual=null;
 if(!questoesAtuais.length){
  app.innerHTML=`<div class="box"><h2 style="color:var(--red);">Erro ao abrir o módulo</h2><button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button></div>`;
  return;
 }
 setTimeout(()=>{tocarAudioFundo()},120);
 carregarQuestao();
}

function montarEnunciado(questao){
 return `<span class="question-label">Base para resolução:</span><span class="text-base">${questao.base}</span><span class="question-label">Pergunta:</span>${questao.q}`;
}

function carregarQuestao(){
 const questao=questoesAtuais[indiceQuestao];
 const total=questoesAtuais.length;
 questaoRenderizadaAtual=embaralharAlternativas(questao);
 let html=`<div class="box"><div class="status"><span>${areaAtual}</span><span>Questão ${indiceQuestao+1}/${total}</span></div><div id="question-text">${montarEnunciado(questaoRenderizadaAtual)}</div><div class="options-wrap">`;
 questaoRenderizadaAtual.opcoesRenderizadas.forEach((alt,idx)=>{html+=`<button class="btn option-btn" onclick="responderObjetiva(${idx})">${alt}</button>`});
 html+=`</div><button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button></div>`;
 app.innerHTML=html;
}

function responderObjetiva(escolhida){
 const botoes=document.querySelectorAll(".option-btn");
 const correta=questaoRenderizadaAtual.corretaRenderizada;
 botoes.forEach((btn,idx)=>{btn.disabled=true;if(idx===correta)btn.classList.add("correct")});
 if(escolhida===correta){acertosObjetivas++;tocarAcerto()}else{if(botoes[escolhida])botoes[escolhida].classList.add("wrong");tocarErro()}
 setTimeout(()=>{indiceQuestao++;if(indiceQuestao<questoesAtuais.length){carregarQuestao()}else{finalizarArea()}},900);
}

function finalizarArea(){
 pararAudioFundo();
 const notaFinal=acertosObjetivas*10;
 const totalPossivel=200;
 let feedback="Você concluiu este módulo completo de Química. Continue treinando os demais módulos para avançar no simulado gratuito.";
 if(notaFinal>=160)feedback+=" Excelente desempenho neste módulo.";
 else if(notaFinal>=100)feedback+=" Bom resultado. Ainda dá para elevar sua pontuação.";
 else feedback+=" Este resultado mostra pontos que precisam ser reforçados com mais treino.";
 app.innerHTML=`
 <div class="box">
 <h2 style="color:var(--blue);">${areaAtual}</h2>
 <div class="result-number">${notaFinal}/${totalPossivel}</div>
 <div class="result-sub">Acertos: ${acertosObjetivas}/20</div>
 <p class="mini" style="margin-bottom:18px;">${feedback}</p>
 <button class="btn" onclick="iniciarArea('${areaAtual.replace(/'/g,"\\'")}')">Refazer este módulo</button>
 <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
 </div>`;
}

mostrarMenu();
