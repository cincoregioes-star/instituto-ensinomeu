<header>
<h1>REDAÇÃO ENEM 300 QUESTÕES</h1>
<p>12 MÓDULOS • 300 QUESTÕES</p>
</header>


<div id="app"></div>

<!-- ÁUDIO (OCULTO PARA O USUÁRIO) -->
<audio id="bg" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3">
</audio>

<audio id="acerto">
<source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3">
</audio>

<audio id="erro">
<source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3232f.mp3">
</audio>

<script>

const app = document.getElementById("app");
const bg = document.getElementById("bg");
const acertoAudio = document.getElementById("acerto");
const erroAudio = document.getElementById("erro");

bg.volume = 0.03;
acertoAudio.volume = 0.6;
erroAudio.volume = 0.6;

let moduloAtual="";
let questoes=[];
let index=0;
let acertos=0;
let travado=false;

function embaralhar(a){return a.sort(()=>Math.random()-0.5)}

function iniciarModulo(nome){
moduloAtual=nome;
questoes=banco[nome];
index=0;
acertos=0;

bg.currentTime=0;
bg.play().catch(()=>{});

carregar();
}

function carregar(){
travado=false;
let q=questoes[index];

let op=q.o.map((t,i)=>({t,c:i==q.c}));
op=embaralhar(op);

let correta=op.findIndex(x=>x.c);

app.innerHTML=`
<div class="box">

<h3>${moduloAtual}</h3>
<p>Questão ${index+1}/25</p>

<p style="margin:15px 0">${q.q}</p>

${op.map((o,i)=>`
<button class="btn opcao" onclick="responder(${i},${correta})">${o.t}</button>
`).join("")}

<div id="coment" class="comment"></div>

<button id="nextBtn" class="btn" style="display:none" onclick="proxima()">Próxima pergunta</button>

<button class="btn" onclick="menu()">Retornar ao menu</button>

</div>`;
}

function responder(escolha,correta){

if(travado) return;
travado=true;

let botoes=document.querySelectorAll(".opcao");
let coment=document.getElementById("coment");
let nextBtn=document.getElementById("nextBtn");

botoes.forEach((b,i)=>{
b.disabled=true;
if(i==correta)b.classList.add("correct");
if(i==escolha && escolha!=correta)b.classList.add("wrong");
});

if(escolha==correta){
acertos++;
acertoAudio.currentTime=0;
acertoAudio.play().catch(()=>{});
}else{
erroAudio.currentTime=0;
erroAudio.play().catch(()=>{});
}

coment.style.display="block";
coment.innerHTML=questoes[index].coment;

nextBtn.style.display="block";
}

function proxima(){
index++;
if(index<questoes.length) carregar();
else finalizar();
}

function finalizar(){

bg.pause();
bg.currentTime=0;

app.innerHTML=`
<div class="box">
<h2>Resultado</h2>
<p>${acertos}/25</p>
<button class="btn" onclick="menu()">Menu</button>
</div>`;
}

function menu(){

bg.pause();
bg.currentTime=0;

app.innerHTML=`
<div class="box">

<h2>Escolha o módulo</h2>

<div class="grid">
${Object.keys(banco).map(m=>`
<button class="btn" onclick="iniciarModulo('${m}')">${m}</button>
`).join("")}
</div>

</div>`;
}
