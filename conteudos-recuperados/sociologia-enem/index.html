<script>
const app = document.getElementById("app");
const audioBg = document.getElementById("audio-bg");
const audioCorrect = document.getElementById("audio-correct");
const audioWrong = document.getElementById("audio-wrong");

audioBg.volume = 0.06;

let audioLiberado = false;

document.addEventListener("click", destravarAudio, { once: true });
document.addEventListener("touchstart", destravarAudio, { once: true });

function destravarAudio() {
  if (audioLiberado) return Promise.resolve(true);

  audioBg.muted = true;
  return audioBg.play()
    .then(() => {
      audioBg.pause();
      audioBg.currentTime = 0;
      audioBg.muted = false;
      audioLiberado = true;

      audioCorrect.play().then(() => {
        audioCorrect.pause();
        audioCorrect.currentTime = 0;
      }).catch(() => {});

      audioWrong.play().then(() => {
        audioWrong.pause();
        audioWrong.currentTime = 0;
      }).catch(() => {});

      return true;
    })
    .catch(() => false);
}

function tocarAudioFundo() {
  if (!audioLiberado) return;
  audioBg.currentTime = 0;
  audioBg.play().catch(() => {});
}

function pararAudioFundo() {
  audioBg.pause();
  audioBg.currentTime = 0;
}

function tocarAcerto() {
  audioCorrect.currentTime = 0;
  audioCorrect.play().catch(() => {});
}

function tocarErro() {
  audioWrong.currentTime = 0;
  audioWrong.play().catch(() => {});
}

const areas = [
  { nome: "Introdução à Sociologia", descricao: "Surgimento da sociologia, sociedade, ciência social e olhar sociológico." },
  { nome: "Clássicos da Sociologia", descricao: "Durkheim, Weber, Marx, Comte e conceitos fundamentais." },
  { nome: "Cultura e Sociedade", descricao: "Cultura, etnocentrismo, relativismo cultural, identidade e diversidade." },
  { nome: "Trabalho e Sociedade", descricao: "Trabalho, capitalismo, alienação, exploração, indústria e precarização." },
  { nome: "Estado, Poder e Política", descricao: "Estado, poder, dominação, democracia, cidadania e participação política." },
  { nome: "Desigualdade Social", descricao: "Classes sociais, estratificação, pobreza, mobilidade social e exclusão." },
  { nome: "Movimentos Sociais", descricao: "Ações coletivas, direitos, movimentos sociais e participação cidadã." },
  { nome: "Globalização e Tecnologia", descricao: "Globalização, redes, mídia, consumo, tecnologia e sociedade contemporânea." },
  { nome: "Direitos Humanos e Cidadania", descricao: "Direitos civis, sociais, políticos, minorias e inclusão social." },
  { nome: "Sociologia no ENEM", descricao: "Interpretação social, temas atuais, cidadania, cultura, trabalho e política." }
];

function criarObjetiva(area, numero, textoBase, pergunta, alternativas, correta) {
  return {
    tipo: "objetiva",
    area,
    numero,
    base: textoBase,
    q: pergunta,
    o: alternativas,
    c: correta
  };
}

function gerarAreaBase(nomeArea, perguntasObjetivas) {
  return perguntasObjetivas.map((item, i) =>
    criarObjetiva(nomeArea, i + 1, item.base, item.q, item.o, item.c)
  );
}

function embaralharAlternativas(questao) {
  const pares = questao.o.map((texto, idx) => ({ texto, correta: idx === questao.c }));
  for (let i = pares.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pares[i], pares[j]] = [pares[j], pares[i]];
  }
  return {
    ...questao,
    opcoesRenderizadas: pares.map(p => p.texto),
    corretaRenderizada: pares.findIndex(p => p.correta)
  };
}

      { base:`"O termo Sociologia foi criado por Augusto Comte no século XIX."`, q:"A Sociologia nasceu em meio a transformações como:", o:["Industrialização e urbanização","Feudalismo antigo","Caça e coleta pré-histórica","Formação do Império Romano"], c:0 },

function mostrarMenu() {
  pararAudioFundo();

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue); margin-bottom:8px;">Escolha um módulo de Sociologia</h2>
      <p class="mini">Versão gratuita completa com <strong>10 módulos</strong> e <strong>200 questões</strong>.</p>

      <div class="grid-areas">
        ${areas.map(area => `
          <div class="card-area">
            <h3>${area.nome}</h3>
            <p>${area.descricao}</p>
            <button class="btn" onclick="iniciarArea('${area.nome.replace(/'/g, "\\'")}')">
              Entrar neste módulo
            </button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

async function iniciarArea(nomeArea) {
  await destravarAudio();
  areaAtual = nomeArea;
  questoesAtuais = bancoQuestoes[nomeArea] || [];
  indiceQuestao = 0;
  acertosObjetivas = 0;
  questaoRenderizadaAtual = null;

  if (!questoesAtuais.length) {
    app.innerHTML = `
      <div class="box">
        <h2 style="color:var(--red);">Erro ao abrir o módulo</h2>
        <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
      </div>
    `;
    return;
  }

  setTimeout(() => {
    tocarAudioFundo();
  }, 120);

  carregarQuestao();
}

function montarEnunciado(questao) {
  return `
    <span class="question-label">Base para interpretação:</span>
    <span class="text-base">${questao.base}</span>
    <span class="question-label">Pergunta:</span>
    ${questao.q}
  `;
}

      <div class="status">
        <span>${areaAtual}</span>
        <span>Questão ${indiceQuestao + 1}/${total}</span>
      </div>
      <div id="question-text">${montarEnunciado(questaoRenderizadaAtual)}</div>
      <div class="options-wrap">
  `;

  questaoRenderizadaAtual.opcoesRenderizadas.forEach((alt, idx) => {
    html += `<button class="btn option-btn" onclick="responderObjetiva(${idx})">${alt}</button>`;
  });

  html += `
      </div>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;

  app.innerHTML = html;
}

function responderObjetiva(escolhida) {
  const botoes = document.querySelectorAll(".option-btn");
  const correta = questaoRenderizadaAtual.corretaRenderizada;

  botoes.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === correta) btn.classList.add("correct");
  });

  if (escolhida === correta) {
    acertosObjetivas++;
    tocarAcerto();
  } else {
    botoes[escolhida].classList.add("wrong");
    tocarErro();
  }

  setTimeout(() => {
    indiceQuestao++;
    if (indiceQuestao < questoesAtuais.length) {
      carregarQuestao();
    } else {
      finalizarArea();
    }
  }, 900);
}

function finalizarArea() {
  pararAudioFundo();

  const notaFinal = acertosObjetivas * 10;
  const totalPossivel = questoesAtuais.length * 10;

  let feedback = "Módulo concluído. Continue treinando os outros módulos para completar as 200 questões de Sociologia.";

  if (notaFinal >= 160) feedback = "Excelente desempenho! Você demonstrou domínio forte neste módulo.";
  else if (notaFinal >= 120) feedback = "Bom desempenho! Continue revisando para fortalecer os pontos fracos.";
  else if (notaFinal >= 80) feedback = "Resultado intermediário. Refaça o módulo e revise os temas com mais atenção.";
  else feedback = "Atenção: este módulo mostrou dificuldades importantes. Refaça e revise os conteúdos.";

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue);">${areaAtual}</h2>
      <div class="result-number">${notaFinal}/${totalPossivel}</div>
      <div class="result-sub">Acertos: ${acertosObjetivas}/${questoesAtuais.length}</div>
      <p class="mini" style="margin-bottom:18px;">${feedback}</p>

      <button class="btn" onclick="iniciarArea('${areaAtual.replace(/'/g, "\\'")}')">Refazer este módulo</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

mostrarMenu();


</script>

<script src="../../voltar-global.js"></script>
