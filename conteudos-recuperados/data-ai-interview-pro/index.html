<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data & AI Interview Pro | Instituto EnsinoMeu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root { 
            --bg-dark: #0d1117; 
            --bg-card: #161b22; 
            --text-light: #c9d1d9; 
            --neon-green: #2ea043; 
            --neon-cyan: #58a6ff;
            --border-color: #30363d;
            --danger-red: #da3633;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        
        body { background: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; align-items: center; height: 100vh; width: 100vw; overflow: hidden; }
        
        header { width: 100%; text-align: center; padding: 12px 15px; border-bottom: 2px solid var(--neon-cyan); background: var(--bg-card); box-shadow: 0 4px 20px rgba(88, 166, 255, 0.1); flex-shrink: 0; }
        header h1 { color: var(--text-light); font-size: 1.3rem; letter-spacing: 0.5px;}
        header h1 span { color: var(--neon-cyan); font-weight: 700; text-shadow: 0 0 10px rgba(88,166,255,0.4);}
        header p { font-size: 0.8rem; margin-top: 2px; color: #8b949e; }
        
        .screen { display: none; width: 100%; max-width: 700px; padding: 15px; flex-direction: column; align-items: center; flex-grow: 1; overflow: hidden; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* Ajuste dos botões: Flexbox centraliza as letras perfeitamente */
        .btn { width: 100%; min-height: 55px; padding: 14px 20px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-light); border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; text-align: left; white-space: normal; word-wrap: break-word; line-height: 1.4; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start; }
        .btn:hover:not(:disabled) { background: #1f242c; border-color: var(--neon-cyan); transform: translateX(5px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn.correct { background: rgba(46, 160, 67, 0.2) !important; border-color: var(--neon-green) !important; color: #fff !important; text-shadow: 0 0 5px var(--neon-green); }
        .btn.wrong { background: rgba(218, 54, 51, 0.2) !important; border-color: var(--danger-red) !important; color: #fff !important; }

        .menu-grid { display: flex; flex-direction: column; width: 100%; flex-grow: 1; overflow-y: auto; padding-right: 5px; padding-bottom: 20px;}
        .menu-grid::-webkit-scrollbar { display: block; width: 4px; }
        .menu-grid::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
        .menu-btn { background: #010409; border-left: 4px solid var(--neon-cyan); font-weight: 600; }
        
        .timer-container { position: relative; width: 70px; height: 70px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        .timer-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .timer-circle-bg { fill: none; stroke: var(--bg-card); stroke-width: 6; }
        .timer-circle-path { fill: none; stroke: var(--neon-cyan); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }
        .timer-text { font-size: 1.2rem; font-weight: bold; z-index: 2; color: var(--neon-cyan); }

        #question-text { font-size: 1.1rem; text-align: left; margin-bottom: 15px; line-height: 1.5; color: #e6edf3; width: 100%; word-wrap: break-word; flex-shrink: 0;}
        .status-bar { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; color: #8b949e; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; flex-shrink: 0;}
        
        #options-container { width: 100%; display: flex; flex-direction: column; overflow-y: auto; flex-grow: 1; padding-right: 5px;}
        #options-container::-webkit-scrollbar { display: block; width: 4px; }
        #options-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .btn-voltar { text-align: center; border: none; background: transparent; color: #8b949e; margin-top: 15px; font-size: 0.9rem; cursor: pointer; flex-shrink: 0; padding: 10px;}
        .btn-voltar:hover { color: var(--danger-red); }
        
        .percent-box { background: #010409; border: 1px solid var(--neon-green); border-radius: 8px; padding: 25px; text-align: center; margin-bottom: 20px; width: 100%; box-shadow: 0 0 15px rgba(46,160,67,0.1);}
        .percent-text { font-size: 3.5rem; font-weight: 700; color: var(--neon-green); text-shadow: 0 0 10px rgba(46,160,67,0.4); }
    </style>
</head>

        "Módulo 5": [
            {"q": "A principal característica do Aprendizado Supervisionado (Supervised Learning) é:", "o": ["O algoritmo aprende de forma autônoma sem intervenção humana.", "Os dados de treinamento fornecidos ao modelo já possuem os rótulos (labels/respostas corretas) que queremos prever.", "Os dados são agrupados com base em similaridades sem variáveis alvo.", "É usado exclusivamente para processamento de imagens."], "c": 1},
            {"q": "Quais são as duas grandes categorias de problemas resolvidos pelo Aprendizado Supervisionado?", "o": ["Clustering (Agrupamento) e Redução de Dimensionalidade.", "Redes Neurais e Deep Learning.", "Classificação (prever categorias discretas) e Regressão (prever valores contínuos).", "Regras de Associação e Sistemas de Recomendação."], "c": 2},
            {"q": "O famoso 'Dilema Viés-Variância' (Bias-Variance Tradeoff) afirma que:", "o": ["Modelos complexos reduzem tanto o viés quanto a variância a zero.", "Aumentar a complexidade do modelo geralmente diminui o viés, mas aumenta a variância (risco de overfitting).", "Modelos simples têm variância infinita.", "O viés sempre deve ser maximizado para melhorar a acurácia."], "c": 1},
            {"q": "Um modelo de Machine Learning que sofre de 'Overfitting' (Sobreajuste) apresenta qual comportamento nas métricas?", "o": ["Erro alto tanto no treino quanto no teste (não aprendeu nada).", "Erro zero no treino e erro zero no teste.", "Erro altíssimo no treino, mas erro baixo no teste.", "Erro muito baixo nos dados de treinamento, mas erro alto nos dados de validação/teste (decorou os dados, perdeu a generalização)."], "c": 3},
            {"q": "Qual o sintoma clássico de um modelo em 'Underfitting' (Subajuste)?", "o": ["O modelo não consegue capturar o padrão subjacente dos dados, resultando em erro alto tanto na base de treino quanto na de teste.", "O modelo acerta 100% das previsões.", "O modelo leva meses para ser treinado.", "O modelo ignora variáveis categóricas."], "c": 0},
            {"q": "Em Regressão Linear Simples, o que o modelo tenta minimizar usando o método dos Mínimos Quadrados Ordinários (OLS)?", "o": ["A média total dos dados.", "O número de variáveis do modelo.", "A soma dos quadrados dos resíduos (a distância vertical entre os pontos reais e a reta de regressão).", "A correlação de Pearson entre X e Y."], "c": 2},
            {"q": "A equação da Regressão Linear Simples é Y = b0 + b1*X. O que o coeficiente 'b1' representa?", "o": ["Onde a reta cruza o eixo Y (intercepto).", "O erro residual do modelo.", "A inclinação da reta (slope), ou seja, a mudança esperada em Y para cada unidade de aumento em X.", "A margem de erro máxima permitida."], "c": 2},
            {"q": "Apesar do nome, a Regressão Logística é um algoritmo primariamente utilizado para tarefas de:", "o": ["Prever valores contínuos infinitos.", "Classificação (geralmente binária, como prever Fraude ou Não Fraude).", "Limpeza de dados textuais.", "Compressão de imagens."], "c": 1},
            {"q": "Qual função matemática a Regressão Logística utiliza para 'esmagar' o resultado da equação linear em uma probabilidade entre 0 e 1?", "o": ["Função Tangente Hiperbólica (Tanh)", "Função ReLU", "Função Sigmoid (Logit)", "Função Softmax"], "c": 2},
            {"q": "Em Árvores de Decisão (Decision Trees), o que as métricas de 'Entropia' ou 'Índice Gini' tentam medir ao escolher qual variável usar para dividir um nó?", "o": ["O tempo de processamento do nó.", "A 'impureza' ou mistura das classes. O algoritmo busca a divisão que maximize o Ganho de Informação (maior pureza nos nós filhos).", "A altura máxima da árvore.", "A distância euclidiana entre as variáveis."], "c": 1},
            {"q": "Qual a principal desvantagem de uma Árvore de Decisão muito profunda (sem restrições/poda)?", "o": ["Ela é muito difícil de interpretar por humanos.", "Ela só funciona com dados numéricos.", "Ela é extremamente propensa a Overfitting, memorizando o ruído dos dados de treino.", "Ela requer normalização prévia dos dados (StandardScaler)."], "c": 2},
            {"q": "A técnica de 'Pruning' (Poda) em Árvores de Decisão serve para:", "o": ["Adicionar mais galhos e aumentar a complexidade.", "Remover seções da árvore que fornecem pouco poder preditivo, ajudando a combater o Overfitting e melhorando a generalização.", "Colorir a árvore graficamente.", "Transformar a árvore em uma regressão linear."], "c": 1},
            {"q": "Random Forest (Floresta Aleatória) é considerado um método de 'Ensemble' (Conjunto) do tipo:", "o": ["Boosting", "Stacking", "Bagging (Bootstrap Aggregating)", "Clustering"], "c": 2},
            {"q": "Por que o Random Forest escolhe um subconjunto aleatório de *features* (variáveis) em cada quebra de nó da árvore?", "o": ["Para economizar memória RAM.", "Para descorrelacionar as árvores do ensemble, garantindo que o modelo seja mais robusto e não dependa sempre de uma única variável dominante.", "Porque o algoritmo tem um limite de colunas.", "Para forçar o modelo a errar mais e evitar perfeição."], "c": 1},
            {"q": "Qual a principal diferença entre métodos de Bagging (ex: Random Forest) e Boosting (ex: XGBoost, AdaBoost)?", "o": ["Bagging treina modelos em série (um aprende com os erros do outro); Boosting treina modelos independentes em paralelo.", "Bagging treina modelos independentes em paralelo e faz a média; Boosting treina modelos sequencialmente, onde cada novo modelo foca em corrigir os erros dos modelos anteriores.", "Bagging é apenas para regressão; Boosting apenas para classificação.", "Não há diferença matemática."], "c": 1},
            {"q": "O algoritmo Support Vector Machine (SVM) tenta encontrar no espaço N-dimensional um:", "o": ["Centro de massa perfeito.", "Hiperplano ótimo que maximize a margem (distância) de separação entre as diferentes classes.", "Mínimo local na função de perda.", "Círculo perfeito agrupando os dados."], "c": 1},
            {"q": "No SVM, o que são os 'Vetores de Suporte' (Support Vectors)?", "o": ["Bibliotecas do Python usadas para rodar o modelo.", "As variáveis que têm a maior correlação com a variável alvo.", "Os pontos de dados reais mais próximos do hiperplano de separação, que 'sustentam' e definem a margem.", "Setas desenhadas nos gráficos de saída."], "c": 2},
            {"q": "Quando os dados não são linearmente separáveis no SVM, qual recurso matemático o algoritmo utiliza para projetar os dados em uma dimensão maior onde a separação se torna possível?", "o": ["Kernel Trick (Truque do Kernel, ex: RBF, Polinomial).", "Gradient Descent.", "Softmax Transformation.", "Sigmoid Binarization."], "c": 0},
            {"q": "O K-Nearest Neighbors (KNN) é classificado como um algoritmo de 'Lazy Learning' (Aprendizado Preguiçoso) porque:", "o": ["Ele demora muito tempo para importar no Python.", "Ele não constrói um modelo matemático interno real durante a fase de 'treino'; ele apenas memoriza os dados e faz todo o cálculo no momento da predição.", "Ele processa os dados muito lentamente.", "Ele ignora valores extremos por preguiça."], "c": 1},
            {"q": "Qual é um passo de pré-processamento OBRIGATÓRIO ao usar algoritmos baseados em distância como KNN e SVM?", "o": ["Transformar as variáveis para o formato JSON.", "Deletar as colunas de texto.", "Escalar/Normalizar os dados numéricos (ex: StandardScaler), pois diferenças de escala (ex: Idade vs Salário) distorcem o cálculo da distância euclidiana.", "Converter o dataset para um array 1D."], "c": 2},
            {"q": "O algoritmo Naive Bayes é frequentemente utilizado em tarefas de:", "o": ["Previsão de séries temporais financeiras.", "Detecção de objetos em vídeos.", "Classificação de textos (ex: Filtro de Spam, Análise de Sentimentos), devido à sua eficiência com alta dimensionalidade de palavras.", "Geração de imagens artificiais."], "c": 2},
            {"q": "Por que o algoritmo Naive Bayes é chamado de 'Ingênuo' (Naive)?", "o": ["Porque o código-fonte dele é muito fácil de escrever.", "Porque ele assume (ingenuamente) que todas as variáveis preditoras (features) são mutuamente independentes entre si, o que raramente é verdade no mundo real.", "Porque ele sempre acerta 100% das vezes.", "Porque ele só funciona com datasets muito pequenos."], "c": 1},
            {"q": "Na Matriz de Confusão para classificação, o que é um 'Falso Positivo' (Erro Tipo I)?", "o": ["O modelo previu a classe Negativa, e estava correto.", "O modelo previu a classe Positiva, e estava correto.", "O modelo previu a classe Positiva, mas a classe real era Negativa (Ex: Disse que era fraude, mas o cliente era legítimo).", "O modelo previu a classe Negativa, mas a classe real era Positiva."], "c": 2},
            {"q": "A métrica de 'Precisão' (Precision) responde a qual pergunta do negócio?", "o": ["De todos os casos que eram realmente positivos, quantos o modelo encontrou?", "De todas as vezes que o modelo classificou como 'Positivo', quantas ele realmente acertou? (Verdadeiros Positivos / (Verdadeiros Positivos + Falsos Positivos)).", "Qual a média de acertos totais do modelo?", "Qual a taxa de Falsos Negativos?"], "c": 1},
            {"q": "A métrica de 'Recall' (Revocação ou Sensibilidade) responde a qual pergunta?", "o": ["Qual a taxa de erro do modelo?", "De todas as previsões Positivas, quantas estavam corretas?", "De todos os casos que REALMENTE eram Positivos, quantos o modelo conseguiu identificar e não deixou escapar? (Verdadeiros Positivos / (Verdadeiros Positivos + Falsos Negativos)).", "Quais variáveis são mais importantes?"], "c": 2},
            {"q": "Se você está construindo um modelo para diagnosticar Câncer, qual métrica você quer maximizar (mesmo que à custa da outra)?", "o": ["Quero maximizar a Precisão, não me importo de mandar doentes para casa.", "Quero maximizar a Acurácia (Accuracy) global.", "Quero maximizar o Recall: é melhor ter Falsos Positivos (fazer exames extras) do que ter Falsos Negativos (mandar um doente para casa sem tratamento).", "Quero maximizar o R-Quadrado."], "c": 2},
            {"q": "O F1-Score é muito utilizado em bases de dados desbalanceadas porque ele é:", "o": ["A média aritmética simples entre Acurácia e Erro.", "A média harmônica entre a Precisão e o Recall, penalizando o modelo se uma dessas duas métricas for muito baixa.", "O tempo em segundos que o modelo leva para rodar.", "Uma métrica exclusiva para regressão."], "c": 1},
            {"q": "A Acurácia (Accuracy) é uma péssima métrica e pode ser enganosa em qual cenário?", "o": ["Quando o dataset é pequeno.", "Quando as classes estão perfeitamente balanceadas (50/50).", "Quando as classes são altamente desbalanceadas (ex: 99% transações boas e 1% fraude). O modelo pode prever 'Tudo Bom' e ter 99% de acurácia sendo inútil.", "Quando usamos regressão linear."], "c": 2},
            {"q": "A Curva ROC (Receiver Operating Characteristic) plota a relação gráfica entre quais taxas do modelo em diversos limiares (thresholds)?", "o": ["Acurácia vs Erro.", "True Positive Rate (Recall) no eixo Y vs False Positive Rate no eixo X.", "Precisão vs F1-Score.", "Viés vs Variância."], "c": 1},
            {"q": "O que a métrica AUC (Area Under the ROC Curve) igual a 0.5 indica sobre o seu modelo de classificação binária?", "o": ["O modelo é perfeito.", "O modelo tem 50% de precisão absoluta.", "O modelo tem o mesmo poder preditivo de jogar uma moeda pro alto (não aprendeu a separar as classes).", "O modelo inverteu perfeitamente as classes."], "c": 2},
            {"q": "Qual é a penalidade aplicada pela técnica de regularização L1 (Lasso Regression)?", "o": ["Soma dos quadrados dos coeficientes.", "Soma dos valores absolutos dos coeficientes, forçando alguns coeficientes a serem exatamente ZERO (fazendo seleção de features embutida).", "Aumenta o número de árvores no Random Forest.", "Poda a árvore de decisão na raiz."], "c": 1},
            {"q": "Qual a diferença comportamental da regularização L2 (Ridge Regression) comparada à L1 (Lasso)?", "o": ["Ridge penaliza os quadrados dos coeficientes, encolhendo os pesos de variáveis menos importantes para perto de zero, mas não exatamente a zero.", "Ridge exclui variáveis do modelo.", "Ridge é usada apenas para classificação.", "Ridge não usa penalidade matemática."], "c": 0},
            {"q": "Elastic Net é um algoritmo de regressão linear que combina:", "o": ["Random Forest com XGBoost.", "Tanto a penalidade L1 (Lasso) quanto a L2 (Ridge) simultaneamente.", "Regressão Logística com K-Means.", "Redes Neurais com Árvores."], "c": 1},
            {"q": "Em modelagem preditiva, por que realizamos o 'Train-Test Split' (divisão de treino e teste) nos dados?", "o": ["Para diminuir o tamanho do arquivo no disco.", "Para avaliar a performance do modelo em dados inéditos que ele nunca viu, garantindo que ele não decorou a base de treino.", "Para acelerar o treinamento.", "Para enviar metade dos dados ao cliente."], "c": 1},
            {"q": "O que é K-Fold Cross Validation (Validação Cruzada)?", "o": ["Um tipo de modelo de regressão.", "Dividir os dados em K partes iguais, treinando o modelo K vezes (usando uma parte diferente para teste a cada vez e as demais para treino) para obter uma métrica de erro mais confiável e robusta.", "Uma forma de dobrar o dataset (data augmentation).", "Um método para preencher dados ausentes (NaN)."], "c": 1},
            {"q": "Qual é o papel de um conjunto de dados de 'Validação' (Validation Set), diferindo do de 'Teste'?", "o": ["Não há diferença, são sinônimos absolutos.", "A Validação é usada para ajustar os Hiperparâmetros do modelo durante a fase de treino; o Teste é guardado e usado apenas uma vez no final para avaliar o modelo final.", "O Teste ajusta o modelo, a Validação é entregue ao cliente.", "A Validação é usada apenas em algoritmos não-supervisionados."], "c": 1},
            {"q": "Hiperparâmetros (Hyperparameters) de um modelo de ML diferem de Parâmetros (Pesos) porque:", "o": ["Não há diferença em ML.", "Hiperparâmetros são os coeficientes calculados pela matemática do algoritmo (ex: b0, b1); Parâmetros são definidos pelo cientista.", "Hiperparâmetros são as configurações ajustadas pelo cientista de dados antes do treino (ex: profundidade da árvore, taxa de aprendizado); Parâmetros são aprendidos pelo modelo sozinho com os dados.", "Hiperparâmetros são usados apenas em Deep Learning."], "c": 2},
            {"q": "Grid Search CV é uma técnica automatizada amplamente utilizada para:", "o": ["Buscar dados ausentes numa matriz.", "Testar exaustivamente todas as combinações possíveis de um dicionário de hiperparâmetros para encontrar a configuração ótima de um modelo.", "Buscar vírus na rede.", "Plotar gráficos de dispersão."], "c": 1},
            {"q": "Para problemas onde o dataset sofre de Data Imbalance (Desbalanceamento Extremo de Classes), qual técnica NÃO é recomendada?", "o": ["SMOTE (Synthetic Minority Over-sampling Technique).", "Undersampling (reduzir a classe majoritária).", "Ignorar o desbalanceamento e avaliar a qualidade apenas usando Acurácia.", "Oversampling (duplicar a classe minoritária) ou alterar o peso das classes (class_weight)."], "c": 2},
            {"q": "O que a técnica SMOTE faz fisicamente na base de dados?", "o": ["Deleta aleatoriamente dados da classe com mais registros.", "Cria exemplos sintéticos interpolando os dados reais da classe minoritária, ajudando o modelo a reconhecer padrões sem apenas duplicar linhas.", "Criptografa a base de dados.", "Converte imagens em texto numérico."], "c": 1},
            {"q": "Em Gradient Descent (Descida do Gradiente), o que a métrica 'Learning Rate' (Taxa de Aprendizado) controla?", "o": ["O número de linhas do dataset lidas por segundo.", "O tamanho do 'passo' que o algoritmo dá a cada iteração na direção do mínimo da função de custo.", "A quantidade máxima de árvores.", "O número de camadas ocultas da rede neural."], "c": 1},
            {"q": "O que pode acontecer se a Learning Rate no Gradient Descent for definida com um valor muito grande (alto)?", "o": ["O modelo aprenderá instantaneamente com perfeição.", "O modelo demorará semanas para convergir.", "O algoritmo pode 'pular' o ponto mínimo da função de custo, oscilando loucamente e até divergindo (erro infinito).", "O modelo se transforma automaticamente em uma Random Forest."], "c": 2},
            {"q": "A diferença entre o Gradient Descent em Lote (Batch) e o Stochastic Gradient Descent (SGD) é:", "o": ["Batch usa todos os dados de uma vez para atualizar os pesos; SGD atualiza os pesos calculando o gradiente para apenas um exemplo (linha) aleatório por vez.", "SGD é apenas para matrizes pequenas.", "Batch é aleatório; SGD é sequencial.", "Não há diferença, um é apelido do outro."], "c": 0},
            {"q": "Em Regressão Linear, as métricas MAE (Erro Médio Absoluto) e RMSE (Raiz do Erro Quadrático Médio) medem o erro do modelo. Qual a grande característica do RMSE em relação ao MAE?", "o": ["O RMSE penaliza fortemente (eleva ao quadrado) grandes erros isolados/outliers, dando um peso maior a previsões que erraram por muito.", "O RMSE ignora outliers totalmente.", "O RMSE retorna um valor percentual exato.", "O MAE é sempre maior matematicamente que o RMSE."], "c": 0},

            {"q": "Fazer a Normalização (StandardScaler) no dataset INTEIRO antes de realizar o Train-Test Split (divisão) causa:", "o": ["Melhoria instantânea da acurácia sem efeitos colaterais.", "Data Leakage, pois a média e desvio padrão usados para escalar o Treino já contêm influência estatística escondida dos dados que deveriam ser de Teste (inéditos).", "Overfitting nas árvores de decisão.", "A exclusão automática de dados nulos."], "c": 1},

            {"q": "Se você precisa de um modelo base (Baseline Model) rápido e interpretável no qual a diretoria possa entender o impacto de cada variável para aprovar ou negar crédito a um cliente, você deve priorizar:", "o": ["Redes Neurais Profundas (Deep Learning).", "Black-boxes como o XGBoost agressivo.", "Regressão Logística ou Árvore de Decisão Simples.", "KNN (K-Nearest Neighbors)."], "c": 2},

        "Módulo 6": [
            {"q": "Qual é a principal diferença entre o Aprendizado Supervisionado e o Não-Supervisionado?", "o": ["O Não-Supervisionado é sempre mais rápido e usa menos memória.", "No Não-Supervisionado, os dados de treinamento não possuem rótulos (labels/respostas). O algoritmo deve encontrar a estrutura oculta por conta própria.", "O Não-Supervisionado só funciona com variáveis categóricas.", "O Supervisionado é usado para agrupar clientes; o Não-Supervisionado preve lucros."], "c": 1},
            {"q": "Qual das opções abaixo é um exemplo clássico de um problema de Aprendizado Não-Supervisionado?", "o": ["Prever o preço de uma casa com base em sua metragem.", "Classificar um e-mail como Spam ou Não-Spam.", "Segmentar clientes de um e-commerce em grupos com comportamentos de compra semelhantes (Clustering).", "Detectar o idioma de um texto usando Redes Neurais."], "c": 2},
            {"q": "O algoritmo K-Means é amplamente utilizado para tarefas de Clusterização (Agrupamento). O que o parâmetro 'K' representa?", "o": ["O número de iterações máximas permitidas.", "O número de clusters (grupos) que o algoritmo deve tentar encontrar no conjunto de dados.", "O valor da constante matemática K usada na distância euclidiana.", "O número de colunas (features) do dataset."], "c": 1},
            {"q": "Como o K-Means inicializa o processo de clusterização?", "o": ["Calculando a média de todos os pontos de dados simultaneamente.", "Selecionando aleatoriamente 'K' pontos de dados para atuarem como os centroides (centros dos clusters) iniciais.", "Colocando todos os pontos em um único cluster e dividindo aos poucos.", "Rodando uma Árvore de Decisão primeiro."], "c": 1},
            {"q": "O K-Means é altamente sensível a qual característica dos dados?", "o": ["Dados em formato de string.", "Variáveis com distribuição perfeitamente normal.", "Outliers (valores extremos) e diferenças na escala das variáveis, pois ele é baseado em distâncias métricas (Euclidiana).", "Dados ordenados alfabeticamente."], "c": 2},
            {"q": "Para mitigar a sensibilidade à inicialização aleatória dos centroides, qual variação do K-Means é o padrão na biblioteca scikit-learn?", "o": ["K-Medoids", "K-Means++ (espalha os centroides iniciais de forma mais inteligente para acelerar a convergência e evitar mínimos locais).", "Fuzzy C-Means", "Mini-Batch K-Means"], "c": 1},
            {"q": "O Método do Cotovelo (Elbow Method) é uma heurística visual usada no K-Means para:", "o": ["Descobrir quais colunas deletar.", "Definir a taxa de aprendizado (Learning Rate) ideal.", "Determinar o número ótimo de clusters (K), plotando a inércia (Soma dos Quadrados Intra-Cluster) contra o número K e buscando o ponto de inflexão.", "Avaliar a precisão de um modelo supervisionado."], "c": 2},
            {"q": "A métrica 'Silhouette Score' (Coeficiente de Silhueta) avalia a qualidade de uma clusterização medindo:", "o": ["O quão rápido o algoritmo rodou em segundos.", "O quão semelhante um objeto é ao seu próprio cluster em comparação com outros clusters. Varia de -1 a 1.", "Apenas o tamanho do cluster.", "O número exato de outliers na base de dados."], "c": 1},
            {"q": "Um valor de Silhouette Score próximo a -1 indica que:", "o": ["O algoritmo é perfeito e rápido.", "O ponto de dado está exatamente no meio de dois clusters.", "O ponto de dado provavelmente foi atribuído ao cluster errado, pois está mais próximo dos pontos do cluster vizinho do que do seu próprio.", "O cluster não tem outliers."], "c": 2},
            {"q": "Diferente do K-Means, o DBSCAN (Density-Based Spatial Clustering of Applications with Noise) tem a grande vantagem de:", "o": ["Funcionar perfeitamente sem necessidade de padronizar os dados.", "Não exigir que o usuário especifique o número de clusters (K) a priori, além de ser capaz de encontrar clusters de formas não-esféricas e isolar ruídos (outliers).", "Forçar todos os pontos, inclusive outliers, a pertencerem a um cluster.", "Ser baseado estritamente em árvores de decisão."], "c": 1},
            {"q": "No algoritmo DBSCAN, o parâmetro 'eps' (epsilon) define:", "o": ["A taxa de erro permitida.", "O raio máximo da vizinhança ao redor de um ponto de dado para que outros pontos sejam considerados como pertencentes ao mesmo grupo (densidade).", "O número mínimo de pontos em um cluster.", "A quantidade máxima de memória RAM utilizável."], "c": 1},
            {"q": "O parâmetro 'min_samples' no DBSCAN determina:", "o": ["O número de colunas necessárias para rodar o algoritmo.", "A proporção da amostra de treino sobre o teste.", "O número mínimo de pontos que devem existir dentro do raio 'eps' para que um ponto central (Core Point) forme um cluster.", "O número de clusters que o modelo deve retornar no final."], "c": 2},
            {"q": "O que acontece com um ponto de dado no DBSCAN se ele não for um ponto central (Core) e não for alcançável por nenhum outro ponto central?", "o": ["Ele é deletado fisicamente do banco de dados.", "Ele cria o seu próprio cluster solitário.", "Ele é classificado como Ruído/Outlier (Noise) e não é atribuído a nenhum cluster válido.", "Ele é forçado a entrar no cluster mais próximo infinitamente."], "c": 2},
            {"q": "A Clusterização Hierárquica (Hierarchical Clustering) constrói clusters através de um processo iterativo. O resultado final geralmente é visualizado através de um:", "o": ["Gráfico de Dispersão 3D.", "Boxplot de múltiplas variáveis.", "Dendrograma, uma estrutura em forma de árvore que mostra como os clusters são mesclados passo a passo.", "Histograma de densidade."], "c": 2},
            {"q": "Na abordagem Aglomerativa (Bottom-up) de Clusterização Hierárquica, o processo começa com:", "o": ["Todos os dados em um único super-cluster e vai dividindo iterativamente.", "Cada ponto de dado sendo o seu próprio cluster individual, e vai mesclando os clusters mais próximos até restar apenas um.", "A deleção aleatória de dados até sobrarem apenas 2 grupos.", "O uso de K-Means para inicializar os centros."], "c": 1},
            {"q": "O conceito de 'Linkage' na Clusterização Hierárquica define:", "o": ["A conexão de internet usada para baixar as bibliotecas.", "A fórmula matemática usada para calcular a distância entre os próprios *clusters* (ex: Ward, Single, Complete, Average).", "O vínculo entre a variável independente e dependente.", "O link do banco de dados SQL."], "c": 1},
            {"q": "O Linkage 'Ward' é muito popular em Clusterização Hierárquica Aglomerativa porque ele busca minimizar:", "o": ["A distância máxima entre os pontos de clusters diferentes.", "O aumento da Variância Intra-Cluster ao mesclar dois clusters, criando grupos mais esféricos e de tamanhos similares.", "O número total de iterações do algoritmo.", "O tempo de processamento da CPU."], "c": 1},
            {"q": "Redução de Dimensionalidade é uma técnica não-supervisionada crucial para:", "o": ["Aumentar o número de linhas de um dataset pequeno.", "Criptografar os dados antes de enviá-los à nuvem.", "Reduzir o número de features (colunas), eliminando redundâncias/ruídos, facilitando a visualização 2D/3D e acelerando o treinamento de outros modelos sem perder a variância essencial.", "Eliminar os algoritmos de regressão do projeto."], "c": 2},
            {"q": "A maldição da dimensionalidade (Curse of Dimensionality) refere-se ao fato de que:", "o": ["Arrays em 3D consomem mais energia elétrica.", "Algoritmos não supervisionados são banidos de alguns servidores.", "À medida que o número de variáveis (features) aumenta, o espaço de dados cresce exponencialmente, tornando os dados esparsos e dificultando que algoritmos baseados em distância achem padrões significativos.", "Redes neurais precisam de pelo menos 1.000 variáveis para rodar."], "c": 2},
            {"q": "O PCA (Principal Component Analysis) é a técnica mais famosa de Redução de Dimensionalidade. O que ele faz matematicamente?", "o": ["Exclui fisicamente as colunas com nomes muito grandes.", "Encontra novas variáveis ortogonais (Componentes Principais) que são combinações lineares das variáveis originais, projetando os dados na direção de máxima variância.", "Muda os dados para o formato de Árvore de Decisão.", "Clusteriza os dados em K grupos iguais."], "c": 1},
            {"q": "No PCA, o 'Primeiro Componente Principal' (PC1) é caracterizado por:", "o": ["Ser a coluna original do dataset com o maior valor médio.", "Ser a projeção linear que captura a MAIOR quantidade de variância dos dados originais.", "Ser sempre um número binário.", "Ser o resíduo do modelo."], "c": 1},
            {"q": "Os componentes criados pelo PCA têm uma propriedade especial em relação aos outros: eles são não correlacionados. Qual é o termo matemático para isso?", "o": ["Homogêneos.", "Paralelos.", "Ortogonais.", "Coplanares."], "c": 2},
            {"q": "Por que é estritamente necessário aplicar a Padronização (ex: StandardScaler) nos dados ANTES de aplicar o PCA?", "o": ["O PCA é sensível à escala das variáveis. Sem padronizar, colunas com valores grandes (ex: Salário em milhões) vão dominar a variância e distorcer os Componentes Principais.", "O PCA não aceita números flutuantes.", "Porque o Scikit-Learn gera um erro de sintaxe se não fizer.", "Para garantir que o PCA retorne strings."], "c": 0},
            {"q": "Como sabemos quantos Componentes Principais reter após rodar o PCA?", "o": ["Sempre escolhemos 2 componentes para plotar no gráfico.", "Olhando a 'Razão da Variância Explicada' (Explained Variance Ratio). Escolhemos o menor número de componentes que, somados, retenham uma variância aceitável (ex: 80% a 95%).", "Dividimos o número de colunas por 2.", "O PCA escolhe automaticamente sempre."], "c": 1},
            {"q": "Além do PCA, qual é outra técnica avançada de Redução de Dimensionalidade frequentemente usada primariamente para VISUALIZAÇÃO de dados de alta dimensão em 2D ou 3D?", "o": ["K-Means", "Regressão Logística", "t-SNE (t-Distributed Stochastic Neighbor Embedding)", "Apriori"], "c": 2},
            {"q": "Diferente do PCA, que preserva a variância global do dataset, o t-SNE (e o UMAP) foca principalmente em preservar:", "o": ["A média absoluta dos dados.", "As estruturas não lineares e as distâncias locais, garantindo que pontos próximos na alta dimensão permaneçam próximos no gráfico 2D/3D.", "Os dados nulos.", "Os nomes originais das colunas."], "c": 1},
            {"q": "Sistemas de Recomendação são muito populares na Netflix e Amazon. A técnica de 'Filtragem Colaborativa' (Collaborative Filtering) recomenda itens baseando-se em:", "o": ["Nas características físicas do produto (cor, tamanho, texto da sinopse).", "No histórico de compras do usuário somado às semelhanças de comportamento com outros usuários (ex: 'Pessoas que gostaram de X também gostaram de Y').", "Apenas na popularidade (itens mais vendidos do site).", "Em regras aleatórias geradas diariamente."], "c": 1},
            {"q": "Por outro lado, a técnica de 'Filtragem Baseada em Conteúdo' (Content-Based Filtering) em Sistemas de Recomendação usa:", "o": ["Os atributos do próprio usuário e as avaliações da comunidade inteira.", "As características intrínsecas dos itens (ex: Gênero de filme, autor do livro) e o perfil passado do usuário, não dependendo de outros usuários do sistema.", "As recomendações pagas pelos patrocinadores.", "Algoritmos não supervisionados de K-Means apenas."], "c": 1},
            {"q": "O que é o 'Problema do Frio Inicial' (Cold Start Problem) em Sistemas de Recomendação?", "o": ["Os servidores demoram a esquentar de manhã.", "A dificuldade de fornecer recomendações precisas para um novo usuário que acabou de se cadastrar e ainda não tem histórico, ou para um novo item sem avaliações.", "A interface do usuário ser muito complexa.", "A impossibilidade de recomendar filmes de inverno no verão."], "c": 1},
            {"q": "Em Análise de Cesta de Compras (Market Basket Analysis), qual algoritmo clássico é usado para mineração de Regras de Associação?", "o": ["DBSCAN", "Redes Neurais Convolucionais", "Algoritmo Apriori", "Gradient Boosting"], "c": 2},
            {"q": "Na mineração de Regras de Associação (ex: Se compra Pão, então compra Manteiga), a métrica de 'Suporte' (Support) indica:", "o": ["O quanto o cliente confia na marca.", "A frequência com que a combinação de itens aparece em todas as transações (A proporção de transações que contêm ambos Pão e Manteiga).", "O lucro gerado por essa venda.", "A velocidade do sistema de caixa."], "c": 1},
            {"q": "Nas Regras de Associação, o que a métrica de 'Confiança' (Confidence) representa na regra 'A -> B'?", "o": ["A chance do cliente devolver o produto.", "A probabilidade de o item B ser comprado DADO que o item A foi comprado na mesma transação (Transações com A e B / Transações com A).", "O quão certo o algoritmo está sem olhar os dados.", "O valor do desconto aplicado."], "c": 1},
            {"q": "E o que a métrica de 'Lift' representa na regra de associação 'A -> B'?", "o": ["Aumento de peso do pacote de dados.", "O quanto a compra de A aumenta a probabilidade de B ser comprado, comparado à probabilidade de B ser comprado isoladamente por acaso. Lift > 1 indica forte associação positiva.", "O lucro líquido por transação.", "O tempo salvo em segundos na fila do caixa."], "c": 1},
            {"q": "Detecção de Anomalias (Anomaly Detection / Outlier Detection) é um uso comum do Aprendizado Não-Supervisionado. Um algoritmo clássico para isso no scikit-learn é o:", "o": ["Linear Regression", "Isolation Forest", "Naive Bayes", "K-Nearest Neighbors"], "c": 1},
            {"q": "Como o 'Isolation Forest' atua para identificar anomalias?", "o": ["Isola a rede do computador da internet.", "Ele cria árvores de decisão aleatórias e mede a profundidade necessária para isolar um ponto de dado. Outliers são mais fáceis de isolar, exigindo caminhos (profundidades) mais curtos.", "Cria um cluster para os outliers usando K-Means com K=100.", "Ele usa Regressão Logística para prever a probabilidade de ser outlier."], "c": 1},
            {"q": "Autoencoders são uma arquitetura de Redes Neurais usada em Aprendizado Não-Supervisionado principalmente para:", "o": ["Escrever relatórios textuais automáticos.", "Jogar videogame de forma autônoma.", "Redução de dimensionalidade, detecção de anomalias ou compressão, tentando reconstruir a própria entrada (input) original passando por uma camada oculta menor (bottleneck).", "Gerar sons de fala sintética apenas."], "c": 2},
            {"q": "Em modelagem de tópicos (Topic Modeling) aplicada a Processamento de Linguagem Natural (NLP), qual técnica não-supervisionada é famosa por descobrir temas em grandes coleções de textos?", "o": ["LDA (Latent Dirichlet Allocation).", "Regressão de Poisson.", "KNN (K-Nearest Neighbors).", "Support Vector Machines (SVM)."], "c": 0},
            {"q": "Uma desvantagem frequente dos métodos de Clustering (Agrupamento) em ambientes empresariais é:", "o": ["Eles rodam apenas em linguagem R.", "Como não há rótulos de 'verdade absoluta', é subjetivo avaliar se os clusters encontrados realmente fazem sentido ou têm valor prático para os negócios sem análise humana posterior.", "Eles só aceitam bases de dados perfeitamente limpas.", "Eles excluem o banco de dados se houver erro matemático."], "c": 1},
            {"q": "O que é 'Imputação K-NN' no contexto de pré-processamento de dados?", "o": ["Um método para apagar todos os dados do banco.", "Um algoritmo não supervisionado que preenche dados ausentes (NaN) baseando-se na média/mediana dos K vizinhos mais próximos daquela linha.", "O uso de K-Means para remover dados irreais.", "Uma criptografia do K-Nearest Neighbors."], "c": 1},
            {"q": "Em relação à avaliação de Machine Learning, o que o conceito de 'Data Drift' (Desvio de Dados) aborda em modelos em produção (MLOps)?", "o": ["O arquivo CSV foi corrompido durante o download.", "A mudança na distribuição estatística das variáveis de entrada ao longo do tempo (ex: comportamento de clientes mudou após a pandemia), degradando a performance do modelo sem que o código tenha sido alterado.", "Um erro de versão do Python instalado no servidor.", "O algoritmo ficou com viés cognitivo humano."], "c": 1},
            {"q": "Quando lidamos com Data Drift, qual é a ação mais comum a ser tomada pela equipe de Dados?", "o": ["Demitir o Cientista de Dados.", "Ignorar e manter o modelo rodando eternamente.", "Re-treinar o modelo periodicamente usando dados mais recentes ou ajustar a janela de treinamento.", "Transformar o modelo em um sistema não-supervisionado puro."], "c": 2},
            {"q": "Concept Drift (Desvio de Conceito) é ligeiramente diferente do Data Drift porque:", "o": ["Não afeta Machine Learning.", "Data Drift foca na mudança das variáveis de entrada (X); Concept Drift ocorre quando a relação entre X e Y muda ao longo do tempo (o que era considerado fraude ontem, hoje é normal).", "Concept Drift é um erro de sintaxe do desenvolvedor.", "Concept Drift só afeta imagens."], "c": 1},
            {"q": "A técnica de 'Cross-Validation Leave-One-Out' (LOOCV) é:", "o": ["Uma validação cruzada onde K é igual a 2.", "Um método onde apenas um único dado é usado como teste e os N-1 restantes como treino, iterando isso para todos os N dados. Computacionalmente exaustivo e usado para bases pequenas.", "Uma técnica de validação para excluir a pior coluna.", "Um algoritmo de regressão linear para uma variável."], "c": 1},
            {"q": "Ao construir um modelo de pontuação de crédito (Credit Scoring), a métrica 'KS Statistic' (Estatística de Kolmogorov-Smirnov) avalia:", "o": ["A velocidade do banco de dados relacional.", "O grau máximo de separação entre a distribuição acumulada dos Bons e Maus pagadores. Quanto maior o KS, melhor o modelo separa as classes.", "A quantidade de linhas em branco do formulário de crédito.", "A taxa de juros do empréstimo."], "c": 1},
            {"q": "SHAP Values (SHapley Additive exPlanations) são usados na Ciência de Dados moderna para resolver o problema de:", "o": ["Lentidão nos bancos NoSQL.", "Interpretabilidade (ExAI). Eles mostram exatamente o impacto positivo ou negativo que cada feature teve na predição de um dado específico, abrindo a 'caixa preta' de modelos complexos como o XGBoost.", "Criptografar dados sensíveis de clientes (LGPD).", "Melhorar os gráficos de barras no Matplotlib."], "c": 1},
            {"q": "Outra biblioteca/ferramenta famosa para interpretabilidade (explicabilidade) de modelos preditivos 'Caixa Preta', focada em explicações locais em torno de uma predição única, chama-se:", "o": ["TENSOR", "NUMPY", "LIME (Local Interpretable Model-agnostic Explanations)", "PANDAS"], "c": 2},
            {"q": "Em modelagem, o termo 'Gini Index' no contexto financeiro/risco (derivado da curva ROC) é frequentemente usado para:", "o": ["Medir a desigualdade de salários da equipe de dados.", "Avaliar o poder de discriminação do modelo de risco de crédito (Gini = 2 * AUC - 1).", "Contar o número de árvores do modelo Random Forest.", "Otimizar o armazenamento dos dados em SSDs."], "c": 1},
            {"q": "O que caracteriza uma métrica 'Custom Objective/Loss Function' em bibliotecas avançadas (ex: LightGBM)?", "o": ["Uma função matemática fornecida pelo próprio Cientista de Dados para o algoritmo minimizar (ex: penalizar erros falsos negativos 10x mais que falsos positivos), alinhando o modelo aos custos reais do negócio.", "Um erro do pacote que deleta arquivos locais.", "A função padrão do RMSE apenas traduzida para C++.", "Uma métrica que não pode ser calculada por computadores normais."], "c": 0},
            {"q": "Por que muitas vezes evitamos usar Modelos Ensemble extremamente profundos (ex: Stacking de 5 níveis de XGBoost/LGBM) em sistemas transacionais de Tempo Real (ex: Anti-Fraude de Cartão de Crédito em milissegundos)?", "o": ["Eles sofrem underfitting muito rápido.", "Devido à restrição de Latência/Performance na inferência. Esses modelos são pesados computacionalmente e podem estourar o SLA de resposta exigido pelos sistemas transacionais.", "Porque a linguagem Python não suporta Ensembles complexos.", "Não evitamos; eles são mandatórios por lei."], "c": 1},
            {"q": "Em um cenário real de entrevista: O recrutador pergunta o que fazer se o modelo tem 99% de acurácia no Treino e 60% de acurácia no Teste. A resposta mais completa é:", "o": ["O modelo está em Overfitting extremo. Eu aplicaria regularização (L1/L2), reduziria a complexidade do modelo (ex: podar árvores de decisão, reduzir épocas), buscaria mais dados ou usaria Dropout (em redes neurais).", "O modelo está ótimo. A base de teste que está errada e deve ser deletada.", "O modelo sofre de Underfitting. Eu criaria mais 1.000 variáveis complexas e retiraria a validação cruzada.", "Eu mudaria a linguagem de programação de Python para R."], "c": 0}
        ]

        "Módulo 7": [
            {"q": "Qual é a unidade computacional básica de uma Rede Neural Artificial, inspirada na biologia humana?", "o": ["Uma Árvore de Decisão.", "O Perceptron (ou neurônio artificial).", "Um cluster do K-Means.", "O Gradient Descent."], "c": 1},
            {"q": "Em um neurônio artificial, o que os 'Pesos' (Weights) representam matematicamente?", "o": ["A importância ou força da conexão entre a entrada e o neurônio.", "O erro final do modelo.", "A taxa de aprendizado do algoritmo.", "O número de camadas ocultas da rede."], "c": 0},
            {"q": "Além dos pesos, cada neurônio geralmente possui um 'Viés' (Bias). Qual é a sua função principal?", "o": ["Adicionar aleatoriedade para evitar overfitting.", "Deslocar a função de ativação para a esquerda ou direita, permitindo que o neurônio se ative mesmo quando todas as entradas forem zero.", "Aumentar a velocidade do processador (GPU).", "Zerar a saída se for negativa."], "c": 1},
            {"q": "Qual o papel de uma 'Função de Ativação' (Activation Function) em uma rede neural profunda?", "o": ["Calcular o erro absoluto do modelo.", "Limpar os dados ausentes da entrada.", "Introduzir não-linearidade à rede, permitindo que ela aprenda representações e padrões complexos (sem ela, a rede seria apenas uma regressão linear gigante).", "Criptografar as conexões neurais."], "c": 2},
            {"q": "Qual função de ativação é amplamente utilizada nas camadas ocultas das redes neurais modernas por resolver o problema do 'Vanishing Gradient' em saídas positivas?", "o": ["Sigmoid", "Tangente Hiperbólica (Tanh)", "ReLU (Rectified Linear Unit)", "Softmax"], "c": 2},
            {"q": "A função ReLU retorna qual valor se a entrada (input) for um número negativo (ex: -5)?", "o": ["-5", "1", "-1", "0"], "c": 3},
            {"q": "A função Sigmoid esmaga os valores de saída (output) em qual intervalo?", "o": ["Entre -1 e 1", "Entre 0 e 1", "Entre 0 e infinito", "Entre -infinito e infinito"], "c": 1},
            {"q": "Na camada final (output layer) de uma rede neural projetada para Classificação Multiclasse (ex: prever qual é o animal em uma foto dentre 10 opções), qual função de ativação é a norma?", "o": ["ReLU", "Softmax", "Identidade (Linear)", "Sigmoid"], "c": 1},
            {"q": "O que a função Softmax faz com as saídas brutas (logits) da última camada?", "o": ["Zera todas as saídas menores que zero.", "Aumenta o contraste das imagens processadas.", "Transforma os logits em uma distribuição de probabilidade, onde a soma de todas as classes é igual a 1 (100%).", "Multiplica os pesos pela taxa de aprendizado."], "c": 2},
            {"q": "O que é o processo de 'Forward Propagation' (Propagação Direta)?", "o": ["O cálculo dos erros e a atualização dos pesos da rede.", "O fluxo de dados da camada de entrada, passando pelas camadas ocultas, até gerar uma previsão na camada de saída.", "A clonagem da rede neural para a nuvem AWS.", "A exclusão de neurônios fracos."], "c": 1},
            {"q": "Após a Forward Propagation, o modelo avalia o quão errada foi a sua previsão. Essa medição é feita por qual função?", "o": ["Activation Function", "Loss Function (Função de Custo ou Perda)", "Dropout Function", "Kernel Trick"], "c": 1},
            {"q": "Para problemas de regressão (ex: prever preço de casas), qual Loss Function é classicamente utilizada?", "o": ["Binary Cross-Entropy", "Categorical Cross-Entropy", "Mean Squared Error (MSE)", "F1-Score"], "c": 2},
            {"q": "Para problemas de classificação (onde a saída é uma probabilidade via Sigmoid ou Softmax), qual Loss Function é a mais indicada?", "o": ["Mean Absolute Error (MAE)", "Cross-Entropy (Entropia Cruzada)", "Huber Loss", "R-Quadrado"], "c": 1},
            {"q": "Qual algoritmo fundamental é responsável por calcular os gradientes da função de perda em relação a cada peso da rede (usando a Regra da Cadeia do Cálculo), de trás para frente?", "o": ["K-Means", "Backpropagation (Retropropagação)", "Principal Component Analysis (PCA)", "Grid Search"], "c": 1},
            {"q": "Durante o Backpropagation, os pesos são finalmente atualizados utilizando qual técnica de otimização?", "o": ["Support Vector Machine (SVM)", "Árvores de Decisão Isoladas", "Gradient Descent (ou variantes como o Adam)", "Linear Scaling"], "c": 2},
            {"q": "O problema do 'Vanishing Gradient' (Desvanecimento do Gradiente) ocorre com frequência em redes neurais muito profundas quando se usa a função Sigmoid. O que acontece na prática?", "o": ["A rede aprende muito rápido e sofre overfitting.", "A GPU explode por falta de memória.", "Os gradientes tornam-se tão pequenos (próximos de zero) nas camadas iniciais que os pesos quase não se atualizam, paralisando o aprendizado da rede.", "O erro se torna infinito (Exploding Gradient)."], "c": 2},
            {"q": "Em Deep Learning, o que é um 'Epoch' (Época)?", "o": ["Um ciclo completo de treinamento em que a rede neural viu e processou TODO o conjunto de dados de treinamento exatamente uma vez.", "A quantidade de camadas da rede.", "O tempo em segundos que o modelo levou para compilar.", "O lote de dados enviado para a GPU a cada milissegundo."], "c": 0},
            {"q": "O que é o 'Batch Size' (Tamanho do Lote)?", "o": ["O número de épocas do modelo.", "O número total de neurônios na rede.", "O tamanho do arquivo salvo no disco rígido (.h5).", "A quantidade de amostras de dados propagadas pela rede antes que os pesos sejam atualizados matematicamente (ex: atualizar a cada 32 imagens)."], "c": 3},
            {"q": "Se temos um dataset de 1000 amostras e um Batch Size de 100, quantas atualizações de peso (iterações) ocorrerão em UMA Epoch?", "o": ["10 iterações", "100 iterações", "1000 iterações", "1 iteração"], "c": 0},
            {"q": "O Otimizador 'Adam' é amplamente utilizado em Deep Learning porque:", "o": ["Ele é o único que funciona em linguagem Python.", "Ele não usa gradientes matemáticos.", "Ele adapta a taxa de aprendizado (Learning Rate) individualmente para cada peso utilizando momentos de primeira e segunda ordem, convergindo mais rápido que o SGD tradicional.", "Ele reduz o tamanho das imagens automaticamente."], "c": 2},
            {"q": "Qual é o objetivo principal da técnica de 'Dropout' em redes neurais?", "o": ["Desligar a GPU temporariamente para não superaquecer.", "Aumentar a acurácia no conjunto de treinamento para 100%.", "Prevenir Overfitting desligando (zerando a ativação) aleatoriamente um percentual de neurônios durante cada passo do treinamento, forçando a rede a ser mais robusta e redundante.", "Preencher dados nulos (NaN) da entrada."], "c": 2},
            {"q": "Early Stopping (Parada Antecipada) é uma técnica de regularização que consiste em:", "o": ["Desligar a internet durante o download da base de dados.", "Parar o treinamento do modelo prematuramente quando o erro de 'Validação' começa a aumentar repetidamente (sinal de início de Overfitting), mesmo que o erro de 'Treino' continue caindo.", "Demitir o analista que construiu a rede profunda.", "Acelerar a velocidade da ventoinha do servidor."], "c": 1},
            {"q": "Batch Normalization (Normalização de Lote) é aplicada em redes profundas para:", "o": ["Normalizar e estabilizar as ativações (saídas) das camadas intermediárias ao longo das iterações, acelerando o treinamento e permitindo taxas de aprendizado maiores.", "Deletar as fotos em preto e branco.", "Substituir o algoritmo de Backpropagation.", "Transformar o modelo em não-supervisionado."], "c": 0},
            {"q": "CNN (Convolutional Neural Network) é a arquitetura padrão-ouro para resolver problemas de:", "o": ["Séries temporais financeiras.", "Tradução de textos.", "Visão Computacional (processamento, classificação e detecção de padrões em imagens/vídeos).", "Criação de áudio falso."], "c": 2},
            {"q": "Em uma CNN, o que uma operação de 'Convolução' faz?", "o": ["Deleta a imagem original.", "Mistura duas imagens para criar uma terceira.", "Desliza uma matriz menor (Filtro/Kernel) sobre a imagem original, multiplicando os pixels para extrair mapas de características (features como bordas, texturas).", "Aplica um filtro do Instagram."], "c": 2},
            {"q": "O que o parâmetro 'Stride' define na camada convolucional de uma CNN?", "o": ["A grossura da borda da imagem.", "O número de pixels que o Filtro/Kernel se desloca horizontal e verticalmente a cada passo da convolução.", "A cor primária da rede neural.", "O número de camadas de Pooling escondidas."], "c": 1},
            {"q": "Para que serve o 'Padding' (Preenchimento) nas bordas de uma imagem em uma CNN?", "o": ["Para adicionar uma moldura bonita na foto.", "Para garantir que as bordas originais da imagem sejam processadas de forma justa e para controlar o tamanho espacial da saída (ex: 'Same Padding' mantém a mesma dimensão).", "Para remover o ruído de fundo da foto (Recorte).", "Para transformar a imagem de RGB para Tons de Cinza."], "c": 1},
            {"q": "A camada de 'Pooling' (geralmente Max Pooling) em uma CNN é responsável por:", "o": ["Aumentar exponencialmente a resolução da imagem para HD.", "Mudar a cor da imagem processada.", "Adicionar novos filtros de convolução na base de dados.", "Reduzir as dimensões espaciais (largura e altura) dos feature maps, diminuindo a carga computacional, controlando o overfitting e extraindo as features dominantes."], "c": 3},
            {"q": "Se tivermos uma janela de Max Pooling de tamanho 2x2, qual valor ela extrairá para o novo mapa de características?", "o": ["A média dos 4 pixels da janela.", "O valor mínimo dos 4 pixels.", "O maior valor presente (pixel mais brilhante/ativado) dentro dos 4 pixels daquela janela.", "A soma total dividida por zero."], "c": 2},
            {"q": "Ao final das camadas Convolucionais e de Pooling de uma CNN, qual processo converte os mapas 2D/3D em um vetor unidimensional (1D) para alimentar uma rede neural densa clássica?", "o": ["Flattening (Achatamento)", "Squeezing", "Dimensionality Reduction via PCA", "Dropping out"], "c": 0},
            {"q": "RNN (Recurrent Neural Network) é a arquitetura clássica projetada especificamente para lidar com:", "o": ["Imagens estáticas.", "Dados sequenciais temporais ou texto (onde o contexto anterior/passado influencia a decisão do presente).", "Clusterização não supervisionada de clientes.", "Criação de matrizes SQL."], "c": 1},
            {"q": "O que confere à RNN a sua natureza 'Recorrente'?", "o": ["Ela é usada recorrentemente pelos cientistas de dados toda semana.", "Seu algoritmo entra em loop infinito e nunca para.", "A saída (Hidden State) de um passo de tempo anterior é realimentada como entrada para o passo de tempo atual, mantendo uma 'memória' do estado da sequência.", "Ela requer atualizações recorrentes de software."], "c": 2},
            {"q": "A arquitetura LSTM (Long Short-Term Memory) foi criada para resolver a principal falha das RNNs padrão, que era:", "o": ["A lentidão extrema no processamento de imagens.", "A incapacidade de trabalhar com textos.", "O problema do Vanishing Gradient em sequências longas, que impedia a RNN padrão de lembrar dependências e contextos de muitas etapas atrás.", "O excesso de gasto na memória de vídeo (VRAM)."], "c": 2},
            {"q": "Em uma célula LSTM, qual porta (Gate) é responsável por decidir qual informação antiga da 'memória longa' deve ser descartada ou esquecida?", "o": ["Input Gate", "Forget Gate", "Output Gate", "Memory Gate"], "c": 1},
            {"q": "O modelo GRU (Gated Recurrent Unit) é semelhante ao LSTM, mas com qual vantagem prática?", "o": ["Ele só funciona no idioma Inglês.", "Ele não usa portas matemáticas.", "Ele combina algumas portas do LSTM (simplificando a arquitetura), tornando o treinamento computacionalmente mais rápido, frequentemente com performance semelhante.", "Ele é imune ao Overfitting de imagens 3D."], "c": 2},
            {"q": "A técnica de 'Word Embeddings' (como Word2Vec ou GloVe) no Processamento de Linguagem Natural (NLP) revolucionou o Deep Learning porque:", "o": ["Traduziu todas as palavras para código binário (0s e 1s).", "Mapeia palavras para vetores densos de números contínuos, onde palavras com significados/contextos semelhantes ficam fisicamente próximas no espaço N-dimensional.", "Conta as palavras mais repetidas em um texto.", "Muda a cor do texto no Python."], "c": 1},
            {"q": "Em Transfer Learning (Aprendizado por Transferência) de Deep Learning, qual é a principal estratégia abordada?", "o": ["Transferir a execução do código do CPU para o GPU.", "Pegar um modelo pré-treinado em um dataset gigante (ex: ImageNet ou textos da web) e apenas treinar as camadas finais em um dataset pequeno e específico, economizando tempo e dados.", "Transferir o código-fonte de Python para C++.", "Transferir o modelo de uma empresa para outra fisicamente."], "c": 1},
            {"q": "O que é 'Fine-Tuning' em Transfer Learning?", "o": ["Ouvir música durante o código.", "Limpar o banco de dados SQL antes do treino.", "Descongelar algumas (ou todas) as camadas superiores do modelo pré-treinado e continuar o treinamento no novo dataset com uma Taxa de Aprendizado (Learning Rate) bem baixa, para ajustar os pesos à nova tarefa específica.", "Diminuir o tamanho do arquivo do modelo em disco."], "c": 2},
            {"q": "Qual é a base da arquitetura 'Transformer', que revolucionou a IA moderna e os LLMs (Large Language Models como o ChatGPT)?", "o": ["Ela se baseia puramente em Redes Neurais Convolucionais para processar texto.", "O uso de K-Means para agrupar as letras do texto em sílabas perfeitas.", "A eliminação da recorrência (RNNs) usando massivamente mecanismos de 'Attention' (Auto-Atenção), permitindo o processamento de toda a sequência em paralelo e capturando longas dependências.", "O uso exclusivo da Regressão Linear com matrizes esparsas."], "c": 2},
            {"q": "O mecanismo de 'Self-Attention' (Auto-Atenção) permite que o modelo de Deep Learning:", "o": ["Tenha consciência, como uma Inteligência Artificial Geral (AGI).", "Calcule a importância e o peso de cada palavra na frase em relação a TODAS as outras palavras da mesma frase simultaneamente, para entender ambiguidades de contexto.", "Foque apenas na última palavra escrita pelo usuário.", "Preste atenção no limite de memória RAM e pare o processo sozinho."], "c": 1},
            {"q": "As Redes Adversárias Generativas (GANs) operam com dois modelos de rede neural competindo entre si. Quais são eles?", "o": ["O Atacante e o Defensor.", "O Gerador (que cria dados sintéticos/fake tentando enganar) e o Discriminador (que tenta descobrir se o dado é real ou criado pelo Gerador).", "O Encoder e o Decoder.", "O Cliente e o Servidor SQL."], "c": 1},
            {"q": "O TensorFlow e o PyTorch são os dois frameworks dominantes de Deep Learning. Qual é uma característica técnica nativa e forte do PyTorch (desenvolvido pela Meta/Facebook)?", "o": ["Ele só roda em ambientes Windows offline.", "Ele é escrito inteiramente em linguagem R.", "Uso de Grafos Computacionais Dinâmicos (rodando os cálculos de forma imperativa e facilitando o debug linha a linha no Python).", "Ele não aceita o uso de placas de vídeo (GPUs) para acelerar o processo."], "c": 2},
            {"q": "O que o termo 'Tensor' significa nos frameworks de Deep Learning (como PyTorch/TensorFlow)?", "o": ["A tensão elétrica exigida pela GPU.", "A velocidade do modelo em milissegundos.", "Uma generalização matemática multidimensional para arrays (ex: 0D = Escalar, 1D = Vetor, 2D = Matriz, 3D+ = Tensor), otimizado para operações na GPU.", "Um tipo de licença de software de código aberto."], "c": 2},
            {"q": "Para acelerar enormemente o treinamento de Deep Learning (que envolve bilhões de multiplicações de matrizes), os cientistas de dados dependem de qual hardware paralelo?", "o": ["CPUs com muitos Megahertz.", "Múltiplos Monitores.", "Placas de Vídeo / GPUs (Graphical Processing Units, ex: CUDA/NVIDIA) ou TPUs (Tensor Processing Units).", "Discos Rígidos (HDD) rápidos."], "c": 2},
            {"q": "A técnica de 'Data Augmentation' (Aumento de Dados) em Visão Computacional ajuda a evitar o Overfitting fazendo o quê?", "o": ["Comprando mais dados de concorrentes.", "Gerando versões artificialmente modificadas do dataset original durante o treino (aplicando rotações, zoom, recortes e espelhamentos nas imagens), tornando a CNN mais generalista.", "Duplicando as linhas no banco de dados sem nenhuma alteração.", "Melhorando a resolução das fotos com IA externa."], "c": 1},
            {"q": "Um 'Autoencoder' tem duas partes principais: o Encoder (Codificador) e o Decoder (Decodificador). O que o Encoder gera na saída dele (no meio da rede)?", "o": ["A exclusão do arquivo.", "O erro final do Backpropagation.", "Uma representação compacta e comprimida da entrada original, no espaço latente (Latent Space ou Bottleneck).", "A matriz de confusão."], "c": 2},
            {"q": "Em NLP (Processamento de Linguagem Natural), a técnica de 'Tokenização' (Tokenization) significa:", "o": ["Criptografar palavras com tokens bancários de segurança.", "Traduzir de Português para Inglês.", "Apagar as pontuações e números do texto sem salvar.", "Dividir o texto bruto em pedaços menores (tokens), que podem ser palavras individuais, subpalavras ou caracteres, para a rede processar numericamente."], "c": 3},
            {"q": "A inicialização correta dos Pesos em uma Rede Neural (ex: Xavier/Glorot Initialization ou He Initialization) é crítica para o sucesso do modelo porque:", "o": ["Inicializar tudo com Zero garante que a rede aprenda perfeitamente desde o começo.", "Ela previne que as ativações expludam ou sumam nas primeiras passadas para frente, ajudando os gradientes a fluírem estavelmente no Backpropagation.", "Ela poupa armazenamento no disco.", "Ela exclui imagens corrompidas do lote."], "c": 1},
            {"q": "A métrica de Perda 'Cross-Entropy' em uma rede de classificação multiclasse se baseia em comparar as previsões do modelo (probabilidades) com:", "o": ["A precisão final global.", "O tempo de CPU gasto no momento.", "O One-Hot Encoding das classes reais (onde a resposta certa vale 1 e o restante vale 0). A rede é penalizada logaritmicamente por estar confiante na classe errada.", "As coordenadas de pixels de imagens não-supervisionadas."], "c": 2},
            {"q": "Por que o número de neurônios na última camada (output layer) de um modelo de regressão profunda geralmente é 1 (sem função de ativação final)?", "o": ["Porque o modelo precisa retornar um único valor numérico contínuo como previsão final (ex: o valor da casa).", "Porque a RAM do sistema limita a última camada a apenas 1 neurônio.", "Porque a regressão exige saídas entre 0 e 1.", "Porque o Backpropagation suporta apenas 1 nó por padrão."], "c": 0}
