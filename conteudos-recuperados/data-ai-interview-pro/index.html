        "Módulo 8": [
            {"q": "O que a técnica de 'Stemming' faz em Processamento de Linguagem Natural (NLP)?", "o": ["Substitui palavras por sinônimos.", "Reduz as palavras ao seu radical (caule) cortando os sufixos e prefixos, muitas vezes gerando palavras que não existem no dicionário (ex: 'correndo' vira 'corr').", "Converte todas as letras maiúsculas em minúsculas.", "Agrupa frases inteiras por contexto semântico."], "c": 1},
            {"q": "Como a 'Lematização' (Lemmatization) se diferencia do Stemming?", "o": ["A lematização é muito mais rápida e simples computacionalmente.", "A lematização mapeia as palavras para a sua raiz base no dicionário (lema), analisando a morfologia e o contexto (ex: 'fui' vira 'ir'). É mais lenta e precisa.", "Não há diferença, são sinônimos em Python.", "A lematização apenas remove a pontuação do texto."], "c": 1},
            {"q": "Na limpeza de textos, o que são as chamadas 'Stopwords'?", "o": ["Caracteres especiais como @ e #.", "Palavras com erros ortográficos.", "Palavras muito comuns em um idioma (como 'o', 'a', 'de', 'e') que geralmente não agregam significado direto ao modelo e são removidas para poupar processamento.", "Pontos finais que encerram uma frase (stops)."], "c": 2},
            {"q": "Qual a principal limitação da abordagem 'Bag of Words' (Saco de Palavras) tradicional?", "o": ["Ela não consegue contar o número de palavras.", "Ela requer uma GPU dedicada para rodar.", "Ela converte texto para imagens.", "Ela ignora completamente a ordem das palavras e o contexto semântico da frase, tratando o documento apenas como uma contagem de frequência de vocabulário."], "c": 3},
            {"q": "O que a métrica TF-IDF (Term Frequency - Inverse Document Frequency) penaliza em um conjunto de documentos (Corpus)?", "o": ["Palavras que são muito frequentes no documento atual, mas que aparecem em quase todos os outros documentos do corpus (reduzindo o peso de palavras comuns não filtradas).", "Palavras raras e difíceis que aparecem em apenas um documento.", "O uso excessivo de verbos no infinitivo.", "O tamanho do documento, excluindo textos curtos."], "c": 0},
            {"q": "No cálculo do TF-IDF, o que a parte 'TF' (Term Frequency) mede isoladamente?", "o": ["O número de palavras no corpus inteiro.", "A proporção (ou contagem bruta) de vezes que um termo específico aparece dentro de um único documento.", "O inverso do tempo de leitura do texto.", "A quantidade de caracteres da palavra."], "c": 1},
            {"q": "Em NLP moderno, os Modelos de Word Embeddings (ex: Word2Vec, GloVe) representam as palavras como:", "o": ["Tags HTML.", "Letras embaralhadas aleatoriamente.", "Números inteiros em ordem alfabética.", "Vetores densos de números contínuos em um espaço N-dimensional, onde a proximidade espacial indica similaridade semântica."], "c": 3},
            {"q": "O algoritmo Word2Vec possui duas arquiteturas clássicas para treinar embeddings: Skip-Gram e CBOW. O que o CBOW (Continuous Bag of Words) tenta prever?", "o": ["A palavra alvo central baseando-se nas palavras de contexto ao redor dela.", "O contexto ao redor (vizinhança) baseando-se apenas em uma única palavra alvo.", "A classe gramatical do texto inteiro.", "O final de um livro."], "c": 0},
            {"q": "E o que a arquitetura 'Skip-Gram' do Word2Vec tenta fazer?", "o": ["Ela usa uma palavra alvo de entrada para prever a probabilidade das palavras de contexto (vizinhança) que a cercam.", "Pula as palavras mais importantes da frase para economizar memória.", "Reconhece imagens no meio do texto.", "Transforma arquivos PDF em texto simples."], "c": 0},
            {"q": "Se você subtrair o vetor de 'Homem' do vetor de 'Rei' e adicionar o vetor de 'Mulher' num espaço de Word2Vec bem treinado, o vetor resultante estará mais próximo de qual palavra?", "o": ["Príncipe", "Rainha", "Realeza", "Castelo"], "c": 1},
            {"q": "Qual é a principal limitação dos embeddings estáticos tradicionais como Word2Vec e GloVe?", "o": ["Eles ocupam Terabytes de memória RAM no Python.", "Apenas rodam em Linux.", "Eles não são de código aberto.", "Eles geram sempre o mesmo vetor para uma palavra, independentemente do contexto na frase (ex: o vetor de 'banco' de praça é o mesmo de 'banco' financeiro)."], "c": 3},
            {"q": "A tarefa de NLP chamada NER (Named Entity Recognition) visa identificar e classificar automaticamente o quê no texto?", "o": ["Nomes Próprios, Organizações, Localizações, Datas, Valores Monetários (Entidades Nomeadas).", "Erros de pontuação e gramática de estudantes.", "O idioma do texto e a sua tradução.", "Os sentimentos positivos ou negativos do autor."], "c": 0},
            {"q": "A tarefa de Part-of-Speech (POS) Tagging consiste em:", "o": ["Apagar as hashtags das redes sociais.", "Inserir partes faltantes na fala de um áudio.", "Rotular cada palavra de uma frase com a sua respectiva classe gramatical (ex: Substantivo, Verbo, Adjetivo).", "Fazer um resumo automático do texto (Summarization)."], "c": 2},
            {"q": "Como calculamos a semelhança entre dois vetores de palavras (Embeddings) ou de documentos de forma robusta e independente da magnitude (tamanho do texto)?", "o": ["Usando Regressão Linear Simples.", "Usando a Distância de Manhattan.", "Usando a Similaridade do Cosseno (Cosine Similarity), medindo o ângulo entre os dois vetores em vez da distância absoluta.", "Multiplicando as duas matrizes e tirando a raiz."], "c": 2},
            {"q": "Em Similaridade do Cosseno, qual valor indica que dois vetores estão apontando exatamente para a mesma direção (alta similaridade semântica)?", "o": ["1", "0", "-1", "100"], "c": 0},
            {"q": "O que caracteriza a arquitetura Seq2Seq (Sequence-to-Sequence), inicialmente popularizada por RNNs e amplamente usada em Tradução Automática?", "o": ["O uso de imagens para gerar textos (Image Captioning).", "Ela é baseada em regras 'If-Else' criadas por linguistas.", "Ela pega uma sequência de comprimento X como entrada e produz uma sequência de comprimento Y como saída, usando um Encoder e um Decoder.", "Ela converte textos gigantes em apenas uma única palavra de resumo."], "c": 2},
            {"q": "A Revolução do NLP moderno começou em 2017 com o artigo 'Attention Is All You Need', do Google, que introduziu a arquitetura:", "o": ["LSTM Bidirecional", "Transformer", "YOLO (You Only Look Once)", "Gated Recurrent Unit (GRU)"], "c": 1},
            {"q": "Ao contrário das RNNs, a arquitetura Transformer tem uma vantagem computacional massiva na fase de treinamento. Qual é ela?", "o": ["Elas não precisam de Matemática para funcionar.", "Elas não processam as palavras sequencialmente (uma a uma), mas sim de forma paralela, aproveitando ao máximo a computação paralela das GPUs.", "Elas treinam o modelo no disco rígido sem usar RAM.", "Elas só aceitam textos curtos, como tweets."], "c": 1},
            {"q": "Como os Transformers processam dados em paralelo (perdendo a noção da ordem original das palavras), que mecanismo eles utilizam para injetar informações sobre a posição (ordem temporal) de cada token na sequência?", "o": ["Positional Encoding (Codificação Posicional, usando funções seno e cosseno somadas aos embeddings).", "Timestamp Tagging (Etiquetagem de hora do relógio).", "Ordem Alfabética forçada.", "RNNs ocultas no final da rede."], "c": 0},
            {"q": "O que são as 'Attention Heads' (Múltiplas cabeças de atenção) em um modelo Transformer?", "o": ["Câmeras usadas no servidor.", "Múltiplos mecanismos de Self-Attention operando em paralelo no mesmo texto, permitindo que a rede foque em diferentes tipos de relações entre as palavras ao mesmo tempo (ex: sintaxe vs semântica).", "Vários cientistas supervisionando a rede.", "A técnica de reduzir o tamanho do texto gerado pela rede."], "c": 1},
            {"q": "O modelo BERT (Bidirectional Encoder Representations from Transformers), do Google, utiliza exclusivamente qual parte da arquitetura Transformer?", "o": ["Nenhuma parte.", "Apenas o bloco Decoder.", "Apenas o bloco Encoder (o que permite a leitura e o entendimento do contexto nos dois sentidos simultaneamente).", "Ele usa ambas (Encoder-Decoder) exatamente igual ao Transformer original."], "c": 2},
            {"q": "O BERT foi pré-treinado em duas tarefas não-supervisionadas principais (Self-Supervised). Uma delas é a 'Next Sentence Prediction' (NSP). Qual é a outra, considerada a mais importante para entender o contexto?", "o": ["Masked Language Modeling (MLM): mascarar/esconder aleatoriamente (15%) algumas palavras da frase e fazer a rede adivinhar quais são essas palavras baseadas no contexto ao redor.", "Tradução de Inglês para Português.", "Geração Autoregressiva infinita.", "Detecção de erros ortográficos."], "c": 0},
            {"q": "Diferente do BERT (focado em entender texto), a família GPT (Generative Pre-trained Transformer) da OpenAI é famosa pela Geração de Texto. O GPT utiliza qual parte da arquitetura Transformer?", "o": ["Apenas o bloco Encoder.", "Ele não usa Transformers.", "Apenas o bloco Decoder.", "O Encoder-Decoder empilhados 100 vezes."], "c": 2},
            {"q": "Como o GPT (um modelo Causal/Autoregressivo) gera texto durante a inferência (resposta ao usuário)?", "o": ["Lendo todo o texto de trás para frente.", "Imprimindo parágrafos inteiros de uma vez baseando-se em templates.", "Procurando no Google e copiando as respostas.", "Previsão token a token: ele prevê qual é o próximo token mais provável com base no contexto anterior, anexa essa previsão à entrada e repete o ciclo (Autoregressão)."], "c": 3},
            {"q": "Em LLMs (Large Language Models), o processo de Tokenização BPE (Byte-Pair Encoding) divide palavras raras ou desconhecidas em:", "o": ["Exclusão silenciosa (Ignora a palavra).", "Letras únicas (caracteres).", "Números de código de barras.", "Subpalavras (subwords) ou pedaços frequentes (ex: 'desacelerar' = 'des' + 'acelera' + 'r'), evitando um vocabulário infinito e lidando bem com erros de digitação."], "c": 3},
            {"q": "O que o parâmetro 'Temperature' (Temperatura) controla ao gerar textos com a API de um LLM (como ChatGPT)?", "o": ["A quantidade máxima de letras da resposta.", "A velocidade de digitação do robô na tela.", "A aleatoriedade/criatividade da saída. Temperatura próxima a 0 gera textos determinísticos (seguros e óbvios); temperatura mais alta aumenta a chance de escolhas mais improváveis (criativas/aleatórias).", "A censura do robô a assuntos sensíveis."], "c": 2},
            {"q": "E o que o parâmetro 'Top-P' (Nucleus Sampling) faz no controle de geração de um LLM?", "o": ["Exige a senha do administrador.", "Corta a cauda longa de probabilidade; ele considera apenas o subconjunto de tokens mais prováveis cuja probabilidade cumulativa atinge o limiar 'P' (ex: 0.9).", "Gera P imagens de uma vez.", "Multiplica a temperatura por P."], "c": 1},
            {"q": "A técnica de 'Zero-Shot Learning' em Prompt Engineering ocorre quando:", "o": ["O modelo exige 100 exemplos manuais antes de responder.", "Pedimos ao modelo realizar uma tarefa sem fornecer nenhum exemplo de como fazê-la no prompt, confiando puramente em seu conhecimento pré-treinado.", "O modelo não retorna resposta nenhuma (erro 0).", "Destruímos o modelo durante o treinamento."], "c": 1},
            {"q": "O que caracteriza um prompt de 'Few-Shot Learning'?", "o": ["Fazer perguntas sobre imagens em alta resolução.", "Dar poucos tiros/chances de o modelo acertar antes de resetá-lo.", "Escrever o prompt com o menor número de letras possível.", "Fornecer 2 a 5 exemplos claros da tarefa resolvida no próprio prompt (contexto) para guiar o formato da resposta que o modelo deve gerar."], "c": 3},
            {"q": "A técnica 'Chain-of-Thought' (CoT / Cadeia de Pensamento) melhora muito a performance de LLMs em problemas de raciocínio lógico e matemática. Como ela é implementada no prompt?", "o": ["Ameaçando o modelo de desligamento se ele errar.", "Traduzindo a pergunta para Código Python e enviando no terminal.", "Adicionando frases como 'Vamos pensar passo a passo', forçando o modelo a externalizar a lógica intermediária antes de cuspir o resultado final.", "Colocando as letras todas em maiúsculas."], "c": 2},
            {"q": "Qual é a principal motivação técnica por trás do sistema RAG (Retrieval-Augmented Generation)?", "o": ["Eliminar a necessidade de hardware para rodar a IA.", "Criptografar os dados do banco antes de treinar a IA.", "Aumentar drasticamente a velocidade do processamento gerando menos texto.", "Fornecer conhecimento externo e atualizado ao LLM (através da busca de documentos numa base vetorial) para ancorar a resposta em fatos, minimizando alucinações."], "c": 3},
            {"q": "Em uma arquitetura RAG (Retrieval-Augmented Generation), o componente 'Retrieval' (Busca) normalmente utiliza qual tecnologia moderna para encontrar a documentação relevante na base de dados?", "o": ["Apenas pesquisa simples (Ctrl+F) por palavras exatas.", "Bancos de Dados Orientados a Grafos SQL.", "Banco de Dados Vetorial (Vector Database, ex: Pinecone, Milvus) realizando uma busca semântica por similaridade do cosseno.", "Armazenamento em fitas magnéticas (Cold Storage)."], "c": 2},
            {"q": "Ao criar um Vector Database para o RAG, o texto original precisa passar pelo processo de 'Chunking'. O que é isso?", "o": ["Cortar palavras consideradas ofensivas.", "Juntar os PDFs de várias pastas em um só arquivo grande.", "Converter tudo para arquivos CSV usando Pandas.", "Dividir os textos ou PDFs muito grandes em pedaços (blocos/parágrafos) menores sobrepostos, para que os embeddings sejam precisos e caibam no limite de contexto do LLM."], "c": 3},
            {"q": "Em relação à criação de LLMs, o que significa RLHF (Reinforcement Learning from Human Feedback)?", "o": ["Pagar usuários para ler livros ao lado do servidor.", "Um método de treinamento onde humanos não participam.", "O passo final do treinamento (alinhamento), onde o modelo é ajustado a preferir respostas seguras, educadas e úteis, utilizando um modelo de recompensa treinado com base em avaliações humanas.", "Apenas o processo bruto de prever a próxima palavra."], "c": 2},
            {"q": "O limite de 'Context Window' (Janela de Contexto) de um modelo GPT-4 (ex: 128k tokens) se refere a quê?", "o": ["O limite de vezes que o sistema operacional Windows pode chamar a API por dia.", "O número máximo de palavras/tokens que o modelo consegue processar simultaneamente em uma única interação (somando o prompt de entrada + histórico + saída gerada).", "O limite do cartão de crédito do cientista de dados.", "O tamanho em gigabytes do arquivo do modelo."], "c": 1},
            {"q": "Uma 'Alucinação' (Hallucination) em Modelos de Linguagem Grande ocorre quando o modelo:", "o": ["Falha em carregar e a tela trava.", "Acerta a resposta matematicamente com 100% de confiança.", "Passa nos testes de Turing sem ser percebido.", "Gera uma resposta confiante e gramaticalmente correta, mas que é factualmente falsa ou inventada, pois ele apenas prevê a próxima palavra sem 'entender' a realidade."], "c": 3},
            {"q": "A métrica BLEU (Bilingual Evaluation Understudy) é tradicionalmente usada para avaliar automaticamente:", "o": ["O nível de similaridade gramatical de frases traduzidas contra uma ou mais referências criadas por humanos (focando fortemente em precisão/sobreposição N-grams).", "A velocidade da placa de vídeo.", "O lucro de sistemas de banco de dados.", "A alucinação do ChatGPT em redações de ENEM."], "c": 0},
            {"q": "Já a métrica ROUGE é mais utilizada para avaliar qual tarefa específica de NLP?", "o": ["Criação de código fonte Python.", "Detecção de erros ortográficos.", "Geração de imagens.", "Sumarização de Textos (focando em Recall - se a máquina incluiu a essência do resumo humano de referência)."], "c": 3},
            {"q": "No mundo Open Source dos LLMs, técnicas como LoRA (Low-Rank Adaptation) são utilizadas na fase de Fine-Tuning para qual objetivo?", "o": ["Baixar a resolução das imagens de Deep Learning.", "Omitir informações de copyright dos datasets.", "Permitir o ajuste fino de modelos gigantescos treinando apenas uma pequena fração dos pesos em matrizes de baixo rank, economizando absurdamente em Memória RAM/VRAM.", "Aumentar o número total de parâmetros do modelo para superar o GPT-4."], "c": 2},
            {"q": "O que define a técnica de RAG 'Avançado' chamada Re-Ranking (Re-classificação)?", "o": ["Apenas classificar os usuários do chatbot por VIP ou Normal.", "Aumentar os salários dos cientistas de dados.", "Embaralhar as palavras do prompt por segurança.", "No pipeline de busca, o banco vetorial traz dezenas de documentos candidatos rápidos, e em seguida um modelo secundário 'Cross-Encoder' faz um ranqueamento lento e minucioso de relevância antes de enviar para o LLM."], "c": 3},
            {"q": "O que significa 'In-Context Learning' (Aprendizado em Contexto) num LLM moderno?", "o": ["O modelo atualiza seus pesos internos para sempre.", "A capacidade de ensinar temporariamente a IA a realizar uma tarefa sem treinar (alterar os pesos) da rede neural, apenas passando instruções e dados novos pelo prompt na hora da conversa.", "O download de tutoriais na memória do computador.", "A necessidade de treinar um novo modelo a cada novo cliente que a empresa adquire."], "c": 1},
            {"q": "Uma Rede Neural Convolucional 1D (CNN 1D) pode ser aplicada a textos em NLP?", "o": ["Não, CNNs só funcionam para fotos JPG.", "Sim. Em vez de deslizar filtros sobre pixels espaciais, os filtros deslizam sequencialmente ao longo de embeddings de palavras/caracteres para extrair N-gramas importantes e sentimentos rapidamente.", "Não, porque textos não são números.", "Sim, mas ela converte o texto em um vídeo curto."], "c": 1},
            {"q": "A técnica de 'N-grams' em Análise de Texto visa extrair:", "o": ["Conjuntos contínuos de N palavras adjacentes de uma frase (ex: Bi-gramas 'carro azul', 'azul rápido') para reter um pouco de contexto de ordem.", "O peso molecular do texto em megabytes.", "A formatação de parágrafos em CSS.", "Métricas de correlação em matrizes."], "c": 0},
            {"q": "O 'Vocabulary' (Vocabulário) em um projeto de NLP clássico, criado usando o `CountVectorizer` do scikit-learn, representa:", "o": ["A lista de livros recomendada pelo autor.", "Todas as classes numéricas preditivas.", "Uma lista de links retirados de sites.", "A lista de todas as palavras (features/colunas) conhecidas após o treinamento no texto bruto, que servirá de base para a matriz de palavras do modelo."], "c": 3},
            {"q": "Para lidar com palavras fora do vocabulário na inferência de modelos mais antigos de NLP, os programadores substituíam essas palavras pelo token:", "o": ["<OOV> (Out of Vocabulary) ou <UNK> (Unknown).", "<START>", "<PAD>", "<ERROR>"], "c": 0},
            {"q": "Na montagem de modelos RNN ou CNN para texto, o comprimento das sentenças de entrada precisa ser o mesmo para o processamento em lotes (batch). Como resolvemos sentenças de tamanhos diferentes?", "o": ["Nós deletamos as sentenças longas do banco.", "Dizemos para o usuário escrever textos menores.", "Processamos linha por linha usando For Loop eterno.", "Aplicamos 'Padding' (Preenchimento) com zeros nas sentenças curtas e truncamos (cortamos) as muito longas até que todas tenham o comprimento 'Max_Len' escolhido."], "c": 3},
            {"q": "Em NLP, a função do LangChain (framework Python popular no universo das GenAIs) é principalmente:", "o": ["Orquestrar aplicações complexas impulsionadas por LLMs, conectando modelos de linguagem a ferramentas de agentes (APIs, calculadoras, bancos vetoriais, memórias e agentes de roteamento).", "Criar interfaces visuais em CSS3.", "Treinar Redes Neurais do absoluto zero em linguagem C++.", "Fazer Web Scraping (raspar sites invisíveis) ilegalmente."], "c": 0},
            {"q": "Em um Agente de IA (Agentic AI), o que diferencia o agente de uma simples chamada RAG?", "o": ["O Agente é mais lento e custa mais caro apenas.", "Ele não usa linguagem natural.", "O Agente usa o LLM como um motor de raciocínio (cérebro) que planeja etapas, usa ferramentas externas (Action) e analisa as próprias respostas (Observation) dinamicamente para cumprir um objetivo complexo.", "O agente escreve em código Morse."], "c": 2},
            {"q": "A métrica 'Perplexity' (Perplexidade) é tradicionalmente usada para medir o quê no treinamento de um Modelo de Linguagem?", "o": ["A confusão visual do usuário na tela do chat.", "A velocidade de digitação em WPM.", "O grau de surpresa do modelo ao ver um dado de teste. Quanto mais BAIXA a perplexidade, melhor o modelo está prevendo a verdadeira sequência de palavras.", "O custo final da API em Dólares."], "c": 2},
            {"q": "O que um Guardrail em sistemas de Inteligência Artificial Generativa empresariais faz?", "o": ["Ele desliga a luz do escritório à noite.", "Limpa vírus de pendrives inseridos no servidor.", "Mecanismos e regras programadas que envolvem e intermediam as chamadas do LLM, bloqueando vazamento de dados confidenciais ou a geração de respostas racistas/inadequadas pela IA.", "Controla as falhas de conexão de internet do TI."], "c": 2}

        "Módulo 9": [
            {"q": "Quais são os tradicionais '3 Vs' que definem o conceito de Big Data?", "o": ["Virtualização, Variância e Vetores.", "Volume, Velocidade e Variedade.", "Validação, Visualização e Veracidade.", "Vendas, Visitas e Valores."], "c": 1},
            {"q": "O Hadoop foi um dos primeiros frameworks para Big Data. O HDFS (Hadoop Distributed File System) serve principalmente para:", "o": ["Processar dados em tempo real na memória RAM.", "Armazenar arquivos massivos dividindo-os em blocos distribuídos em um cluster de computadores (nós).", "Criar interfaces gráficas para bancos de dados.", "Rodar modelos de Deep Learning em GPUs."], "c": 1},
            {"q": "Qual foi a grande inovação do Apache Spark em relação ao antigo Hadoop MapReduce?", "o": ["O Spark roda em smartphones.", "O Spark processa os dados principalmente em Memória RAM (In-Memory Processing), sendo ordens de grandeza mais rápido que o MapReduce, que lia e gravava no disco a cada etapa.", "O Spark não usa código de programação, apenas botões.", "O Spark usa apenas a linguagem C++."], "c": 1},
            {"q": "No Apache Spark, o que é um RDD (Resilient Distributed Dataset)?", "o": ["Um banco de dados relacional na nuvem AWS.", "A estrutura de dados fundamental do Spark: uma coleção imutável e distribuída de objetos que pode ser processada em paralelo num cluster.", "Um formato de arquivo de imagem.", "Um modelo de IA pré-treinado."], "c": 1},
            {"q": "O Spark utiliza um conceito chamado 'Avaliação Preguiçosa' (Lazy Evaluation). O que isso significa na prática?", "o": ["Ele desliga o servidor quando ninguém está usando.", "As transformações (ex: filter, map) não são executadas imediatamente. O Spark apenas monta um plano de execução (DAG) e só processa os dados quando uma 'Ação' (ex: collect, count) é chamada.", "Ele processa os dados lentamente para poupar energia.", "Ele ignora linhas de código muito complexas."], "c": 1},
            {"q": "O formato de arquivo 'Parquet' é extremamente popular no ecossistema de Big Data e Spark porque:", "o": ["Ele é um formato de vídeo 4K.", "Ele armazena os dados em formato de texto simples (como um bloco de notas), facilitando a leitura por humanos.", "Ele é um formato de armazenamento Colunar (Columnar Storage), altamente comprimido e otimizado para consultas analíticas rápidas.", "Ele só roda no sistema operacional Linux."], "c": 2},
            {"q": "Qual a diferença conceitual entre um Data Lake e um Data Warehouse?", "o": ["Um Data Lake armazena apenas dados estruturados e tabelas limpas; um Data Warehouse armazena imagens.", "Não há diferença, são marcas concorrentes.", "Um Data Warehouse exige que os dados sejam estruturados (Schema-on-Write) antes de entrar; um Data Lake aceita dados crus de todos os formatos (estruturados, não estruturados, logs, imagens) usando Schema-on-Read.", "O Data Lake fica na nuvem, o Warehouse fica em pendrives."], "c": 2},
            {"q": "O termo 'Data Lakehouse' surgiu recentemente para descrever uma arquitetura que:", "o": ["Combina a flexibilidade e escalabilidade barata de um Data Lake com o rigor, confiabilidade e transações ACID de um Data Warehouse tradicional.", "Um armazém físico de servidores perto de lagos para resfriamento.", "Um banco de dados exclusivo para startups.", "Um sistema que apaga dados antigos automaticamente."], "c": 0},
            {"q": "Para lidar com fluxos de dados contínuos e em tempo real (Streaming), qual plataforma distribuída de mensageria/eventos é considerada o padrão da indústria?", "o": ["Microsoft Excel", "Apache Kafka", "SQLite", "Tableau"], "c": 1},
            {"q": "Em engenharia de dados, o que significa a sigla ETL?", "o": ["Extração de Textos Longos.", "Execute, Test, Launch.", "Extract, Transform, Load (Extrair dados das fontes, Transformar/limpar e Carregar no destino analítico).", "Engenharia de Tecnologia Limitada."], "c": 2},
            {"q": "A ferramenta Apache Airflow é amplamente utilizada em dados e MLOps para:", "o": ["Orquestrar, agendar e monitorar fluxos de trabalho (pipelines) de dados por meio de grafos direcionados acíclicos (DAGs) escritos em Python.", "Criar gráficos dinâmicos de barras.", "Treinar redes neurais profundas.", "Substituir o banco de dados SQL."], "c": 0},
            {"q": "A disciplina de MLOps (Machine Learning Operations) visa unir quais frentes em um projeto de IA?", "o": ["Apenas o RH com o setor de TI.", "Unir as práticas de Machine Learning, Engenharia de Dados e DevOps para garantir o deploy contínuo, escalável e confiável de modelos em produção.", "Marketing, Vendas e Atendimento.", "Unir linguagens de programação (Python, R e Java)."], "c": 1},
            {"q": "No pipeline de MLOps, o que é o 'Feature Store'?", "o": ["Uma loja online para comprar algoritmos prontos.", "Um HD externo para backup.", "Um repositório centralizado onde as variáveis (features) construídas para IA são armazenadas, versionadas e documentadas, para que diferentes equipes e modelos possam reutilizá-las sem reescrever o código.", "Uma parte da memória RAM do servidor."], "c": 2},
            {"q": "Qual é a principal função de um 'Model Registry' (Registro de Modelos), como o encontrado na ferramenta MLflow?", "o": ["Registrar o ponto de batida dos funcionários.", "Atuar como um catálogo central que rastreia versões de modelos de ML, metadados, métricas de treino e controla o ciclo de vida (ex: Staging, Production, Archived).", "Fazer o download automático de modelos do Google.", "Apagar modelos que estão consumindo muita memória."], "c": 1},
            {"q": "Em MLOps, a prática de CI/CD (Continuous Integration / Continuous Deployment) adaptada para IA se expande para adicionar o 'CT'. O que significa CT?", "o": ["Continuous Testing (Testar o código sem parar).", "Continuous Tuning (Sintonizar rádios de frequência).", "Continuous Training (Treinamento Contínuo): o pipeline automatizado que re-treina o modelo com novos dados para evitar a degradação da performance (Data Drift).", "Continuous Thinking (A rede neural nunca dorme)."], "c": 2},
            {"q": "Por que 'Containerizar' um modelo de IA usando Docker é uma prática essencial de MLOps?", "o": ["Para esconder o código do chefe.", "Garante que o modelo e todas as suas dependências (bibliotecas, versão do Python) rodem de forma idêntica em qualquer ambiente (laptop, servidor, nuvem), evitando o clássico erro 'na minha máquina funciona'.", "Para tornar o modelo não-supervisionado.", "Para burlar as regras da LGPD."], "c": 1},
            {"q": "Em um arquivo Dockerfile para empacotar um modelo de ML, o que o comando `FROM python:3.9-slim` faz?", "o": ["Deleta o Python do computador local.", "Ordena os dados da tabela.", "Define a Imagem Base (um sistema operacional mínimo com Python 3.9 instalado) a partir da qual o seu container será construído.", "Gera uma senha para o banco de dados."], "c": 2},
            {"q": "Quando falamos de orquestração de containers em escala massiva (ex: rodar centenas de instâncias do seu modelo na nuvem e reiniciar as que falharem), qual ferramenta é o padrão global?", "o": ["Kubernetes (K8s)", "WinRAR", "Jupyter Notebook", "Anaconda"], "c": 0},
            {"q": "Para servir um modelo de ML via web, os Cientistas de Dados frequentemente expõem o modelo como uma API REST. Quais bibliotecas Python leves são mais usadas para criar essa API (endpoints)?", "o": ["Pandas e NumPy", "Flask e FastAPI", "TensorFlow e PyTorch", "Matplotlib e Seaborn"], "c": 1},
            {"q": "No ecossistema da AWS (Amazon Web Services), qual é o serviço gerenciado focado especificamente em cobrir todo o ciclo de vida de Machine Learning (Treino, Deploy, Monitoramento)?", "o": ["Amazon S3", "AWS Lambda", "Amazon EC2", "Amazon SageMaker"], "c": 3},

            {"q": "A técnica de implantação 'Shadow Deployment' (Deploy em Sombra) em MLOps consiste em:", "o": ["Implantar o modelo na Dark Web.", "Implantar o modelo novo em produção processando o tráfego real dos usuários de forma invisível, mas as respostas retornadas ao cliente ainda vêm do modelo antigo. Serve para comparar as métricas sem risco de impactar o cliente.", "Esconder o código-fonte num pendrive.", "Rodar o modelo apenas durante a noite."], "c": 1},
            {"q": "O que caracteriza uma estratégia de 'Canary Deployment' (Implantação Canário) para um novo modelo de IA?", "o": ["O modelo envia um alerta sonoro quando erra.", "O novo modelo é implantado lentamente, enviando as predições apenas para uma pequena fração do tráfego real (ex: 5% dos usuários) para avaliar erros antes de rolar 100%.", "O modelo novo substitui o antigo instantaneamente em 100% dos servidores.", "O modelo atende apenas clientes novos, nunca os antigos."], "c": 1},
            {"q": "Teste A/B em produção para Modelos de ML difere do Canary porque:", "o": ["Não há diferença.", "O Teste A/B não avalia erros do servidor, mas sim métricas de negócio (ex: O Modelo A gerou mais vendas/cliques que o Modelo B?), direcionando o tráfego para testar hipóteses.", "O Teste A/B apaga o banco de dados se houver falha.", "O Canary só pode ser feito em Java."], "c": 1},
            {"q": "Como salvamos (serializamos) um modelo de ML simples treinado no Scikit-Learn (ex: Random Forest) em um arquivo na nossa máquina para usá-lo depois na API?", "o": ["Salvando como .txt e abrindo no bloco de notas.", "Tirando um Print Screen dos pesos.", "Usando as bibliotecas `pickle` ou `joblib` para salvar o objeto Python em disco (ex: modelo.pkl).", "Exportando para PDF."], "c": 2},
            {"q": "O formato ONNX (Open Neural Network Exchange) surgiu em MLOps para resolver qual grande dor de cabeça?", "o": ["Falta de espaço em disco.", "A interoperabilidade. Ele permite que um modelo treinado em um framework (ex: PyTorch) seja facilmente carregado e executado em outro framework ou linguagem de inferência (ex: C++ / TensorFlow).", "O vazamento de dados pessoais.", "O alto custo do licenciamento do Python."], "c": 1},
            {"q": "Em MLOps, o monitoramento contínuo é vital. A métrica 'Population Stability Index' (PSI) é usada na produção para monitorar o quê?", "o": ["O uso de CPU do servidor.", "O Data Drift. O PSI mede o quão diferente a distribuição dos dados de entrada (features) está agora em comparação com a época em que o modelo foi treinado.", "A quantidade de clientes online.", "A estabilidade do banco de dados SQL."], "c": 1},
            {"q": "Uma arquitetura de 'Serverless Computing' (Computação sem Servidor) como o AWS Lambda tem qual característica principal para rodar scripts simples de IA?", "o": ["Você compra um servidor físico e instala no escritório.", "O modelo fica rodando 24 horas por dia consumindo bateria.", "Você só paga pelos milissegundos que o código/modelo estiver executando, e o provedor da nuvem escala os recursos automaticamente.", "Não exige internet."], "c": 2},
            {"q": "Qual é o temido problema do 'Cold Start' (Partida a Frio) em funções Serverless aplicadas a modelos de ML?", "o": ["O ar-condicionado do data center quebra.", "Quando o modelo não recebe requisições por um tempo, a nuvem desliga o container. A próxima requisição sofrerá um forte atraso (latência alta) porque a nuvem precisa subir o ambiente e carregar os pesos do modelo na memória de novo.", "A linguagem Python trava no inverno.", "O modelo esquece os dados aprendidos."], "c": 1},
            {"q": "Computação de 'Edge' (Edge AI) é a estratégia de MLOps onde o modelo treinado:", "o": ["Roda nos servidores centrais do Google em alta velocidade.", "É descartado por estar na beira da obsolescência.", "É exportado para rodar diretamente nos dispositivos locais do usuário final (smartphones, sensores IoT, câmeras), economizando largura de banda, garantindo privacidade e latência zero (sem precisar ir à nuvem).", "Roda apenas em planilhas do Excel."], "c": 2},
            {"q": "Em infraestrutura na nuvem (Cloud), IaaS, PaaS e SaaS são conceitos-chave. AWS SageMaker é classicamente considerado um serviço do tipo:", "o": ["IaaS (Infrastructure as a Service)", "SaaS (Software as a Service)", "PaaS (Platform as a Service), pois oferece o ambiente e ferramentas gerenciadas para você construir sua IA sem se preocupar com a rede subjacente.", "MaaS (Metal as a Service)"], "c": 2},
            {"q": "O conceito de 'Infrastructure as Code' (IaC), através de ferramentas como Terraform, permite que a equipe de MLOps:", "o": ["Destrua a internet com um clique.", "Programe a criação, alteração e destruição de servidores, bancos de dados e redes usando scripts de código versionáveis (no Git), automatizando totalmente a infraestrutura da nuvem.", "Escreva algoritmos de Random Forest mais rápido.", "Converta arquivos HTML em Python."], "c": 1},
            {"q": "O que um 'API Gateway' faz na frente de um modelo de Machine Learning implantado?", "o": ["Ele desenha os gráficos de acurácia.", "Ele treina o modelo com novos dados em tempo real.", "Ele atua como a porta de entrada gerenciando o tráfego, controlando os acessos (autenticação), limitando requisições (rate limiting) e roteando as chamadas para os modelos corretos.", "Ele apaga requisições com dados nulos."], "c": 2},
            {"q": "Um Data Lake moderno usando arquitetura Delta Lake resolve qual deficiência dos Data Lakes primitivos?", "o": ["Falta de armazenamento infinito.", "A cor azul da interface gráfica.", "A incapacidade de atualizar ou deletar dados de forma confiável. O Delta Lake traz transações ACID, log de alterações e viagens no tempo (Time Travel) para cima de arquivos Parquet estáticos.", "O custo alto do hardware on-premise."], "c": 2},

        "Módulo 10": [
            {"q": "Na área de Dados, o que a métrica CAC (Customer Acquisition Cost) representa para o negócio?", "o": ["O custo anual de manter os servidores em nuvem.", "O valor médio que a empresa gasta em marketing e vendas para adquirir um único novo cliente.", "O custo total dos produtos vendidos.", "A taxa de cancelamento mensal."], "c": 1},

            {"q": "Uma regra de ouro em negócios digitais (SaaS) diz que a relação LTV / CAC ideal deve ser:", "o": ["LTV igual ao CAC (1:1).", "CAC pelo menos 3 vezes maior que o LTV (1:3).", "LTV pelo menos 3 vezes maior que o CAC (3:1 ou mais).", "Sempre zero."], "c": 2},
            {"q": "O que é 'Churn Rate' (Taxa de Cancelamento)?", "o": ["A porcentagem de clientes que pararam de usar/pagar o serviço em um determinado período.", "A taxa de cliques em um anúncio.", "A velocidade com que os dados chegam no Data Lake.", "A taxa de aprovação de crédito dos clientes novos."], "c": 0},
            {"q": "Se você é o Cientista de Dados e o CEO pede para prever 'Churn', qual técnica de ML você aplica?", "o": ["Regressão Linear para prever o lucro.", "Classificação Binária (Vai cancelar: Sim ou Não) associada à probabilidade (Risco de Churn).", "Clusterização K-Means exclusiva para achar clientes ricos.", "Filtro Colaborativo."], "c": 1},
            {"q": "Em um e-commerce, a métrica de 'Ticket Médio' (AOV - Average Order Value) é calculada por:", "o": ["Faturamento Total / Número de Pedidos.", "Número de Pedidos / Número de Clientes.", "Custo Total / Faturamento Total.", "Apenas o produto mais caro vendido no dia."], "c": 0},

            {"q": "Se o Custo Fixo de uma empresa é de 100 mil, e a Margem de Contribuição unitária do produto é de R$ 50,00, qual é o 'Ponto de Equilíbrio' (Break-Even Point) em unidades?", "o": ["5.000 unidades", "50.000 unidades", "2.000 unidades", "1.000 unidades"], "c": 2},

    // ==========================================
    // CÉREBRO CYBERPUNK DO SIMULADOR (JAVASCRIPT)
    // ==========================================
   let questoesAtuais = [];
    let qIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 60;

    const audioBg = document.getElementById('audio-bg');
    const audioCorrect = document.getElementById('audio-correct');
    const audioWrong = document.getElementById('audio-wrong');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function embaralharArray(array) {
        let copia = [...array];
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
    }

    function iniciarQuiz(moduloKey) {
        let bancoOriginal = bancoLocal[moduloKey];
        if(!bancoOriginal) return alert(">> FATAL ERROR: MODULO NÃO ENCONTRADO NO BANCO DE DADOS.");

        questoesAtuais = embaralharArray(bancoOriginal);
        qIndex = 0;
        score = 0;
        
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        document.getElementById('materia-titulo').innerText = moduloKey;
        
        audioBg.volume = 0.08;
        audioBg.play().catch(e => console.log("Áudio background inativo."));
        
        mostrarQuestao();
    }

    function mostrarQuestao() {
        if(qIndex >= questoesAtuais.length) return finalizar();
        
        const q = questoesAtuais[qIndex];
        document.getElementById('contador-questao').innerText = `[${qIndex + 1}/${questoesAtuais.length}]`;
        document.getElementById('question-text').innerText = "> " + q.q;
        
        let opcoesMapeadas = q.o.map((texto, indexOriginal) => {
            return { texto: texto, isCorrect: (indexOriginal === q.c) };
        });
        
        opcoesMapeadas = embaralharArray(opcoesMapeadas);
        
        let html = "";
        opcoesMapeadas.forEach((opt) => {
            let textoSeguro = opt.texto.replace(/'/g, "\\'");
            html += `<button class="btn option-btn" onclick="responder(this, ${opt.isCorrect}, '${textoSeguro}')">${opt.texto}</button>`;
        });
        
        document.getElementById('options-container').innerHTML = html;
        iniciarCronometro();
    }

    function iniciarCronometro() {
        clearInterval(timerInterval);
        timeLeft = 60;
        document.getElementById('timer-text').innerText = timeLeft;
        document.getElementById('timer-text').style.color = "var(--neon-cyan)";
        document.getElementById('timer-path').style.strokeDashoffset = '0';
        document.getElementById('timer-path').style.stroke = 'var(--neon-cyan)';
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = timeLeft;
            const offset = 220 - (timeLeft / 60) * 220;
            document.getElementById('timer-path').style.strokeDashoffset = offset;

            if(timeLeft <= 10) {
                document.getElementById('timer-path').style.stroke = 'var(--danger-red)';
                document.getElementById('timer-text').style.color = 'var(--danger-red)';
                if(timeLeft > 0) playBeep();
            }

            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                responder(null, false, null, true);
            }
        }, 1000);
    }

    function playBeep() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 900; 
        gain.gain.value = 0.05;
        osc.connect(gain); 
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function responder(btnElement, acertou, textoOpcao, tempoEsgotado = false) {
        clearInterval(timerInterval);
        const botoes = document.querySelectorAll('.option-btn');
        botoes.forEach(b => b.disabled = true);

        if(acertou) {
            if(btnElement) btnElement.classList.add('correct');
            audioCorrect.currentTime = 0; audioCorrect.play();
            score++;
        } else {
            if(btnElement) btnElement.classList.add('wrong');
            const q = questoesAtuais[qIndex];
            const textoCorreto = q.o[q.c];
            botoes.forEach(b => {
                if(b.innerText === textoCorreto) b.classList.add('correct');
            });
            audioWrong.currentTime = 0; audioWrong.play();
        }

        setTimeout(() => {
            qIndex++;
            mostrarQuestao();
        }, 2500); 
    }

    function finalizar() {
        clearInterval(timerInterval);
        audioBg.pause();
        audioBg.currentTime = 0;
        
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');
        
        const total = questoesAtuais.length;
        const porcentagem = Math.round((score / total) * 100);
        
        document.getElementById('score-display').innerText = `Outputs processados com sucesso: ${score} de ${total}`;
        document.getElementById('percent-display').innerText = `${porcentagem}%`;
        
        const feedback = document.getElementById('feedback-db');
        if(porcentagem >= 85) {
            feedback.innerHTML = `<span style='color: var(--neon-green);'>STATUS: APPROVED.<br>Parabéns! A sua performance lógica está no nível de engenharia Sénior. Preparado para a Sabatina Técnica.</span>`;
        } else if(porcentagem >= 60) {
            feedback.innerHTML = `<span style='color: var(--neon-cyan);'>STATUS: WARNING.<br>Bom trabalho. Porém, detetámos lacunas no processamento lógico. Reforce o embasamento teórico antes das entrevistas nas Big Techs.</span>`;
        } else {
            feedback.innerHTML = `<span style='color: var(--danger-red);'>STATUS: REJECTED.<br>Erro fatal de conhecimento. Volte aos estudos e recompile as suas bases fundamentais de Inteligência Artificial e Dados.</span>`;
        }
    }

    function voltarInicio() {
        clearInterval(timerInterval);
        audioBg.pause();
        audioBg.currentTime = 0;
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-result').classList.remove('active');
        document.getElementById('screen-start').classList.add('active');
    }
</script>
