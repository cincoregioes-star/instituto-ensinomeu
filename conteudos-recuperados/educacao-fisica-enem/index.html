  <style>
    :root{

    *{

      padding:20px 12px 40px;
      text-align:center;
      overflow-x:hidden;
    }

    header{
      max-width:1100px;
      margin:0 auto 24px;

      max-width:1100px;
      margin:0 auto;

      border:2px solid var(--blue);
      background:transparent;
      color:#fff;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:1rem;
      line-height:1.45;
      transition:.2s;
      white-space:normal;
      word-break:break-word;
      overflow-wrap:anywhere;

      color:#000;
      box-shadow:0 0 18px rgba(0,243,255,.35);
    }

    }

      color:#fff;
      box-shadow:none;
    }

    .btn.wrong{

      color:#fff!important;

      line-height:1.35;

      margin-bottom:10px;
      word-break:break-word;

      margin-bottom:18px;
      color:var(--pink);
      font-weight:bold;
      text-align:left;

      text-align:left;
      word-break:break-word;

      color:var(--yellow);

      margin-bottom:8px;
    }

    .text-base{
      display:block;
      background:rgba(255,255,255,.03);

      line-height:1.65;

      margin-bottom:16px;
      width:100%;
      max-width:100%;
    }

    .option-btn{
      width:100%;
      max-width:100%;

      text-align:left;
      min-height:58px;

      }
      .btn{
        font-size:.96rem;
        padding:13px 12px;
      }

<script>
const app = document.getElementById("app");
const audioBg = document.getElementById("audio-bg");
const audioCorrect = document.getElementById("audio-correct");
const audioWrong = document.getElementById("audio-wrong");

audioBg.volume = 0.06;
audioCorrect.volume = 0.45;
audioWrong.volume = 0.45;

let audioLiberado = false;
let areaAtual = "";

document.addEventListener("click", destravarAudio, { once: true });
document.addEventListener("touchstart", destravarAudio, { once: true });

function destravarAudio() {
  if (audioLiberado) return Promise.resolve(true);

  audioBg.muted = true;
  return audioBg.play()
    .then(() => {
      audioBg.pause();
      audioBg.currentTime = 0;
      audioBg.muted = false;
      audioLiberado = true;

      audioCorrect.play().then(() => {
        audioCorrect.pause();
        audioCorrect.currentTime = 0;
      }).catch(() => {});

      audioWrong.play().then(() => {
        audioWrong.pause();
        audioWrong.currentTime = 0;
      }).catch(() => {});

      return true;
    })
    .catch(() => false);
}

function tocarAudioFundo() {
  if (!audioLiberado) return;
  audioBg.currentTime = 0;
  audioBg.play().catch(() => {});
}

function pararAudioFundo() {
  audioBg.pause();
  audioBg.currentTime = 0;
}

function tocarAcerto() {
  audioCorrect.currentTime = 0;
  audioCorrect.play().catch(() => {});
}

function tocarErro() {
  audioWrong.currentTime = 0;
  audioWrong.play().catch(() => {});
}

function criarObjetiva(area, numero, textoBase, pergunta, alternativas, correta, comentario) {
  return {
    tipo: "objetiva",
    area,
    numero,
    base: textoBase,
    q: pergunta,
    o: alternativas,
    c: correta,
    coment: comentario
  };
}

function gerarQuestoes(area, lista) {
  return lista.map((item, i) =>
    criarObjetiva(area, i + 1, item.base, item.q, item.o, item.c, item.coment)
  );
}

function embaralharAlternativas(questao) {
  const pares = questao.o.map((texto, idx) => ({ texto, correta: idx === questao.c }));
  for (let i = pares.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pares[i], pares[j]] = [pares[j], pares[i]];
  }
  return {
    ...questao,
    opcoesRenderizadas: pares.map(p => p.texto),
    corretaRenderizada: pares.findIndex(p => p.correta)
  };
}

  "Saúde e Qualidade de Vida": gerarQuestoes("Saúde e Qualidade de Vida", [

    { base:`"Exercícios físicos devem respeitar limites e condições individuais."`, q:"Isso indica a importância de:", o:["Adequação da prática ao indivíduo","Treinar sempre no limite extremo","Ignorar sinais do corpo","Copiar qualquer treino"], c:0, coment:"A prática precisa considerar idade, condição e objetivo." },

    { base:`"A prevenção de doenças pode ser favorecida por hábitos saudáveis."`, q:"Um hábito preventivo importante é:", o:["Praticar atividade física regularmente","Dormir pouco sempre","Evitar água","Eliminar todo lazer"], c:0, coment:"Hábitos saudáveis reduzem riscos e favorecem bem-estar." },

    { base:`"Práticas de lazer ativo podem combater o sedentarismo."`, q:"Um exemplo de lazer ativo é:", o:["Caminhar no parque","Ficar o dia todo sentado","Dormir a tarde inteira sempre","Só assistir televisão"], c:0, coment:"Lazer ativo inclui movimento corporal no tempo livre." },

  "Treinamento Físico": gerarQuestoes("Treinamento Físico", [

    { base:`"A dança na escola amplia repertório cultural."`, q:"Trabalhar dança nas aulas pode:", o:["Valorizar expressão e cultura","Restringir a participação","Servir só para festa","Eliminar reflexão"], c:0, coment:"A dança amplia vivências corporais e culturais." },

};

function mostrarMenu() {
  pararAudioFundo();

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue); margin-bottom:8px;">Escolha um módulo de Educação Física</h2>
      <p class="mini">Cada módulo possui <strong>20 questões objetivas</strong>, com áudio e respostas embaralhadas.</p>
      <div class="grid-areas">
        ${areasEduFisica.map(area => `
          <div class="card-area">
            <h3>${area.nome}</h3>
            <p>${area.descricao}</p>
            <button class="btn" onclick="iniciarArea('${area.nome.replace(/'/g, "\\'")}')">Entrar neste módulo</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function iniciarArea(nomeArea) {
  destravarAudio();
  areaAtual = nomeArea;
  questoesAtuais = bancoQuestoes[nomeArea] || [];
  indiceQuestao = 0;
  acertosObjetivas = 0;
  questaoRenderizadaAtual = null;

  if (!questoesAtuais.length) {
    app.innerHTML = `
      <div class="box">
        <h2 style="color:var(--red);">Erro ao abrir o módulo</h2>
        <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
      </div>
    `;
    return;
  }

  setTimeout(() => {
    tocarAudioFundo();
  }, 120);

  carregarQuestao();
}

function montarEnunciado(questao) {
  return `
    <span class="question-label">Base para interpretação:</span>
    <span class="text-base">${questao.base}</span>
    <span class="question-label">Pergunta:</span>
    ${questao.q}
  `;
}

function carregarQuestao() {
  const questao = questoesAtuais[indiceQuestao];
  const total = questoesAtuais.length;
  questaoRenderizadaAtual = embaralharAlternativas(questao);

  let html = `
    <div class="box">
      <div class="status">
        <span>${areaAtual}</span>
        <span>Questão ${indiceQuestao + 1}/${total}</span>
      </div>
      <div id="question-text">${montarEnunciado(questaoRenderizadaAtual)}</div>
      <div class="options-wrap">
  `;

  questaoRenderizadaAtual.opcoesRenderizadas.forEach((alt, idx) => {
    html += `<button class="btn option-btn" onclick="responderObjetiva(${idx})">${alt}</button>`;
  });

  html += `
      </div>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;

  app.innerHTML = html;
}

function responderObjetiva(escolhida) {
  const botoes = document.querySelectorAll(".option-btn");
  const correta = questaoRenderizadaAtual.corretaRenderizada;

  botoes.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === correta) btn.classList.add("correct");
  });

  if (escolhida === correta) {
    acertosObjetivas++;
    tocarAcerto();
  } else {
    botoes[escolhida].classList.add("wrong");
    tocarErro();
  }

  setTimeout(() => {
    indiceQuestao++;
    if (indiceQuestao < questoesAtuais.length) {
      carregarQuestao();
    } else {
      finalizarArea();
    }
  }, 900);
}

function finalizarArea() {
  pararAudioFundo();

  const notaFinal = acertosObjetivas * 10;
  const totalPossivel = 200;
  let feedback = "Você concluiu este módulo completo de Educação Física. Continue treinando os demais módulos para avançar no simulado Gratuito.";

  if (notaFinal >= 160) feedback += " Excelente desempenho neste módulo.";
  else if (notaFinal >= 100) feedback += " Bom resultado. Ainda dá para elevar sua pontuação.";
  else feedback += " Este resultado mostra pontos que podem ser reforçados com mais treino.";

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue);">${areaAtual}</h2>
      <div class="result-number">${notaFinal}/${totalPossivel}</div>
      <div class="result-sub">Acertos: ${acertosObjetivas}/20</div>
      <p class="mini" style="margin-bottom:18px;">${feedback}</p>

      <button class="btn" onclick="iniciarArea('${areaAtual.replace(/'/g, "\\'")}')">Refazer este módulo</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

mostrarMenu();



</script>
