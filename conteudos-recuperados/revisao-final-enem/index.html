<header>
<h1>REVISÃO FINAL ENEM</h1>
<p>GRATUITO: 5 MÓDULOS • 50 QUESTÕES</p>
</header>


<div id="app"></div>

<audio id="bg" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3">
</audio>

<audio id="acerto">
<source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3">
</audio>

<audio id="erro">
<source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3232f.mp3">
</audio>

<script>

const app=document.getElementById("app");
const bg=document.getElementById("bg");
const acerto=document.getElementById("acerto");
const erro=document.getElementById("erro");

bg.volume=0.03;
acerto.volume=0.6;
erro.volume=0.6;

let moduloAtual="";
let questoes=[];
let index=0;
let acertosCount=0;
let travado=false;

function embaralhar(a){return a.sort(()=>Math.random()-0.5)}

function iniciarModulo(nome){
moduloAtual=nome;
questoes=banco[nome];
index=0;
acertosCount=0;

bg.currentTime=0;
bg.play().catch(()=>{});

carregar();
}

function carregar(){
travado=false;
let q=questoes[index];

let op=q.o.map((t,i)=>({t,c:i==q.c}));
op=embaralhar(op);

let correta=op.findIndex(x=>x.c);

app.innerHTML=`
<div class="box">
<h3>${moduloAtual}</h3>
<p>Questão ${index+1}/10</p>

<p>${q.q}</p>

${op.map((o,i)=>`<button class="btn opcao" onclick="responder(${i},${correta})">${o.t}</button>`).join("")}

<div id="coment" class="comment"></div>

<button id="nextBtn" class="btn" style="display:none" onclick="proxima()">Próxima</button>

<button class="btn" onclick="menu()">Menu</button>
</div>`;
}

function responder(escolha,correta){
if(travado)return;
travado=true;

let botoes=document.querySelectorAll(".opcao");
let coment=document.getElementById("coment");
let next=document.getElementById("nextBtn");

botoes.forEach((b,i)=>{
b.disabled=true;
if(i==correta)b.classList.add("correct");
if(i==escolha && escolha!=correta)b.classList.add("wrong");
});

if(escolha==correta){
acertosCount++;
acerto.play();
}else{
erro.play();
}

coment.style.display="block";
coment.innerHTML=questoes[index].coment;

next.style.display="block";
}

function proxima(){
index++;
if(index<questoes.length)carregar();
else finalizar();
}

function finalizar(){
bg.pause();
bg.currentTime=0;

app.innerHTML=`
<div class="box">
<h2>Resultado</h2>
<p>${acertosCount}/10</p>
<button class="btn" onclick="menu()">Menu</button>
</div>`;
}

function menu(){
bg.pause();
bg.currentTime=0;

app.innerHTML=`
<div class="box">
<h2>Escolha o módulo</h2>

<div class="grid">
${Object.keys(banco).map(m=>`
<button class="btn" onclick="iniciarModulo('${m}')">${m}</button>
`).join("")}
</div>

</div>`;
}
