  <style>
    :root{
      --bg:#05070c;
      --card:#11141b;
      --card2:#171b24;
      --blue:#00f3ff;
      --pink:#ff00e6;
      --green:#39ff14;
      --red:#ff003c;
      --yellow:#ffd400;
      --text:#ffffff;
      --muted:#cfcfcf;
      --line:rgba(255,255,255,.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#000;
      color:var(--text);
      min-height:100vh;
      padding:20px 12px 40px;
      text-align:center;
      overflow-x:hidden;
    }

    header{
      max-width:1100px;
      margin:0 auto 24px;
      border:2px solid var(--blue);
      border-radius:24px;
      padding:22px 16px;
      background:linear-gradient(180deg,#0c0f16,#090b11);
      box-shadow:0 0 22px rgba(0,243,255,.22);
    }

    header h1{
      color:var(--blue);
      font-size:clamp(2rem,4vw,3rem);
      text-shadow:0 0 14px rgba(0,243,255,.7);
      font-weight:900;
    }

    header p{
      margin-top:10px;
      color:var(--pink);
      font-weight:800;
      font-size:clamp(1rem,2vw,1.3rem);
    }

    #app{
      width:100%;
      max-width:1100px;
      margin:0 auto;
    }

    .box{
      width:100%;
      max-width:100%;
      background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px 16px;
      box-shadow:0 0 20px rgba(0,0,0,.35);
      overflow:hidden;
    }

    .btn{
      display:block;
      width:100%;
      max-width:560px;
      margin:10px auto;
      padding:14px 16px;
      border:2px solid var(--blue);
      background:transparent;
      color:#fff;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:1rem;
      line-height:1.45;
      transition:.2s;
      white-space:normal;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .btn:hover:not(:disabled){
      background:var(--blue);
      color:#000;
      box-shadow:0 0 18px rgba(0,243,255,.35);
    }

    .btn-voltar{
      border-color:#666;
      color:#ddd;
    }

    .btn-voltar:hover:not(:disabled){
      background:#333;
      color:#fff;
      box-shadow:none;
    }

    .btn.correct{
      background:var(--green) !important;
      border-color:var(--green) !important;
      color:#000 !important;
    }

    .btn.wrong{
      background:var(--red) !important;
      border-color:var(--red) !important;
      color:#fff !important;
    }

    .grid-areas{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      margin-top:18px;
    }

    .card-area{
      background:linear-gradient(135deg, rgba(0,243,255,.08), rgba(255,0,230,.08));
      border:1px solid rgba(0,243,255,.16);
      border-radius:16px;
      padding:16px;
      text-align:left;
      min-width:0;
    }

    .card-area h3{
      color:var(--blue);
      margin-bottom:8px;
      font-size:1.12rem;
      line-height:1.35;
      word-break:break-word;
    }

    .card-area p{
      color:#ddd;
      font-size:.95rem;
      line-height:1.45;
      margin-bottom:10px;
      word-break:break-word;
    }

    .status{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
      color:var(--pink);
      font-weight:bold;
      text-align:left;
    }

    #question-text{
      font-size:1.15rem;
      line-height:1.55;
      margin:20px 0;
      min-height:88px;
      text-align:left;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .options-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-bottom:16px;
      width:100%;
      max-width:100%;
    }

    .option-btn{
      width:100%;
      max-width:100%;
      margin:0;
      text-align:left;
      min-height:58px;
    }

    textarea{
      width:100%;
      min-height:140px;
      background:#0c0f14;
      border:2px solid var(--blue);
      color:#fff;
      border-radius:12px;
      padding:12px;
      font-size:1rem;
      resize:vertical;
      margin-bottom:14px;
    }

    .result-number{
      font-size:3rem;
      color:var(--blue);
      margin:12px 0;
      font-weight:900;
    }

    .result-sub{
      font-size:1.12rem;
      color:#ddd;
      margin-bottom:10px;
    }

    .mini{
      color:var(--muted);
      font-size:.96rem;
      line-height:1.5;
    }

    label{
      display:block;
      text-align:left;
      margin:10px 0 6px;
      color:var(--yellow);
      font-weight:bold;
    }

    .input-nota{
      width:100%;
      padding:12px;
      background:#101010;
      border:2px solid var(--blue);
      color:#fff;
      border-radius:10px;
      margin-bottom:12px;
    }

    .disc-box{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:16px;
      margin-bottom:16px;
      text-align:left;
    }

    .disc-box h3{
      color:var(--blue);
      margin-bottom:8px;
    }

    .disc-box p{
      margin-bottom:8px;
      line-height:1.5;
      word-break:break-word;
    }

    @media (max-width:700px){
      .grid-areas{
        grid-template-columns:1fr;
      }

      .box{
        padding:16px 12px;
      }

      #question-text{
        font-size:1.03rem;
      }

      .btn{
        font-size:.96rem;
        padding:13px 12px;
      }
    }

</style>

document.addEventListener("click", destravarAudio, { once: true });
document.addEventListener("touchstart", destravarAudio, { once: true });

function destravarAudio() {
  if (audioLiberado) return Promise.resolve(true);

  audioBg.muted = true;
  return audioBg.play()
    .then(() => {
      audioBg.pause();
      audioBg.currentTime = 0;
      audioBg.muted = false;
      audioLiberado = true;

      audioCorrect.play().then(() => {
        audioCorrect.pause();
        audioCorrect.currentTime = 0;
      }).catch(() => {});

      audioWrong.play().then(() => {
        audioWrong.pause();
        audioWrong.currentTime = 0;
      }).catch(() => {});

      return true;
    })
    .catch(() => false);
}

function tocarAudioFundo() {
  if (!audioLiberado) return;
  audioBg.currentTime = 0;
  audioBg.play().catch(() => {});
}

function pararAudioFundo() {
  audioBg.pause();
  audioBg.currentTime = 0;
}

  audioCorrect.currentTime = 0;

}

function tocarErro() {
  audioWrong.currentTime = 0;

function criarObjetiva(area, numero, pergunta, alternativas, correta, comentario) {
  return { tipo: "objetiva", area, numero, q: pergunta, o: alternativas, c: correta, coment: comentario };
}

function criarDiscursiva(area, numero, pergunta, gabarito) {
  return { tipo: "discursiva", area, numero, q: pergunta, gabarito };
}

function gerarAreaBase(nomeArea, perguntasObjetivas, discursivas) {
  const objetivas = perguntasObjetivas.map((item, i) =>
    criarObjetiva(nomeArea, i + 1, item.q, item.o, item.c, item.coment)
  );
  const disc = discursivas.map((item, i) =>
    criarDiscursiva(nomeArea, 21 + i, item.q, item.g)
  );
  return [...objetivas, ...disc];
}

      {q:"Explique a importância da Semana de Arte Moderna de 1922.",g:"Ela simboliza a ruptura com modelos tradicionais e a afirmação de novas linguagens artísticas no Brasil."},
      {q:"O que significa a busca modernista por brasilidade?",g:"Significa construir uma arte conectada à cultura, à fala, aos temas e às contradições do Brasil."}
    ]
  )
};

function mostrarMenu() {
  pararAudioFundo();
  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue); margin-bottom:8px;">Escolha uma área de Literatura</h2>
      <p class="mini">Cada área possui <strong>20 questões objetivas</strong> e <strong>2 discursivas</strong>.</p>
      <div class="grid-areas">
        ${areasLiteratura.map(area => `
          <div class="card-area">
            <h3>${area.nome}</h3>
            <p>${area.descricao}</p>
            <button class="btn" onclick="iniciarArea('${area.nome.replace(/'/g, "\\'")}')">Entrar nesta área</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

async function iniciarArea(nomeArea) {
  await destravarAudio();
  areaAtual = nomeArea;
  questoesAtuais = bancoQuestoes[nomeArea] || [];
  indiceQuestao = 0;
  acertosObjetivas = 0;
  respostasDiscursivas = ["", ""];
  notasDiscursivas = [0, 0];

  if (!questoesAtuais.length) {
    app.innerHTML = `
      <div class="box">
        <h2 style="color:var(--red);">Erro ao abrir a área</h2>
        <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
      </div>
    `;
    return;
  }

  setTimeout(() => {
    tocarAudioFundo();
  }, 120);

  carregarQuestao();
}

function carregarQuestao() {
  const questao = questoesAtuais[indiceQuestao];
  const total = questoesAtuais.length;

  let html = `
    <div class="box">
      <div class="status">
        <span>${areaAtual}</span>
        <span>Questão ${indiceQuestao + 1}/${total}</span>
      </div>
      <div id="question-text">${questao.q}</div>
  `;

  if (questao.tipo === "objetiva") {
    html += `<div class="options-wrap">`;
    questao.o.forEach((alt, idx) => {
      html += `<button class="btn option-btn" onclick="responderObjetiva(${idx})">${alt}</button>`;
    });
    html += `</div>`;
  } else {
    const discIndex = indiceQuestao - 20;
    html += `
      <textarea id="resposta-discursiva" placeholder="Digite sua resposta aqui...">${respostasDiscursivas[discIndex] || ""}</textarea>
      <button class="btn" onclick="salvarDiscursivaEAvancar()">Salvar resposta e continuar</button>
    `;
  }

  html += `<button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button></div>`;
  app.innerHTML = html;
}

function responderObjetiva(escolhida) {
  const questao = questoesAtuais[indiceQuestao];
  const botoes = document.querySelectorAll(".option-btn");

  botoes.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === questao.c) btn.classList.add("correct");
  });

  if (escolhida !== questao.c) {
    botoes[escolhida].classList.add("wrong");
    tocarErro();
  } else {
    acertosObjetivas++;
    tocarAcerto();
  }

  setTimeout(() => {
    indiceQuestao++;
    if (indiceQuestao < questoesAtuais.length) {
      carregarQuestao();
    } else {
      mostrarAvaliacaoDiscursivas();
    }
  }, 900);
}

function salvarDiscursivaEAvancar() {
  const discIndex = indiceQuestao - 20;
  respostasDiscursivas[discIndex] = document.getElementById("resposta-discursiva").value.trim();
  indiceQuestao++;

  if (indiceQuestao < questoesAtuais.length) {
    carregarQuestao();
  } else {
    mostrarAvaliacaoDiscursivas();
  }
}

function mostrarAvaliacaoDiscursivas() {
  pararAudioFundo();
  const discursivas = questoesAtuais.filter(q => q.tipo === "discursiva");

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--pink); margin-bottom:10px;">Avalie suas questões discursivas</h2>
      <p class="mini" style="margin-bottom:18px;">Dê uma nota de 0 a 10 para cada resposta com base no gabarito.</p>
      ${discursivas.map((q, i) => `
        <div class="disc-box">
          <h3>Discursiva ${i + 1}</h3>
          <p><strong>Pergunta:</strong> ${q.q}</p>
          <p><strong>Sua resposta:</strong><br>${respostasDiscursivas[i] ? respostasDiscursivas[i] : "<em>Não respondida</em>"}</p>
          <p style="color:var(--pink);"><strong>Gabarito esperado:</strong><br>${q.gabarito}</p>
          <label>Nota (0 a 10)</label>
          <input class="input-nota" type="number" min="0" max="10" value="${notasDiscursivas[i]}" data-index="${i}">
        </div>
      `).join("")}
      <button class="btn" onclick="finalizarArea()">Finalizar área</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

function finalizarArea() {
  const inputs = document.querySelectorAll(".input-nota");
  let somaDisc = 0;

  inputs.forEach(input => {
    let valor = Number(input.value);
    if (isNaN(valor) || valor < 0) valor = 0;
    if (valor > 10) valor = 10;
    somaDisc += valor;
  });

  const notaObjetiva = acertosObjetivas * 4;
  const notaDiscursiva = somaDisc;
  const notaFinal = notaObjetiva + notaDiscursiva;

  let feedback = "";
  if (notaFinal >= 85) feedback = "Excelente desempenho. Você está muito forte nessa área de Literatura.";
  else if (notaFinal >= 60) feedback = "Bom resultado. Com mais treino, sua nota pode subir bastante.";
  else feedback = "Você já identificou pontos de melhoria. Continue praticando e revisando.";

  app.innerHTML = `
    <div class="box">
      <h2 style="color:var(--blue);">${areaAtual}</h2>
      <div class="result-number">${notaFinal}/100</div>
      <div class="result-sub">Objetivas: ${notaObjetiva}/80 • Discursivas: ${notaDiscursiva}/20</div>
      <p class="mini" style="margin-bottom:18px;">${feedback}</p>
      <button class="btn" onclick="iniciarArea('${areaAtual.replace(/'/g, "\\'")}')">Refazer esta área</button>
      <button class="btn btn-voltar" onclick="mostrarMenu()">Voltar ao menu</button>
    </div>
  `;
}

mostrarMenu();
