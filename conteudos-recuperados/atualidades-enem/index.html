.btn{display:block;width:100%;max-width:100%;margin:10px auto;padding:14px 12px;border:2px solid var(--blue);background:transparent;color:#fff;border-radius:12px;cursor:pointer;font-weight:800;font-size:.98rem;white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.45;transition:.2s;text-align:center}

.enunciado{text-align:left;font-size:1.02rem;line-height:1.6;margin:15px 0;word-break:break-word;overflow-wrap:anywhere}
.base{display:block;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px;margin:8px 0 12px;color:#f2f2f2;font-style:italic;line-height:1.55}
.label{display:block;color:var(--yellow);font-weight:900;margin-bottom:7px}
.comment{display:none;margin-top:12px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;text-align:left;line-height:1.55;color:#eee}
.result-number{font-size:2.6rem;color:var(--blue);font-weight:900;margin:10px 0}
.mini{color:var(--muted);font-size:.95rem;line-height:1.5}
.badge{display:inline-block;margin:4px;padding:7px 10px;border-radius:999px;border:1px solid rgba(0,243,255,.25);color:#ddd;font-size:.82rem;font-weight:800}

<script>
const app=document.getElementById("app");
const bg=document.getElementById("bg");
const acertoAudio=document.getElementById("acertoAudio");
const erroAudio=document.getElementById("erroAudio");

bg.volume=0.025;
acertoAudio.volume=0.55;
erroAudio.volume=0.55;

let moduloAtual="";
let questoes=[];
let index=0;
let acertos=0;
let questaoAtual=null;
let travado=false;

const descricoes={
"Brasil e Política":"Instituições, democracia, poderes, eleições e cidadania.",
"Economia e Trabalho":"Inflação, juros, emprego, renda, tecnologia e mercado.",
"Meio Ambiente e Clima":"Aquecimento global, Amazônia, energia, água e sustentabilidade.",
"Tecnologia e Sociedade":"Inteligência artificial, redes sociais, dados, privacidade e inovação.",
"Saúde Pública":"SUS, vacinação, epidemias, saúde mental e prevenção.",
"Educação e Juventude":"Escola, ENEM, evasão, inclusão, cultura digital e formação.",
"Direitos Humanos e Cidadania":"Igualdade, diversidade, violência, inclusão e políticas sociais.",
"Geopolítica Mundial":"Conflitos, organismos internacionais, migração e relações globais.",
"Cultura, Mídia e Informação":"Fake news, imprensa, cultura brasileira, consumo e comportamento.",
"Atualidades ENEM Integrado":"Questões interdisciplinares no estilo ENEM."
};

function tocarBg(){bg.currentTime=0;bg.play().catch(()=>{})}
function pararBg(){bg.pause();bg.currentTime=0}
function tocarAcerto(){acertoAudio.currentTime=0;acertoAudio.play().catch(()=>{})}
function tocarErro(){erroAudio.currentTime=0;erroAudio.play().catch(()=>{})}

function embaralharArray(arr){
 const novo=[...arr];
 for(let i=novo.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [novo[i],novo[j]]=[novo[j],novo[i]];
 }
 return novo;
}
function escaparTexto(txt){
 return String(txt).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function menu(){
 pararBg();
 const nomes=Object.keys(banco);
 app.innerHTML=`
 <div class="box">
 <h2 style="color:var(--blue);margin-bottom:8px;">Escolha um módulo</h2>
 <p class="mini">Cada módulo possui <strong>20 questões</strong>, comentário explicativo e alternativas embaralhadas.</p>
 <div style="margin:12px 0;">
 <span class="badge">10 módulos</span>
 <span class="badge">200 questões</span>
 <span class="badge">Atualidades ENEM</span>
 </div>
 <div class="grid">
 ${nomes.map(m=>`
 <div class="card">
 <h3>${m}</h3>
 <p>${descricoes[m]||"Treino de atualidades."}</p>
 <button class="btn" onclick="iniciarModulo('${m}')">Entrar neste módulo</button>
 </div>`).join("")}
 </div>
 </div>`;
}
function iniciarModulo(nome){
 moduloAtual=nome;
 questoes=[...(banco[nome]||[])];
 index=0;
 acertos=0;
 travado=false;
 if(!questoes.length){
  app.innerHTML=`<div class="box"><h2 style="color:var(--red);">Módulo vazio</h2><button class="btn btn-menu" onclick="menu()">Retornar ao menu</button></div>`;
  return;
 }
 tocarBg();
 carregar();
}
function prepararQuestao(q){
 const opcoes=q.o.map((txt,i)=>({txt,correta:i===q.c}));
 const embaralhadas=embaralharArray(opcoes);
 return{...q,opcoes:embaralhadas,correta:embaralhadas.findIndex(o=>o.correta)};
}
function carregar(){
 travado=false;
 const q=questoes[index];
 questaoAtual=prepararQuestao(q);
 app.innerHTML=`
 <div class="box">
 <div class="status">
 <span>${moduloAtual}</span>
 <span>Questão ${index+1}/20</span>
 </div>
 <div class="enunciado">
 <span class="label">Base para resolução:</span>
 <span class="base">${escaparTexto(questaoAtual.base||"Leia a pergunta e escolha a alternativa correta.")}</span>
 <span class="label">Pergunta:</span>
 ${escaparTexto(questaoAtual.q)}
 </div>
 ${questaoAtual.opcoes.map((o,i)=>`
 <button class="btn opcao" onclick="responder(${i})">${escaparTexto(o.txt)}</button>
 `).join("")}
 <div id="comentario" class="comment"></div>
 <button id="btnProxima" class="btn btn-next" style="display:none" onclick="proxima()">Próxima pergunta</button>
 <button class="btn btn-menu" onclick="menu()">Retornar ao menu</button>
 </div>`;
}
function responder(escolha){
 if(travado)return;
 travado=true;
 const botoes=document.querySelectorAll(".opcao");
 const comentario=document.getElementById("comentario");
 const btnProxima=document.getElementById("btnProxima");
 const correta=questaoAtual.correta;

 botoes.forEach((b,i)=>{
  b.disabled=true;
  if(i===correta)b.classList.add("correct");
  if(i===escolha && escolha!==correta)b.classList.add("wrong");
 });

 if(escolha===correta){
  acertos++;
  tocarAcerto();
  comentario.innerHTML=`<strong style="color:var(--green);">Resposta correta.</strong><br>${escaparTexto(questaoAtual.coment)}`;
 }else{
  tocarErro();
  comentario.innerHTML=`<strong style="color:var(--red);">Resposta incorreta.</strong><br>${escaparTexto(questaoAtual.coment)}`;
 }
 comentario.style.display="block";
 btnProxima.style.display="block";
}
function proxima(){
 index++;
 if(index<questoes.length)carregar();
 else finalizar();
}
function finalizar(){
 pararBg();
 const perc=Math.round((acertos/questoes.length)*100);
 let nivel="Precisa reforçar";
 if(acertos>=17)nivel="Excelente";
 else if(acertos>=13)nivel="Bom desempenho";
 else if(acertos>=8)nivel="Atenção";

 app.innerHTML=`
 <div class="box">
 <h2 style="color:var(--blue);">${moduloAtual}</h2>
 <div class="result-number">${acertos}/20</div>
 <p class="mini">${perc}% de aproveitamento • ${nivel}</p>
 <div style="text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:15px 0;">
 <strong style="color:var(--yellow);">Diagnóstico:</strong><br>
 ${acertos>=13?"Bom desempenho neste módulo. Continue treinando os demais temas para fortalecer sua visão de atualidades.":"Refaça este módulo e revise os comentários. Atualidades exige leitura crítica e conexão entre temas."}
 </div>
 <button class="btn" onclick="iniciarModulo('${moduloAtual}')">Refazer este módulo</button>
 <button class="btn btn-menu" onclick="menu()">Retornar ao menu</button>
 </div>`;
}

{base:"O Poder Legislativo cria leis e fiscaliza o Executivo.",q:"No Brasil, o Legislativo federal é formado por:",o:["Câmara dos Deputados e Senado","Prefeituras e escolas","Tribunais e ministérios","Governadores e secretários"],c:0,coment:"O Congresso Nacional é composto por Câmara e Senado."},

{base:"Políticas públicas são ações do Estado para resolver problemas sociais.",q:"Qual é exemplo de política pública?",o:["Programa de vacinação","Venda informal sem regra","Opinião pessoal","Propaganda privada apenas"],c:0,coment:"Vacinação pública é ação estatal voltada à saúde coletiva."},

],
